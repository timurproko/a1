schema: spec-driven

context: |
  Git workflow:
  - master contains release-ready builds only.
  - develop is the default integration and development branch.
  - Large milestones use milestone/<name> branches created from develop.
  - Use Conventional Commits.
  - Commit after each completed OpenSpec task or coherent tested subtask.
  - Never include unrelated working-tree changes in a task commit.
  - Merge milestone branches into develop only after milestone gates pass.
  - Merge develop into master only after all mandatory release gates pass.
  - Tag releases only from master.

rules:
  tasks:
    - Define coherent task boundaries suitable for individual commits.
    - Identify mandatory validation required before completing each task.

operations:
  apply:
    guidance:
      - Check the current Git branch before editing.
      - Never implement directly on master.
      - Create or switch to the appropriate milestone branch for substantial work.
      - Run targeted validation before marking a task complete.
      - Commit each completed task with its tests and OpenSpec evidence.
      - Do not stage unrelated or pre-existing changes.
