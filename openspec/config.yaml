schema: spec-driven

context: |
  Development workflow:
  - Keep the primary worktree on develop for integration only.
  - Make changes in one detached worktree under the repository's `.worktrees/<task-id>` directory, based on current origin/develop unless the user selects another base.
  - Use Conventional Commits, keep unrelated changes out of commits, and integrate coherent work once after its relevant validation passes.
  - Do not remove a worktree until its commits are integrated.
  - After manual validation is accepted, record the acceptance, archive the completed OpenSpec change, integrate the archive commit, then remove and prune every retained task or acceptance worktree for that change.
  - Store local package archives and ad hoc builds under the repository's `.builds/` directory.

  Validation policy — CI validates, not the workstation:
  - GitHub Actions on the pull request is the only required validation. Write the code, commit, open the PR, and let CI test it.
  - Do not run test suites locally as a gate. `npm run typecheck` before pushing is a fast optional sanity check; `npx vitest run <files>` is for debugging a specific failure, never a completion requirement.
  - Never run `npm run test:fast`, `test:full`, `test:release`, or `test:pi-terminal-parity` locally on your own initiative; the first belongs to CI, the rest to release workflows or an explicit user request.
  - Docs/spec-only changes get no tests anywhere; CI runs only the OpenSpec lint.
  - After pushing a PR, do not poll or watch CI in the foreground; continue with the next task and return when CI reports a result.
  - If CI fails, fix and push again; the round trip is about two minutes.

operations:
  apply:
    guidance:
      - Treat an `ON HOLD — USER-CONTROLLED RESUME ONLY` marker as a hard stop unless the user explicitly resumes that named change.
  archive:
    guidance:
      - For a manually accepted change, archive only after acceptance is recorded; after the archive commit is integrated, remove and prune every task or acceptance worktree retained for that change.
