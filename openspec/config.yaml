schema: spec-driven

context: |
  Read and follow [Shared delivery rules](../docs/delivery-rules.md) using this repository's entry in [Delivery adapters](../docs/delivery-adapters.json).
  Repository-owned command syntax is maintained by subject, not repeated here:
  - Load the [delivery skill](../.agents/skills/change-delivery/SKILL.md) for repository delivery work.
  - Follow the [delivery runbook](../docs/openspec-archive-automation.md) for planning, authorization, same-PR implementation, validation, finalization, handoff, integration, and legacy/generated-proposal rules.
  - Follow the [worktree protocol](../docs/architecture/project-structure.md#development-worktrees) before creating, resuming, or switching a task checkout.
  - Follow [local cleanup](../docs/local-worktree-cleanup.md) for cleanup authority, named-export decisions, process stops, blockers, and recovery.

operations:
  archive:
    guidance:
      - Follow the delivery runbook's finalization, post-merge verification, and legacy procedures. Never publish a version-3 acceptance-only or archive-only follow-up or mutate develop directly.
