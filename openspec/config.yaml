schema: spec-driven

context: |
  Delivery:
  - Keep the primary worktree on `develop` for integration. Do each stream in one detached worktree at `{working-dir}/.worktrees/<task-id>`, where `{working-dir}` is the session's initial working directory, based on current `origin/develop` unless the user chooses another base. For working directory `D:/Git/a1`, the required location is `D:/Git/a1/.worktrees/<task-id>`, never a sibling such as `D:/Git/a1-<task-id>`. Push it with `git push origin HEAD:refs/heads/<branch>`.
  - Address every worktree explicitly with `cd <worktree> && ...` or `git -C <worktree> ...`. Never edit or remove another session's worktree.
  - Keep unrelated changes out. Use `type(scope): subject` commits and `type/short-description` branches, where type is `feature`, `fix`, `refactor`, `docs`, `test`, `chore`, or `style`; mark incompatible changes with `BREAKING CHANGE:`.
  - Load the repository-owned `.agents/skills/change-delivery/SKILL.md` for planning, implementation, refinement, handoff, or rejection work. A new implementation-bound change starts with only OpenSpec planning artifacts in one draft PR, linked with version-2 `openspec-implementation` metadata. Planning requests do not authorize code, tests, scripts, workflows, or non-OpenSpec configuration changes.
  - Begin implementation only after the user approves the plan and explicitly requests implementation. Continue in the same worktree, branch, history, and draft PR; do not merge the plan first or create another docs/implementation PR. Keep related implementation documentation there too. Once implementation is complete, push the candidate and mark that PR ready for review before CI. Draft status protects planning and unfinished implementation, not pending CI or maintainer validation; readiness is not acceptance or merge authorization.
  - For approved refinements, reconcile proposal, design, deltas, and tasks coherently before corresponding code edits in that same PR. If code was added before authorization, stop and disclose the boundary violation; mixed contents never authorize implementation by themselves. Do not synchronize unimplemented deltas into canonical specs during planning.
  - Standalone revisions to already-merged plans remain OpenSpec-only unless combined refinement in an existing implementation PR is explicitly authorized. For legacy merged plans, retain an existing implementation PR or, if none exists and implementation is explicitly requested, fetch current `origin/develop` and create an isolated implementation stream citing the original accepted plan. Preserve legacy version-1 linkage and merged history.
  - Closing a rejected unmerged change integrates and archives nothing on `develop`; local worktree and unmerged branch cleanup still need their separate approvals and cleanliness checks. Rejecting an already-merged legacy plan requires an explicit reconciliation, not a fabricated completed archive.

  Validation and integration:
  - Follow this order: specs and explicit plan approval -> implementation in the same PR -> ready PR and normal PR CI -> actual maintainer validation -> explicitly authorized manual implementation merge -> visible acceptance PR and authorized human manual merge -> automatic CI-gated OpenSpec synchronization/archive PR merge -> verified cleanup.
  - Use the normal `ready_for_review`/`synchronize` PR events for implementation CI so progress is visible on the PR. Do not dispatch ordinary CI solely to keep a completed implementation draft and then repeat it on readiness. Separately required Full regression/native workflows remain distinct gates, not substitutes for required PR checks. New candidate commits require current-head CI and renewed implementation review; post-merge archival acceptance remains separate.
  - CI is the required automated gate. Optional local typechecking or focused tests are for debugging; do not run `test:fast`, `test:full`, or `test:release` locally without an explicit request.
  - OpenSpec changes receive strict OpenSpec validation. Other documentation-only changes require no test suite.
  - After pushing, do not watch CI in the foreground. Read and report its result before starting other work. A failing required check blocks acceptance and unrelated work. Repair routine failed PR checks in the same worktree, branch, and PR, including narrowly scoped inherited failures, then repush for normal current-head CI; no separate proposal or PR is needed solely for that repair. Preserve tested behavior, assertions, coverage, and required checks, and record the cause and validation. Substantive new scope still requires clarification; repair does not authorize live cleanup, acceptance, or merge.
  - Auto-merge only non-draft PRs that are neither implementation-bound nor acceptance-bound when every changed and renamed-from path is under `openspec/**`, under `docs/**`, or is the root `README.md`. An implementation association, newly introduced active change, or authoritative acceptance record/branch holds even an OpenSpec-only ready PR; removing or renaming editable metadata cannot bypass complete diff and base/head checks. Malformed or unavailable lifecycle data blocks automation, and excluded armed merges must be disabled. Standalone existing-change revisions, ordinary docs, and verified archive follow-ups carrying receipt copies retain the exact-path automatic route. Any other path makes the entire PR code/operational, including refactors and mixed changes.
  - Never enable auto-merge for a code/operational pull request. Leave it open after CI for the user's local validation, and merge manually only after the user reports acceptance and explicitly authorizes the merge.

  Manual handoff:
  - When a change becomes runnable, provide the exact applicable worktree, branch/commit, build/run commands, what to try, expected behavior, and known gaps. Repeat the commands after a push that changes what the user runs.
  - For every repository-checkout manual test that launches the interactive A1 or Pi UI, build first and invoke the color-preserving shell entry as `./scripts/dev` or `./scripts/dev pi`. Never hand off a direct `node scripts/development/dev-launch.mjs` or `node scripts/development/start-local.mjs` interactive launch: on Windows Git Bash that shape can collapse the pinned 24-bit palette to terminal colors and invalidate visual review.
  - End such a reply with exactly two lines: the heading `🧪 Manual test:` followed by one copy-pasteable shell command. Use forward-slash paths and combine worktree selection with applicable build/run steps using `&&`.
  - Always wrap the entire command beneath `🧪 Manual test:` in a single Markdown inline-code span (backticks) so it renders cyan. Never use plain text or a fenced code block for that command. Keep the heading and command on exactly two lines.
  - The one command must exercise the changed behavior directly. Do not hardcode a generic launcher such as `npm start` when a focused CLI or script command applies.
  - When nothing is runnable, say so briefly and do not include a manual-test block.

  Completion:
  - For implementation-bound changes, retain local task and acceptance worktrees until the implementation PR, its verified acceptance PR, and its OpenSpec synchronization/archive PR have integrated. An open acceptance or archive PR is not completion. For other PRs, retain the worktree until its PR merges. Because merges are squashed, verify the applicable PRs are `MERGED` with `gh pr view <n> --json state`; only then perform eligible remote-branch and local-worktree cleanup and prune, subject to the ownership and cleanliness checks below. Hosted cleanup may remove the implementation remote branch earlier after its verified merge; that does not authorize early local-worktree removal.
  - Exception: when that check confirms `CLOSED` without merging, disclose that the worktree contains unmerged commits and remove that specific worktree only with the user's explicit approval, then prune. Approval to remove the worktree does not authorize deleting an unmerged remote branch. Never remove a worktree whose pull request is `OPEN` or whose state cannot be confirmed. Closed-PR cleanup is not implementation acceptance, integration, or completed-change archival.
  - Before any worktree removal, check staged, unstaged, and untracked changes. If any exist, stop unless the user separately and explicitly approves discarding those identified changes; approval to remove unmerged committed work alone is insufficient.
  - Optional local cleanup follows `docs/local-worktree-cleanup.md`: register only owned exact worktrees, claim before resumed use, and explicitly release the final identity only after stopping its use and leaving its directory. A separately enabled local worker can then reconcile after verified implementation/acceptance/archive integration and remote-ref absence. Do not infer release from a dead PID, adopt unmanaged folders, force-discard files, provision a service, or enable/start live cleanup merely because implementation was requested.
  - Link new changes from their initial draft with version-2 `openspec-implementation` metadata (`version`, `change`, optional exact mechanical task mapping), without a separate specification PR. Legacy version 1 retains its original `specificationPr`. Follow `docs/openspec-archive-automation.md`. After implementation integration, trusted automation prepares one exact-source acceptance-record PR titled `#<source PR>(accept): <original implementation subject>` with a concise body linking the original PR and listing the maintainer's required verification items; detailed identities and evidence remain in the committed record. Candidate CI validates integrity without claiming unchecked review items passed, while post-merge receipt consumption still requires complete evidence. Never infer acceptance from approval-to-implement, green CI, ordinary merge state, labels, or an unmerged or incomplete record. Only verified authorized human manual merge of the exact complete checked record supplies PR-backed acceptance; never auto-merge it. Existing valid exact-head comment-backed acceptance remains supported.
  - Keep implementation, CI, and manual-review tasks separate from the two optional exact mechanical archive-preparation tasks documented in that runbook. Never auto-complete mixed legacy acceptance/archive tasks.
  - Only after the implementation PR and its verified acceptance record are confirmed merged may the archive workflow record that evidence, synchronize canonical specs, and prepare the completed change's OpenSpec-only archive PR without another user command. Do not merge its specs/docs separately or archive the change before implementation integration. Missing evidence, unfinished substantive tasks, conflicts, or missing App setup block the automatic path. Known-gap archival still requires an explicit manual disposition. Confirm archive integration before cleaning retained task and acceptance worktrees.

operations:
  archive:
    guidance:
      - Archive only after acceptance is recorded; verified manual acceptance-PR evidence or existing valid exact-head maintainer comment evidence may be copied into acceptance.md by the archive workflow. Only the two explicitly designated exact mechanical preparation tasks may be completed by their successful corresponding operations; implementation and manual-review tasks remain prerequisites. After the archive commit integrates, remove and prune retained worktrees for that change.
      - When acceptance is recorded, every artifact is done or skipped, every task is complete, delta-spec synchronization is unambiguous, and the archive target is available, default to synchronizing every delta spec and archiving the change as complete without asking the maintainer to choose that default again.
      - Prompt instead of claiming completion when acceptance is missing or contradictory, an artifact or task is incomplete, synchronization is ambiguous or fails verification, the archive target already exists, or the maintainer explicitly requests another disposition.
