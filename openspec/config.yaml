schema: spec-driven

context: |
  Delivery:
  - Keep the primary worktree on `develop` for integration. Do each stream in one detached `.worktrees/<task-id>` worktree based on current `origin/develop` unless the user chooses another base; push it with `git push origin HEAD:refs/heads/<branch>`.
  - Address every worktree explicitly with `cd <worktree> && ...` or `git -C <worktree> ...`. Never edit or remove another session's worktree.
  - Keep unrelated changes out. Use `type(scope): subject` commits and `type/short-description` branches, where type is `feature`, `fix`, `refactor`, `docs`, `test`, `chore`, or `style`; mark incompatible changes with `BREAKING CHANGE:`.
  - A request to prepare, write, design, or update a specification creates an OpenSpec-only pull request. Do not include implementation, tests, scripts, workflows, generated baselines, or non-OpenSpec configuration.
  - After that specification merges and the user explicitly requests implementation, fetch `origin/develop` and use a new worktree, branch, history, and pull request that cites the accepted change. Split any branch that mixes specification and implementation.

  Validation and integration:
  - CI is the required automated gate. Optional local typechecking or focused tests are for debugging; do not run `test:fast`, `test:full`, or `test:release` locally without an explicit request.
  - OpenSpec changes receive strict OpenSpec validation. Other documentation-only changes require no test suite.
  - After pushing, do not watch CI in the foreground. Read and report its result before starting other work. A failing required check blocks further work; fix a change-caused failure there and isolate an unrelated failure in its own stream.
  - Auto-merge only when every changed path is under `openspec/**` or is the root `README.md`. Any other path makes the entire pull request a code/operational change, including refactors and mixed changes.
  - Never enable auto-merge for a code/operational pull request. Leave it open after CI for the user's local validation, and merge manually only after the user reports acceptance and explicitly authorizes the merge.

  Manual handoff:
  - When a change becomes runnable, provide the exact applicable worktree, branch/commit, build/run commands, what to try, expected behavior, and known gaps. Repeat the commands after a push that changes what the user runs.
  - End such a reply with one copy-pasteable block headed `🔬 Manual test:` and use forward-slash paths. Do not hardcode a generic command when the change needs another command.
  - When nothing is runnable, say so briefly and do not include a manual-test block.

  Completion:
  - Do not remove a worktree before its pull request merges. Because merges are squashed, confirm with `gh pr view <n> --json state`, then delete the remote branch, remove the worktree, and prune.
  - After accepted code merges, record acceptance and archive its completed OpenSpec change in a specification-only follow-up, then clean up retained task and acceptance worktrees.

operations:
  archive:
    guidance:
      - Archive only after acceptance is recorded; after the archive commit integrates, remove and prune retained worktrees for that change.
