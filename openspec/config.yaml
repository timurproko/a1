schema: spec-driven

context: |
  Delivery:
  - Keep the primary worktree on `develop` for integration. Before creating a worktree, run `node scripts/governance/local-worktree-cleanup.mjs sweep --repo <primary>` from the primary checkout once and relay its `lines`; pending, awaiting-discard, deferred, or blocked results never delay the new delivery. Do each stream in one detached worktree at `{working-dir}/.worktrees/<task-id>`, based on current `origin/develop` unless the user chooses another base. Address every worktree explicitly and never edit or remove another session's worktree.
  - Keep unrelated changes out. Use `type(scope): subject` commits and `type/short-description` branches, where type is `feature`, `fix`, `refactor`, `docs`, `test`, `chore`, or `style`; mark incompatible changes with `BREAKING CHANGE:`.
  - Load `.agents/skills/change-delivery/SKILL.md` and follow `docs/openspec-archive-automation.md` for planning, implementation, refinement, handoff, rejection, finalization, or cleanup work.
  - A new implementation-bound change starts with only OpenSpec planning artifacts in one normally named draft PR. Start its body with `## Proposal` containing one or two sentences of intent, followed by `## Implementation` containing two to five implementation bullets; do not add a quoted proposal or implementation phase line. Omit routine validation-command listings; place required `openspec-implementation` JSON last under `## Automation` inside an explained collapsed disclosure. Planning requests authorize no code, tests, scripts, workflows, finalization, or canonical-spec synchronization.
  - Begin implementation only after explicit plan approval and an implementation request. Continue in the same worktree, branch, history, and draft PR without a body-phase edit. Reconcile approved planning refinements before corresponding code edits. Closing a rejected unmerged change integrates and archives nothing.
  - After implementation, evidence, gap disposition, and substantive tasks are complete, reconcile current `origin/develop`, add the acceptance list, and mark the PR ready. The trusted `OpenSpec finalization` workflow then finalizes in that same branch: it conservatively synchronizes every delta, moves the active change into its dated archive, writes the conditional acceptance manifest, commits with the archive App identity, and updates the body fence. Local finalization with `finalize-openspec-delivery.mjs` is optional and produces the same bytes. Finalization is deterministic, fails closed, and is repeatable from the archived form: push fixes on top of a finalized head and let the workflow re-finalize; never revert a finalization commit. Pull before pushing because the branch gains App commits.
  - Keep the completed candidate phase-free while required tests are pending or failed. Put one to three concise implementation-specific behavior-and-result bullets under final `## Acceptance` in the ordinary PR. Use plain bullets, never checkboxes or generic review/CI/approval/archive items. The committed manifest and PR list must match exactly.

  Validation and integration:
  - Follow this order: draft specs and explicit plan approval -> same-PR implementation -> in-branch synchronization/archive finalization -> ready PR and normal exact-head CI -> maintainer validation -> authorized human manual merge -> read-only accepted/archive verification -> cleanup.
  - Mark a completed PR ready without changing its phase-free body; the finalization workflow rewrites only the implementation fence. One exact-head workflow must validate the finalized delivery record plus every selected product/governance scope and emit the stable protected aggregate; a ready head that still holds the active change reports automated finalization as pending and is not mergeable. Leave that body unchanged for maintainer review and authorized manual merge; no lifecycle body edit or second validation run is required. A new head, changed body list, changed manifest, or advanced target baseline requires renewed validation. Dedicated Full regression/native workflows remain distinct gates where applicable.
  - CI is machine evidence, not human acceptance. A new head, changed body list, changed manifest, or advanced target baseline requires renewed validation. Optional local typechecking/focused tests are for debugging; do not run `test:fast`, `test:full`, or `test:release` locally without an explicit request.
  - Never arm or invoke auto-merge, merge queue, documentation reconciliation, App merge, or bot merge for an implementation-bound PR. Leave it open after green CI. An authorized maintainer's manual merge of the exact validated head means the listed scenarios are accepted and explicitly authorizes integration.
  - New version-3 delivery creates no acceptance, spec-only, or archive-only follow-up PR. Post-merge handling verifies and reports the integrated result without pushing `develop` or publishing lifecycle refs. Existing exact-head remote branch cleanup remains independently safety-gated.
  - Auto-merge only non-draft PRs that are not implementation/acceptance-bound and whose every changed and renamed-from path is under `openspec/**`, under `docs/**`, or root `README.md`. Standalone existing-spec/OpenSpec revisions and ordinary docs retain this route. New active changes, implementation associations, malformed lifecycle data, and mixed or other paths fail closed and disable any armed merge.
  - Legacy version-1/version-2 links, acceptance comments/PRs, archive PRs, catch-up, and receipt readers remain supported under their original policy; never silently convert or let legacy publication mutate version 3.
  - After pushing, do not watch CI in the foreground. Read and report its result before other work. Repair routine failed checks in the same branch/PR without weakening behavior, assertions, coverage, or required checks; substantive new scope still requires clarification.
  - When the stable protected aggregate succeeds and the candidate is handed to the maintainer, and again after any repair push, run `local-worktree-cleanup.mjs handoff` from the primary checkout with the exact worktree, change, and PR. It registers and releases the worktree for the next session's sweep; it deletes nothing, enables nothing, and never waits for the merge or starts a watcher.

  Manual handoff:
  - Provide the exact worktree, branch/commit, build/run commands, what to try, expected behavior, and known gaps. Repeat commands after a push that changes what the user runs.
  - For interactive repository-checkout A1/Pi tests, build first and invoke `./scripts/dev` or `./scripts/dev pi`. Never hand off a direct `node scripts/development/dev-launch.mjs` command or another direct Node launcher that can invalidate terminal color review.
  - End runnable replies with exactly two lines: `🧪 Manual test:` and one copy-pasteable forward-slash shell command in one Markdown inline-code span. When nothing is runnable, say so briefly and omit the block.

  Completion:
  - For version 3, derive the post-merge state `Archived` only after its one PR is verified `MERGED`, current `develop` contains its archive and synchronized specs, the shared reader verifies authorized manual acceptance, and the remote topic ref is absent. Keep the merged PR body as the immutable accepted snapshot; do not edit it after merge. For legacy versions, retain worktrees until their applicable implementation, acceptance, and archive PRs integrate.
  - Never remove a worktree whose PR is open or unverifiable. Closed-unmerged cleanup requires the exact repository-owned `discard` command plus explicit candidate and remote-deletion confirmation; PR closure alone authorizes nothing. Before removal, stop on staged, unstaged, or untracked content.
  - After verified integration and remote-ref absence, run `local-worktree-cleanup.mjs sweep` from the primary checkout, or the exact-candidate `local-worktree-cleanup.mjs complete` command for one named candidate. The sweep also prunes merged local topic branches by pull-request evidence; a branch with local-only commits, an open PR, a checkout, or a live remote ref is retained and reported. For an explicitly rejected closed-unmerged PR, use only exact-candidate `discard --confirm-closed-unmerged`; it owns expected-SHA remote deletion plus the same bounded local safeguards. Never choose disposable paths, delete generated files/worktrees/branches ad hoc, infer cleanup from implementation approval or PR closure, adopt another session's worktree, or bypass a reported blocker.

operations:
  archive:
    guidance:
      - A finalized version-3 change archives atomically when its containing PR is manually merged; after merge, verify the conditional manifest and GitHub provenance instead of moving files or creating another PR.
      - Before version-3 merge, finalization belongs to approved implementation work and must fail closed on incomplete artifacts/tasks/evidence, undispositioned gaps, stale targets, conflicts, or ambiguous synchronization.
      - Preserve the established acceptance/archive workflow only for version-1/version-2 deliveries. Missing or contradictory authority remains blocking and never permits direct mutation of `develop`.
