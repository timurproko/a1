schema: spec-driven

context: |
  Development workflow:
  - Keep the primary worktree on develop for integration only.
  - Make changes in one detached worktree under the repository's `.worktrees/<task-id>` directory, based on current origin/develop unless the user selects another base. The worktree is detached because a branch can be checked out in only one worktree at a time; commit there and push with `git push origin HEAD:refs/heads/<branch>`, so the branch exists on the remote and no local ref goes stale.
  - Worktree-per-task is not the overhead to cut. Several agents work this repository at once, and isolated worktrees are what keeps one stream from editing another's checkout. Where the per-worktree cost hurts — installing, building, validating — cut that, never the model.
  - Working directories are shared between concurrent sessions and can change under a command, so address a worktree explicitly: `cd <worktree> && …` or `git -C <worktree> …`, never a bare relative path. A command that assumed its directory once landed deletions in another agent's worktree.
  - Keep unrelated changes out of commits, and integrate coherent work once after its relevant validation passes.
  - Name a commit `type(scope): subject`, and name the branch it lands on `type/short-description` with the same type. The types are `feature` for behaviour a reader could notice, `fix` for a repair, `refactor` for a change of shape that leaves behaviour alone, and `docs`, `test`, `chore`, and `style` as they sound; an incompatible change says `BREAKING CHANGE:` in its body. This is Conventional Commits with `feat` written out as `feature`, because an abbreviation nobody expands reads as a truncation rather than a word. A tool added later that expects the standard spelling takes `feature` as a configured type.
  - Do not remove a worktree until its commits are integrated.
  - When a pull request merges — armed to merge on its own, or merged by hand after acceptance — delete its remote branch and remove its worktree, then prune. A merged branch left behind is one more thing to read past when looking for what is live.
  - Judge merged by what the pull request says, not by whether the branch is an ancestor of `develop`: these merges are squashed, so the branch tip never becomes an ancestor and `git branch --merged` reports a landed branch as unmerged. `gh pr view <n> --json state` is the answer.
  - Leave alone a worktree that belongs to another session's open pull request, and say when a directory could not be removed because something is still running in it.
  - `npm run clean:worktrees` lists what has landed and `npm run clean:worktrees -- --apply` removes it, asking GitHub which pull request carried each commit. A directory Windows will not release is scheduled for deletion on the next restart rather than left to be found later.
  - After manual validation is accepted, record the acceptance, archive the completed OpenSpec change, integrate the archive commit, then remove and prune every retained task or acceptance worktree for that change.
  - Store local package archives and ad hoc builds under the repository's `.builds/` directory.

  Manual testing handoff — never make the user ask how to run it:
  - The moment work becomes drivable by hand, send the exact commands unprompted: the `cd` path, the branch name and commit, whether a build is needed, and what to type once it is running.
  - Give one copy-pasteable block. Do not describe the steps in prose and do not assume the user knows which worktree, branch, or build state is current.
  - State what to try and what is expected, then state plainly what is not implemented yet, so a known gap is not reported as a bug.
  - When nothing is testable by hand, say so explicitly and say which task makes it testable, rather than leaving the user to discover there is nothing to see.
  - Repeat the commands after any push that changes what the user would run, including a rebuild step when the built output is now stale.
  - When there is something new to try, end the reply with the run commands as the very last thing, with nothing after them — no summary, no question, no sign-off. The block is exactly a `🔬 Manual test:` line, then the `cd` to the active worktree, then the build-and-run command:

        🔬 Manual test:
        cd <active worktree path>
        npm run build && npm start

  - Send that block only when the reply changed what the user would see or do by running it. A reply that changed nothing runnable — analysis, a plan, a spec, a question, a status report — ends without it, because a block that appears every time stops meaning "there is something to test".

  Validation policy — CI validates, not the workstation:
  - GitHub Actions on the pull request is the only required validation. Write the code, commit, open the PR, and let CI test it.
  - Do not run test suites locally as a gate. `npm run typecheck` before pushing is a fast optional sanity check; `npx vitest run <files>` is for debugging a specific failure, never a completion requirement.
  - Never run `npm run test:fast`, `test:full`, `test:release`, or `test:pi-terminal-parity` locally on your own initiative; the first belongs to CI, the rest to release workflows or an explicit user request.
  - Docs/spec-only changes get no tests anywhere; CI runs only the OpenSpec lint.
  - After pushing a PR, do not poll or watch CI in the foreground. Fill the wait with work on that same change if there is any, then read the result before anything else starts.
  - A red pull request is the next task. Fix it and push again — the round trip is about two minutes — before starting new work, and never stack new work on top of a change whose validation is failing.
  - Report what CI said rather than assuming it passed. A result that has not been read is not a result.
  - Where a failure is not this change's doing, say so with the evidence and still deal with it before moving on, because it fails every pull request behind it too.
  - `develop` requires the `Development validation required` check before a merge. Admin bypass stays on, no reviews are required, a branch need not be up to date with `develop` to merge, and force-pushing or deleting `develop` is refused.
  - Arm auto-merge on a pull request that changes nothing a reader would see — a specification, documentation, a refactor whose tests prove the behaviour is unchanged — so it lands the moment validation passes. Say that it is armed.
  - Leave a pull request that changes what a reader sees to merge by hand, after the manual acceptance that change needs. A feature is accepted before it lands, not explained after it.

operations:
  apply:
    guidance:
      - Treat an `ON HOLD — USER-CONTROLLED RESUME ONLY` marker as a hard stop unless the user explicitly resumes that named change.
  archive:
    guidance:
      - For a manually accepted change, archive only after acceptance is recorded; after the archive commit is integrated, remove and prune every task or acceptance worktree retained for that change.
