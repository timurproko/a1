schema: spec-driven

context: |
  Delivery:
  - Keep the primary worktree on `develop` for integration. Before selecting or creating a worktree, run `node scripts/governance/local-worktree-cleanup.mjs sweep --repo <primary>` from the primary checkout once and relay its `lines`, then run `a1 session worktrees` from the owning A1 session; pending cleanup never delays delivery. Never work in a `busy` or `unverifiable` checkout. Reuse an `available` checkout only when its exact branch, OpenSpec change, and PR match the requested stream and atomic linking still succeeds; similarity, recency, cleanliness, or ancestry grants nothing. Otherwise create one task worktree at `{working-dir}/.worktrees/<task-id>`, based on current `origin/develop` unless the user chooses another base. Immediately after selecting or creating it, and before changing planning, implementation, test, or delivery-documentation files, run `a1 session link-worktree <absolute-worktree>`. Continue only when the command confirms that exact canonical worktree; if inventory or linking fails, loses a race, reports another live or unverifiable owner, or identifies another path, report the blocker and stop feature edits in that checkout, then create a separate worktree instead of overriding ownership. A session resuming or switching streams must atomically claim and link the exact worktree before editing it. Linking acquires a live-session editing claim and changes footer repository/PR discovery; it does not change process or tool cwd or grant cleanup authority. Address every worktree explicitly and never edit, adopt, unlink, recover, or remove another session's worktree.
  - Put every scratch or command-interchange file whose path the agent selects, including PR/comment bodies, captured output, temporary patches/diffs, and ad hoc logs, beneath the exact `.artifacts/` root of the repository worktree that owns the operation. A linked delivery uses its linked task worktree, never the primary checkout, another worktree, the operating-system temporary directory, home/desktop, or a sibling path. Keep this content ignored, unstaged, uncommitted, disposable, non-authoritative, and free of credentials or other prohibited sensitive data. This rule does not relocate temporary storage internally selected by tools, product runtime code, or hermetic tests.
  - Keep unrelated changes out. Use `type(scope): subject` commits and `type/short-description` branches, where type is `feature`, `fix`, `refactor`, `docs`, `test`, `chore`, or `style`; mark incompatible changes with `BREAKING CHANGE:`.
  - Load `.agents/skills/change-delivery/SKILL.md` and follow `docs/openspec-archive-automation.md` for planning, implementation, refinement, handoff, rejection, finalization, or cleanup work.
  - A new implementation-bound change starts with only OpenSpec planning artifacts in one normally named draft PR. Start its body with `## Proposal` containing one or two sentences of intent, followed by `## Implementation` containing two to five implementation bullets; do not add a quoted proposal or implementation phase line. Omit routine validation-command listings; place required `openspec-implementation` JSON last under `## Automation` inside an explained collapsed disclosure. Planning requests authorize no code, tests, scripts, workflows, finalization, or canonical-spec synchronization.
  - Begin implementation only after explicit plan approval and an implementation request. Continue in the same worktree, branch, history, and draft PR without a body-phase edit. Reconcile approved planning refinements before corresponding code edits. Closing a rejected unmerged change integrates and archives nothing.
  - After implementation, evidence, gap disposition, and substantive tasks are complete, reconcile current `origin/develop`, add the acceptance list, and mark the PR ready. The trusted `OpenSpec finalization` workflow then finalizes in that same branch: it conservatively synchronizes every delta, moves the active change into its dated archive, writes the conditional acceptance manifest, commits with the archive App identity, and updates the body fence with the exact finalized head. That guarded post-push binding is the native PR-validation trigger even when archive paths are unchanged. Local finalization with `finalize-openspec-delivery.mjs` is optional and produces the same repository bytes; trusted automation binds the eventual commit SHA. Finalization is deterministic, fails closed, and is repeatable from the archived form: push fixes on top of a finalized head and let the workflow re-finalize; never revert a finalization commit. Pull before pushing because the branch gains App commits.
  - Keep the completed candidate phase-free while required tests are pending or failed. Put one to ten concise implementation-specific behavior-and-result bullets under final `## Acceptance` in the ordinary PR. Use plain bullets, never checkboxes or generic review/CI/approval/archive items. The committed manifest and PR list must match exactly.

  Validation and integration:
  - Follow this order: draft specs and explicit plan approval -> same-PR implementation -> in-branch synchronization/archive finalization -> ready PR and normal exact-head CI -> maintainer validation -> authorized human integration choice (manual merge or personally enabled native auto-merge) -> read-only accepted/archive verification -> cleanup.
  - Draft pull requests run no Development test suites. Mark a completed PR ready without changing its phase-free body; the finalization workflow rewrites only the implementation fence. Ready ordinary PRs begin their selected validation immediately. A ready version-3 head that still holds the active change, lacks an exact finalized-head binding, or carries a stale binding defers Development tests and emits no protected aggregate until finalization records the archive, acceptance manifest, and current head. The resulting native pull-request body event must expose one exact-head workflow and all selected lane progress on the PR itself; manual dispatch remains diagnostic and cannot substitute. That workflow must validate the finalized delivery record plus every selected product/governance scope and emit the stable protected aggregate. Leave that body unchanged for maintainer review and an authorized integration choice; no lifecycle body edit or second test run is required. A new eligible head, changed body list, changed manifest, or advanced target baseline requires renewed validation and a fresh human auto-merge arm. Selected Full regression runs inside that finalized PR workflow as native checks and is required by the same protected aggregate; standalone Full regression remains a separate diagnostic/scheduled caller.
  - CI is machine evidence, not human acceptance. A new head, changed body list, changed manifest, or advanced target baseline requires renewed validation. Optional local typechecking/focused tests are for debugging; do not run `test:fast`, `test:full`, or `test:release` locally without an explicit request.
  - Agents, Apps, bots, merge queue, and repository automation never arm or invoke auto-merge, documentation reconciliation, or another merge path for an implementation-bound PR. Leave it open after green CI unless an authorized maintainer personally arms native auto-merge. The maintainer's manual merge of the exact validated head or personal native auto-merge arm for that unchanged head means the listed scenarios are accepted and explicitly authorizes protected integration after current-head CI.
  - New version-3 delivery creates no acceptance, spec-only, or archive-only follow-up PR. Post-merge handling verifies and reports the integrated result without pushing `develop` or publishing lifecycle refs. Existing exact-head remote branch cleanup remains independently safety-gated.
  - Auto-merge only non-draft PRs that are not implementation/acceptance-bound and whose every changed and renamed-from path is under `openspec/**`, under `docs/**`, or root `README.md`. Standalone existing-spec/OpenSpec revisions and ordinary docs retain this route. The post-publication `chore/release-X.Y.Z-dev` reopening PR from `openspec-ci[bot]` also auto-merges when trusted policy verifies its version-only manifests and a note equal to the published Release. New active changes, implementation associations, malformed lifecycle data, and mixed or other paths fail closed for documentation automation. It disables automation-owned or stale arms but preserves only a finalized version-3 exact-head arm personally created by an authorized human.
  - Legacy version-1/version-2 links, acceptance comments/PRs, archive PRs, catch-up, and receipt readers remain supported under their original policy; never silently convert or let legacy publication mutate version 3.
  - A `fix/nightly-regression-<date>` candidate is a normal implementation-bound change; continue in its branch and PR. PR-attached Full regression is selected only when base-controlled policy verifies the immutable `openspec-ci` App author, generated candidate identity, and a failed Full regression source in `regression-provenance.json`. Branch/body naming, labels, publishing or validation-authority paths, Publish-only triage, and successful-run persistent-overrun triage do not select it. Generated repair drafts run no Development tests, including after implementation begins. Complete implementation evidence, pre-finalization observations, and substantive tasks before marking ready. Trusted finalization then publishes the candidate, and all selected exact-head lanes are required through `Development validation required`; failed, cancelled, stale, missing, or unexpected skips block handoff. Report the final run/head/selection in Actions and handoff, not an extra committed task/design edit. A passing selected PR run replaces separate mandatory dispatch; manual dispatch stays diagnostic. Ordinary PR cadence, authorized maintainer integration, and independent numbered-package nightly recovery remain unchanged.
  - After pushing, do not watch CI in the foreground. Read and report its result before other work. Repair routine failed checks in the same branch/PR without weakening behavior, assertions, coverage, or required checks; substantive new scope still requires clarification.
  - `develop` requires an up-to-date base: when the PR shows `BEHIND`, merge `origin/develop` into the branch, push, let the finalization workflow re-finalize, wait for validation, and hand off again; never ask the maintainer to merge a stale finalized head.
  - When the stable protected aggregate succeeds and the candidate is handed to the maintainer, and again after any repair push, run `local-worktree-cleanup.mjs handoff` from the primary checkout with the exact worktree, change, and PR. It registers and releases the worktree for the next session's sweep; it deletes nothing, enables nothing, and never waits for the merge or starts a watcher.

  Manual handoff:
  - Provide the exact worktree, branch/commit, build/run commands, what to try, expected behavior, and known gaps. Repeat commands after a push that changes what the user runs.
  - For interactive repository-checkout A1/Pi tests, build first and invoke `./scripts/dev` or `./scripts/dev pi`. Never hand off a direct `node scripts/development/dev-launch.mjs` command or another direct Node launcher that can invalidate terminal color review.
  - End runnable replies with exactly two lines: `🧪 Manual test:` and one copy-pasteable forward-slash shell command in one Markdown inline-code span. A reply is runnable whenever it reports a pushed implementation head, a PR marked ready, a repair push, CI results on such a head, or a merged change; reporting CI or cleanup does not replace the block. When nothing is runnable, say so briefly and omit the block.

  Completion:
  - For version 3, derive the post-merge state `Archived` only after its one PR is verified `MERGED`, current `develop` contains its archive and synchronized specs, the shared reader verifies authorized human acceptance provenance, and the remote topic ref is absent. Keep the merged PR body as the immutable accepted snapshot; do not edit it after merge. For legacy versions, retain worktrees until their applicable implementation, acceptance, and archive PRs integrate.
  - Never remove a worktree whose PR is open or unverifiable. Closed-unmerged cleanup requires the exact repository-owned `discard` command plus explicit candidate and remote-deletion confirmation; PR closure alone authorizes nothing. Before removal, stop on staged, unstaged, or untracked content.
  - After verified integration and remote-ref absence, run `local-worktree-cleanup.mjs sweep` from the primary checkout, or the exact-candidate `local-worktree-cleanup.mjs complete` command for one named candidate. The sweep also prunes merged local topic branches by pull-request evidence; a branch with local-only commits, an open PR, a checkout, or a live remote ref is retained and reported. An entry whose evidence cannot verify but whose worktree and ref are already gone is retired as `retired-nothing-left` once its PR is merged; use `forget --id --confirm-nothing-left` only for an all-absent unmerged entry. For an explicitly rejected closed-unmerged PR, use only exact-candidate `discard --confirm-closed-unmerged`; it owns expected-SHA remote deletion plus the same bounded local safeguards. Only an exact maintainer cleanup request authorizes `retire-redundant --confirm-redundant` for one unregistered no-PR/no-remote clean checkout whose tip is contained by fresh `origin/develop`; sweep never adopts it. Never choose disposable paths, delete generated files/worktrees/branches or links ad hoc, infer cleanup from implementation approval or PR closure, adopt another session's worktree outside that exact operation, or bypass a reported blocker.

operations:
  archive:
    guidance:
      - A finalized version-3 change archives atomically when its containing PR is integrated after an authorized maintainer manually merges or personally arms native auto-merge for the unchanged exact head; after merge, verify the conditional manifest and GitHub provenance instead of moving files or creating another PR.
      - Before version-3 merge, finalization belongs to approved implementation work and must fail closed on incomplete artifacts/tasks/evidence, undispositioned gaps, stale targets, conflicts, or ambiguous synchronization.
      - Preserve the established acceptance/archive workflow only for version-1/version-2 deliveries. Missing or contradictory authority remains blocking and never permits direct mutation of `develop`.
