[package]
name = "process-guardian"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[lib]
name = "process_guardian"
crate-type = ["cdylib"]

[dependencies]
napi = { version = "=2.16.17", default-features = false, features = ["napi9"] }
napi-derive = "=2.16.13"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
