[package]
name = "process-guardian"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
