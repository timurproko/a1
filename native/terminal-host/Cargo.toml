[package]
name = "a1-terminal-host"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[dependencies]
base64 = "=0.22.1"
crossterm = "=0.29.0"
portable-pty = "=0.9.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
] }

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
