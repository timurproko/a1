[package]
name = "terminal-host"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[lib]
name = "terminal_host_contracts"
crate-type = ["rlib", "cdylib"]

[features]
default = []
node-addon = ["dep:napi", "dep:napi-derive"]
resident-fixtures = []

[dependencies]
base64 = "=0.22.1"
crossterm = "=0.29.0"
hex = "=0.4.3"
napi = { version = "=2.16.17", default-features = false, features = ["napi9"], optional = true }
napi-derive = { version = "=2.16.13", optional = true }
portable-pty = "=0.9.0"
rand = "=0.10.0"
rmp-serde = "=1.3.1"
serde = { version = "=1.0.228", features = ["derive"] }
sha2 = "=0.10.9"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "=0.2.177"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "=3.23.0"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
