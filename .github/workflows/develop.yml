name: Development publication
run-name: Development publication ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current origin/develop commit
        required: true
        type: string
      request_id:
        description: Caller correlation identifier
        required: true
        type: string

# GitHub validates every nested reusable-workflow job before channel conditions run.
# Stable-only jobs request contents: write; publish.yml still narrows each executing job.
permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  publish:
    name: Validate and publish development packages
    uses: timurproko/a1/.github/workflows/publish.yml@develop
    with:
      channel: develop
      source_sha: ${{ inputs.source_sha }}
      request_id: ${{ inputs.request_id }}
    secrets: inherit
