name: Development publication
run-name: Development publication ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current origin/develop commit
        required: true
        type: string
      request_id:
        description: Caller correlation identifier
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  publish:
    name: Validate and publish development packages
    uses: timurproko/a1/.github/workflows/publish.yml@develop
    with:
      channel: develop
      source_sha: ${{ inputs.source_sha }}
      request_id: ${{ inputs.request_id }}
    secrets: inherit
