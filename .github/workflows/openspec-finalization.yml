name: OpenSpec finalization

on:
  pull_request_target:
    branches: [develop]
    types: [synchronize, ready_for_review, reopened, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Implementation PR number to reconcile'
        type: string
        required: true
      dry_run:
        description: 'Report the candidate classification without pushing'
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: openspec-finalization-${{ inputs.pr || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    name: Finalize the ready single-PR delivery
    if: github.event_name != 'pull_request_target' || (github.event.pull_request.draft == false && github.event.pull_request.merged != true)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REQUESTED_PR: ${{ inputs.pr || github.event.pull_request.number }}
      FINALIZATION_DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install pinned trusted tooling without hooks
        run: npm ci --ignore-scripts

      - name: Finalize the candidate from trusted policy with the App identity
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENSPEC_ARCHIVE_APP_ID: ${{ secrets.OPENSPEC_ARCHIVE_APP_ID }}
          OPENSPEC_ARCHIVE_APP_PRIVATE_KEY: ${{ secrets.OPENSPEC_ARCHIVE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          args=(--pr "$REQUESTED_PR")
          if [ "$FINALIZATION_DRY_RUN" = 'true' ]; then args+=(--dry-run); fi
          node scripts/governance/publish-openspec-finalization.mjs "${args[@]}"
