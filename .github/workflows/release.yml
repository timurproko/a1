name: Release

# One pipeline, one trigger: every push to develop.
#
# What the pushed commit declares decides the channel. A prerelease version
# publishes a preview to the npm `next` tag, versioned
# `<major.minor.patch>-dev.<run number>` and stamped at publish time, so the
# repository never carries a commit per preview. A stable version publishes that
# version to the npm `latest` tag.
#
# The tag, the GitHub Release, and master all come after the registry has the
# package. A release that fails therefore leaves nothing behind to explain: no
# tag, no release, no moved branch, only a red run.
#
# Both channels pack once and validate those exact bytes on every platform. The
# publisher never rebuilds: it uploads the artifact the validation ran against.

on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Resolve release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      channel: ${{ steps.plan.outputs.channel }}
      version: ${{ steps.plan.outputs.version }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Resolve channel and version
        id: plan
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFile } from "node:fs/promises";
          const manifest = JSON.parse(await readFile("package.json", "utf8"));
          const reference = process.env.GITHUB_REF ?? "";
          const declared = manifest.version;
          const base = /^(\d+\.\d+\.\d+)/.exec(declared)?.[1];
          if (!base) throw new Error(`package version is not semantic: ${declared}`);

          if (reference !== "refs/heads/develop") throw new Error(`release runs from develop, not ${reference}`);
          // What the commit declares is what it means. A stable version declared on
          // develop is the release itself; anything else is a preview. Nothing here
          // reads a tag, because the tag does not exist yet: it is written after the
          // registry has the package, so a release that fails leaves no version
          // standing anywhere.
          if (declared === base) {
            console.log(`publish=true\nchannel=latest\nversion=${declared}\nreason=develop declares stable ${declared}`);
          } else {
            console.log(`publish=true\nchannel=next\nversion=${base}-dev.${process.env.RUN_NUMBER}\nreason=preview from develop`);
          }
          NODE

      - name: Say what will happen
        shell: bash
        env:
          PUBLISH: ${{ steps.plan.outputs.publish }}
          CHANNEL: ${{ steps.plan.outputs.channel }}
          VERSION: ${{ steps.plan.outputs.version }}
          REASON: ${{ steps.plan.outputs.reason }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            echo "Publishing $VERSION to the npm $CHANNEL tag ($REASON)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No publication: $REASON." >> "$GITHUB_STEP_SUMMARY"
          fi

  guardians:
    name: Build process guardian (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Preserve repository bytes during checkout
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false

      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install build dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build integrity-bound process guardian
        run: npm run build:process-guardian

      - name: Upload platform guardian
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-process-guardian-${{ runner.os }}-${{ runner.arch }}
          path: dist/native
          if-no-files-found: error
          retention-days: 1

  package:
    name: Pack ${{ needs.plan.outputs.version }} once
    needs: [plan, guardians]
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      integrity: ${{ steps.identity.outputs.integrity }}
      shasum: ${{ steps.identity.outputs.shasum }}
    steps:
      - name: Preserve repository bytes during checkout
        shell: bash
        run: git config --global core.autocrlf false

      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Refuse a version the registry already serves
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const { name } = JSON.parse(await readFile("package.json", "utf8"));
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${process.env.RELEASE_VERSION}`, { headers: { "cache-control": "no-cache" } });
          if (response.status !== 404) throw new Error(`${name}@${process.env.RELEASE_VERSION} already exists (HTTP ${response.status})`);
          NODE

      - name: Install dependencies and build once
        run: npm ci

      - name: Assemble all platform process guardians
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-process-guardian-*
          path: dist/native
          merge-multiple: true

      - name: Stamp the preview version
        if: needs.plan.outputs.channel == 'next'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version

      - name: Pack the release once
        run: node scripts/prepare-validation-package.mjs

      - name: Run platform-independent static analysis once
        shell: bash
        env:
          VALIDATION_SELECTION_JSON: '["typecheck","architecture","dependency-policy"]'
          VALIDATION_BUILD_READY: "1"
        run: node scripts/run-validation-tier.mjs --result artifacts/validation/static.json

      - name: Bind the packed identity
        id: identity
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { createHash } from "node:crypto";
          import { readFile } from "node:fs/promises";
          const bytes = await readFile("artifacts/validation/package/candidate.tgz");
          const [pack] = JSON.parse(await readFile("artifacts/validation/package/npm-pack-result.json", "utf8"));
          const integrity = `sha512-${createHash("sha512").update(bytes).digest("base64")}`;
          const shasum = createHash("sha1").update(bytes).digest("hex");
          if (pack.integrity !== integrity || pack.shasum !== shasum) throw new Error("packed digest disagrees with npm's own report");
          if (pack.version !== process.env.RELEASE_VERSION) throw new Error(`packed version ${pack.version} is not ${process.env.RELEASE_VERSION}`);
          console.log(`integrity=${integrity}\nshasum=${shasum}`);
          NODE

      - name: Upload the single release package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-package-${{ needs.plan.outputs.version }}
          path: |
            artifacts/validation/package/candidate.tgz
            artifacts/validation/package/npm-pack-result.json
            artifacts/validation/static.json
          if-no-files-found: error
          retention-days: 30

  validate:
    name: Validate ${{ matrix.platform }}
    needs: [plan, package]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win32
            os: windows-2025
          - platform: linux
            os: ubuntu-24.04
          - platform: darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Preserve repository bytes during checkout
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false

      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the single release package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-package-${{ needs.plan.outputs.version }}
          path: artifacts/release

      - name: Verify the package did not change across the fan-out
        shell: bash
        env:
          EXPECTED_INTEGRITY: ${{ needs.package.outputs.integrity }}
          EXPECTED_SHASUM: ${{ needs.package.outputs.shasum }}
        run: |
          set -euo pipefail
          tarball="$(find artifacts/release -type f -name candidate.tgz)"
          test -n "$tarball"
          echo "VALIDATION_CANDIDATE_TARBALL=$tarball" >> "$GITHUB_ENV"
          VALIDATION_CANDIDATE_TARBALL="$tarball" node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFile } from "node:fs/promises";
          const bytes = await readFile(process.env.VALIDATION_CANDIDATE_TARBALL);
          const integrity = `sha512-${createHash("sha512").update(bytes).digest("base64")}`;
          const shasum = createHash("sha1").update(bytes).digest("hex");
          if (integrity !== process.env.EXPECTED_INTEGRITY || shasum !== process.env.EXPECTED_SHASUM) throw new Error("release package digest changed across the platform fan-out");
          NODE

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install exact platform dependencies
        run: npm ci

      - name: Select validation for this channel
        id: selection
        shell: bash
        env:
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = "latest" ]; then
            selected='["fast","dist-integration","launch-integration","pi-engine-conformance","release-update","update-performance","structured-runtime-integration","package-smoke","package-install"]'
          else
            selected='["fast","dist-integration","package-smoke","package-install"]'
          fi
          echo "selected=$selected" >> "$GITHUB_OUTPUT"

      - name: Validate the exact package
        shell: bash
        env:
          VALIDATION_SELECTION_JSON: ${{ steps.selection.outputs.selected }}
          VALIDATION_BUILD_READY: "1"
          A1_RELEASE_RUNNER_LABEL: github-${{ matrix.platform }}-${{ needs.plan.outputs.channel }}
          A1_CONFIG_DIR: ${{ runner.temp }}/a1-release-config
          A1_DATA_DIR: ${{ runner.temp }}/a1-release-data
          A1_RUNTIME_DIR: ${{ runner.temp }}/a1-release-runtime
        run: node scripts/run-validation-tier.mjs --result artifacts/validation/${{ matrix.platform }}.json

      - name: Upload platform outcomes
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-validation-${{ needs.plan.outputs.version }}-${{ matrix.platform }}
          path: artifacts/validation/${{ matrix.platform }}.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Publish ${{ needs.plan.outputs.version }} to npm ${{ needs.plan.outputs.channel }}
    needs: [plan, package, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Download the validated package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-package-${{ needs.plan.outputs.version }}
          path: artifacts/release

      - name: Verify the validated bytes are the bytes being uploaded
        shell: bash
        env:
          EXPECTED_INTEGRITY: ${{ needs.package.outputs.integrity }}
          EXPECTED_SHASUM: ${{ needs.package.outputs.shasum }}
        run: |
          set -euo pipefail
          tarball="$(find artifacts/release -type f -name candidate.tgz)"
          test -n "$tarball"
          echo "release_tarball=$tarball" >> "$GITHUB_ENV"
          RELEASE_TARBALL="$tarball" node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFile } from "node:fs/promises";
          const bytes = await readFile(process.env.RELEASE_TARBALL);
          const integrity = `sha512-${createHash("sha512").update(bytes).digest("base64")}`;
          const shasum = createHash("sha1").update(bytes).digest("hex");
          if (integrity !== process.env.EXPECTED_INTEGRITY || shasum !== process.env.EXPECTED_SHASUM) throw new Error("package digest changed between validation and publication");
          NODE

      - name: Verify the packed product is this product
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { gunzipSync } from "node:zlib";
          import { readFile } from "node:fs/promises";
          const identity = JSON.parse(await readFile("src/product-identity.json", "utf8"));
          const archive = gunzipSync(await readFile(process.env.release_tarball));
          const text = buffer => { const end = buffer.indexOf(0); return buffer.subarray(0, end < 0 ? buffer.length : end).toString("utf8"); };
          let manifest;
          for (let offset = 0; offset + 512 <= archive.length;) {
            const header = archive.subarray(offset, offset + 512);
            if (header.every(byte => byte === 0)) break;
            const name = text(header.subarray(0, 100));
            const prefix = text(header.subarray(345, 500));
            const path = prefix ? `${prefix}/${name}` : name;
            const size = Number.parseInt(text(header.subarray(124, 136)).trim() || "0", 8);
            const start = offset + 512;
            if (path === "package/package.json") manifest = JSON.parse(archive.subarray(start, start + size).toString("utf8"));
            offset = start + Math.ceil(size / 512) * 512;
          }
          if (!manifest) throw new Error("packed archive has no manifest");
          if (manifest.name !== identity.packageName) throw new Error(`packed name ${manifest.name} is not the authoritative package`);
          if (manifest.version !== process.env.RELEASE_VERSION) throw new Error(`packed version ${manifest.version} is not ${process.env.RELEASE_VERSION}`);
          if (JSON.stringify(manifest.bin) !== JSON.stringify({ [identity.commandName]: identity.artifacts.cliEntry })) throw new Error("packed command differs from product identity");
          NODE

      - name: Publish the exact package
        run: npm publish "$release_tarball" --tag "${{ needs.plan.outputs.channel }}" --access public --ignore-scripts --provenance --registry https://registry.npmjs.org/

      - name: Verify the registry serves exactly what was uploaded
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ needs.plan.outputs.channel }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          EXPECTED_INTEGRITY: ${{ needs.package.outputs.integrity }}
          EXPECTED_SHASUM: ${{ needs.package.outputs.shasum }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const { name } = JSON.parse(await readFile("package.json", "utf8"));
          let lastError;
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}?verify=${Date.now()}`, { headers: { accept: "application/json", "cache-control": "no-cache" } });
              if (!response.ok) throw new Error(`registry returned HTTP ${response.status}`);
              const metadata = await response.json();
              const manifest = metadata.versions?.[process.env.RELEASE_VERSION];
              if (!manifest) throw new Error(`${process.env.RELEASE_VERSION} has not propagated`);
              if (manifest.dist?.integrity !== process.env.EXPECTED_INTEGRITY || manifest.dist?.shasum !== process.env.EXPECTED_SHASUM) throw new Error("registry bytes differ from the validated package");
              if (metadata["dist-tags"]?.[process.env.RELEASE_CHANNEL] !== process.env.RELEASE_VERSION) throw new Error(`${process.env.RELEASE_CHANNEL} tag differs from the published version`);
              process.exit(0);
            } catch (error) {
              lastError = error;
              if (attempt < 12) await new Promise(resolve => setTimeout(resolve, 5000));
            }
          }
          throw lastError;
          NODE

      # Everything below records a release that already exists on the registry.
      # Nothing here runs before the publish, so a release that fails leaves no
      # tag, no GitHub Release, and no moved branch — only a red run.
      - name: Tag the published commit
        if: needs.plan.outputs.channel == 'latest'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/${tag}" --jq .object.sha 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            # Only the exact commit that was just published may already carry it,
            # which is what a re-run of this job looks like.
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::${tag} already names ${existing}, not the published commit ${GITHUB_SHA}. A release tag is never moved." >&2
              exit 1
            fi
            echo "${tag} already names the published commit."
            exit 0
          fi
          # The response is captured rather than suppressed: this step records a
          # release the registry already serves, so a failure here has to say what
          # went wrong rather than leave the package published and the repository
          # saying nothing about it.
          if ! response="$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/${tag}" -f "sha=$GITHUB_SHA" 2>&1)"; then
            echo "::error::could not create ${tag} at ${GITHUB_SHA}: ${response}" >&2
            exit 1
          fi
          echo "created ${tag} at ${GITHUB_SHA}."

      - name: Record the GitHub Release
        if: needs.plan.outputs.channel == 'latest'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest \
            --title "$(node -p "JSON.parse(require('node:fs').readFileSync('src/product-identity.json','utf8')).displayName") ${RELEASE_VERSION}" \
            --notes "Published to the npm latest tag from ${GITHUB_SHA}." \
            "$release_tarball"

      # master means "what is on the latest npm tag", and nothing but this step
      # ever writes it. The update is a plain fast-forward: no force, so a master
      # that is somehow not an ancestor fails loudly instead of being overwritten.
      - name: Move master to the published release
        if: needs.plan.outputs.channel == 'latest'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if ! response="$(gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/master" -f "sha=$GITHUB_SHA" -F force=false 2>&1)"; then
            echo "::error::could not fast-forward master to ${GITHUB_SHA}: ${response}" >&2
            exit 1
          fi
          echo "master now names ${GITHUB_SHA}."
