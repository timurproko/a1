name: Development validation

on:
  pull_request:
    branches: [develop]
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    name: Determine validation readiness
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      validate: ${{ steps.readiness.outputs.validate }}
      reason: ${{ steps.readiness.outputs.reason }}
    steps:
      - name: Check out trusted readiness policy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Classify candidate readiness
        id: readiness
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_DRAFT: ${{ github.event.pull_request.draft || false }}
          PULL_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          set -euo pipefail
          policy=scripts/release/development-validation-readiness.mjs
          if [ -f "$policy" ]; then
            node "$policy"
          else
            echo 'validate=true' >> "$GITHUB_OUTPUT"
            echo 'reason=policy-bootstrap' >> "$GITHUB_OUTPUT"
            echo '## Development validation readiness' >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo 'The exact base predates readiness classification; preserving conservative validation for this rollout.' >> "$GITHUB_STEP_SUMMARY"
          fi

  full-selection:
    name: Select PR Full regression
    needs: readiness
    if: needs.readiness.outputs.validate == 'true' && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      selected: ${{ steps.selection.outputs.selected }}
      head: ${{ steps.selection.outputs.head }}
      base: ${{ steps.selection.outputs.base }}
      selection-id: ${{ steps.selection.outputs.selection-id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out trusted full-regression policy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .artifacts/full-regression-policy
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Select using exact base policy
        id: selection
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELECTION_MODE: --select
        run: |
          set -euo pipefail
          policy=.artifacts/full-regression-policy/scripts/release/pr-full-regression.mjs
          if [ -f "$policy" ]; then
            node "$policy" "$SELECTION_MODE"
          else
            echo '::error::Trusted PR Full regression selector is unavailable on the exact base; refusing to infer complete-suite selection.'
            exit 1
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pr-full-regression-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/validation/full-regression-selection.json
          if-no-files-found: error

  full-regression:
    name: PR Full regression
    needs: full-selection
    if: needs.full-selection.outputs.selected == 'true'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/full-regression-shared.yml
    with:
      source: ${{ needs.full-selection.outputs.head }}
      base: ${{ needs.full-selection.outputs.base }}
      selection: ${{ needs.full-selection.outputs.selection-id }}
      pr: ${{ github.event.pull_request.number }}

  changes:
    name: Detect change surface
    needs: readiness
    if: needs.readiness.outputs.validate == 'true'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      acceptance-only: ${{ steps.route.outputs.acceptance_only || 'false' }}
      implementation-bound: "${{ github.event_name == 'pull_request' && (steps.route.outputs.implementation_bound || 'true') || 'false' }}"
      docs-only: ${{ steps.selection.outputs.docs_only }}
      version-only: ${{ steps.selection.outputs.version_only }}
      openspec-touched: ${{ steps.selection.outputs.openspec_touched }}
      rendering-tier: ${{ steps.selection.outputs.rendering_tier }}
      documentation-required: ${{ steps.selection.outputs.documentation_required }}
      naming-required: ${{ steps.selection.outputs.naming_required }}
      naming-mode: ${{ steps.selection.outputs.naming_mode }}
      modular-matrix: ${{ steps.matrix.outputs.modular_matrix }}
      head-sha: ${{ steps.route.outputs.acceptance_only == 'true' && steps.route.outputs.head_sha || steps.selection.outputs.head_sha }}
    steps:
      - name: Route exact acceptance candidate from trusted base
        id: route
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          router="$RUNNER_TEMP/acceptance-validation-route.mjs"
          url="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/scripts/governance/acceptance-validation-route.mjs?ref=$BASE_SHA"
          if curl --silent --show-error --fail --location \
            --header "authorization: Bearer $GITHUB_TOKEN" \
            --header "accept: application/vnd.github.raw+json" \
            --header "x-github-api-version: 2022-11-28" \
            "$url" > "$router"; then
            node "$router"
          else
            echo "::notice::Trusted acceptance router is unavailable at base $BASE_SHA; using generic validation."
            echo "acceptance_only=false" >> "$GITHUB_OUTPUT"
            echo "implementation_bound=true" >> "$GITHUB_OUTPUT"
            echo "head_sha=$EXPECTED_HEAD" >> "$GITHUB_OUTPUT"
            echo "route_reason=trusted-router-unavailable" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out head
        if: steps.route.outputs.acceptance_only != 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        if: steps.route.outputs.acceptance_only != 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install exact analysis dependencies
        if: steps.route.outputs.acceptance_only != 'true'
        run: npm ci --ignore-scripts

      - name: Select validation from the complete impact
        id: selection
        if: steps.route.outputs.acceptance_only != 'true'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          IMPLEMENTATION_BOUND: ${{ steps.route.outputs.implementation_bound || 'false' }}
        run: |
          set -euo pipefail
          base_args=()
          manual_args=()
          implementation_args=()
          if [ -n "$EVENT_BASE_SHA" ]; then base_args=(--base "$EVENT_BASE_SHA"); fi
          if [ "$EVENT_NAME" != "pull_request" ]; then manual_args=(--manual-no-comparison); fi
          if [ "$IMPLEMENTATION_BOUND" = 'true' ]; then implementation_args=(--implementation-bound); fi
          node scripts/release/select-validation-impact.mjs \
            "${base_args[@]}" "${manual_args[@]}" "${implementation_args[@]}" \
            --head "$EVENT_HEAD_SHA" \
            --output .artifacts/validation/impact.json \
            > "$RUNNER_TEMP/impact.json"
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFile } from "node:fs/promises";
          const value = JSON.parse(await readFile(".artifacts/validation/impact.json", "utf8"));
          console.log(`docs_only=${value.docsOnly}`);
          console.log(`version_only=${value.versionOnly}`);
          console.log(`openspec_touched=${value.openspecTouched}`);
          console.log(`rendering_tier=${value.rendering.tier}`);
          console.log(`documentation_required=${value.documentation.required}`);
          console.log(`naming_required=${value.naming.required}`);
          console.log(`naming_mode=${value.naming.mode}`);
          console.log(`head_sha=${value.head}`);
          NODE
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFile } from "node:fs/promises";
          const value = JSON.parse(await readFile(".artifacts/validation/impact.json", "utf8"));
          console.log("## Development validation impact\n");
          console.log(`Head: \`${value.head}\``);
          console.log(`Rendering: **${value.rendering.tier}**`);
          console.log(`Documentation files: **${value.documentation.paths.length}**`);
          console.log(`Classifier: **${value.timing.classifierMs}ms**`);
          console.log(`Integration mode: **${value.integration.selection.mode}**; selection: \`${value.integration.selection.selectionId}\`\n`);
          console.log(`PR core: **${value.prCore.tests.length}** regular tests; **${value.prCore.resourceTests.length}** resource-sensitive tests; selection: \`${value.selectionId}\``);
          for (const owner of value.prCore.owners) console.log(`- ${owner.owner}: **${owner.selected ? "selected" : "excluded"}** (${owner.reasons.map(reason => reason.code).join(", ")})`);
          for (const owner of value.integration.selection.owners) console.log(`- integration/${owner.owner}: **${owner.selected ? "selected" : "excluded"}** (${owner.reasons.map(reason => reason.code).join(", ")})`);
          for (const reason of [...value.rendering.reasons, ...value.rendering.fallbacks].slice(0, 20)) console.log(`- rendering: ${reason}`);
          NODE

      - name: Select modular jobs from the trusted selection
        id: matrix
        if: steps.route.outputs.acceptance_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/validation-matrix.mjs --impact .artifacts/validation/impact.json > "$RUNNER_TEMP/modular-matrix.json"
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFile } from "node:fs/promises";
          const matrix = JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/modular-matrix.json`, "utf8"));
          console.log(`\nModular jobs scheduled: **${matrix.include.length}**; left unscheduled by the selection: **${matrix.inactive.length}**.`);
          for (const entry of matrix.include) console.log(`- scheduled: ${entry.label} (${entry.platform}, node ${entry.node})`);
          for (const entry of matrix.inactive) console.log(`- unscheduled: ${entry.label} (${entry.platform}, node ${entry.node})`);
          NODE

      - name: Upload exact impact selection
        if: steps.route.outputs.acceptance_only != 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: development-validation-impact
          path: .artifacts/validation/impact.json
          if-no-files-found: error
          retention-days: 14

  acceptance:
    name: Acceptance record validation
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.acceptance-only == 'true'
    permissions:
      contents: read
      pull-requests: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      acceptance-candidate: ${{ steps.validation.outputs.acceptance_candidate || 'false' }}
    steps:
      - name: Check out trusted base policy only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Detect trusted acceptance policy deployment
        id: policy
        shell: bash
        run: |
          if [ -f scripts/governance/openspec-acceptance-github.mjs ]; then
            echo 'installed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Acceptance policy is not deployed on this trusted base; this is not acceptance evidence.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Validate acceptance record using trusted policy
        id: validation
        if: steps.policy.outputs.installed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACCEPTANCE_PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          result="$RUNNER_TEMP/acceptance-validation.json"
          node scripts/governance/reconcile-openspec-archive.mjs --validate-acceptance --pr "$ACCEPTANCE_PR_NUMBER" > "$result"
          cat "$result"
          RESULT_PATH="$result" node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFile } from "node:fs/promises";
          const value = JSON.parse(await readFile(process.env.RESULT_PATH, "utf8"));
          console.log(`acceptance_candidate=${value.disposition === "awaiting-manual-acceptance-merge"}`);
          NODE

  delivery:
    name: Finalized delivery validation
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.acceptance-only != 'true' && needs.changes.outputs.implementation-bound == 'true'
    permissions:
      contents: read
      pull-requests: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      delivery-candidate: ${{ steps.validation.outputs.delivery_candidate || steps.legacy.outputs.delivery_candidate || 'false' }}
    steps:
      - name: Check out trusted base delivery policy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Detect implementation delivery version
        id: version
        env:
          PULL_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { parseImplementation } from "./scripts/governance/openspec-archive-policy.mjs";
          console.log(`version=${parseImplementation(process.env.PULL_BODY ?? "")?.version ?? "unknown"}`);
          NODE
      - name: Detect deployed finalized-delivery policy
        id: policy
        shell: bash
        run: |
          if grep -q 'PHASE_FREE_VERSION3_BODY_POLICY = true' scripts/governance/openspec-acceptance-checklist.mjs \
            && grep -q 'ACTIVE_TO_ARCHIVE_RENAME_POLICY = true' scripts/governance/openspec-archive-github.mjs; then
            echo 'installed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'The complete finalized-delivery policy is not deployed on the base; validating this bootstrap candidate with its full authority-changing head.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check out exact implementation policy for bootstrap
        if: steps.version.outputs.version == '3' && steps.policy.outputs.installed != 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.changes.outputs.head-sha }}
          persist-credentials: false
      - name: Validate finalized version-3 delivery record
        id: validation
        if: steps.version.outputs.version == '3'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DELIVERY_PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          result="$RUNNER_TEMP/delivery-validation.json"
          errors="$RUNNER_TEMP/delivery-validation.err"
          if ! node scripts/governance/reconcile-openspec-archive.mjs --validate-acceptance --pr "$DELIVERY_PR_NUMBER" > "$result" 2> "$errors"; then
            cat "$errors" >&2
            if grep -q 'delivery-not-finalized' "$errors"; then
              runs="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/openspec-finalization.yml"
              echo "::error::Awaiting automated finalization: this head still holds the active change. The OpenSpec finalization workflow finalizes ready pull requests and pushes the finalized head, which then receives its own validation: $runs"
              printf '## Finalized delivery validation\n\nAwaiting automated finalization. This head still holds the active change; the [OpenSpec finalization workflow](%s) pushes the finalized head, which receives its own validation. If that workflow failed, its summary names the finalization blocker.\n' "$runs" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 1
          fi
          cat "$result"
          RESULT_PATH="$result" node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFile } from "node:fs/promises";
          const value = JSON.parse(await readFile(process.env.RESULT_PATH, "utf8"));
          console.log(`delivery_candidate=${value.disposition === "ready-for-manual-merge"}`);
          NODE
      - name: Preserve legacy implementation validation route
        id: legacy
        if: steps.version.outputs.version == '1' || steps.version.outputs.version == '2'
        shell: bash
        run: |
          echo 'delivery_candidate=true' >> "$GITHUB_OUTPUT"
          echo 'Legacy version-1/version-2 implementation keeps its established validation and acceptance route.' >> "$GITHUB_STEP_SUMMARY"

  docs:
    name: Documentation governance validation
    permissions:
      contents: read
      pull-requests: read
      actions: read
    needs: changes
    if: needs.changes.outputs.acceptance-only != 'true' && needs.changes.outputs.docs-only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.changes.outputs.head-sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Install pinned archive validation tooling
        if: needs.changes.outputs.openspec-touched == 'true'
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/openspec-archive-tools" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @fission-ai/openspec@1.11.0
      - name: Verify generated archive merge result
        if: needs.changes.outputs.openspec-touched == 'true' && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE_PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: node scripts/governance/reconcile-openspec-archive.mjs --validate-candidate --pr "$ARCHIVE_PR_NUMBER" --tool-root "$RUNNER_TEMP/openspec-archive-tools/node_modules/@fission-ai/openspec"
      - name: Verify docs-sensitive generated governance
        run: node scripts/governance/check-docs-governance.mjs
      - name: Validate OpenSpec artifacts strictly
        if: needs.changes.outputs.openspec-touched == 'true'
        run: npx --yes @fission-ai/openspec@1.8.0 validate --all --strict --no-interactive

  naming:
    name: Internal naming validation
    needs: changes
    if: needs.changes.outputs.acceptance-only != 'true' && needs.changes.outputs.naming-required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      head-sha: ${{ steps.evidence.outputs.head_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.changes.outputs.head-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: development-validation-impact
          path: .artifacts/validation
      - name: Validate complete new and changed inputs
        run: node scripts/governance/product-identifier-policy.mjs --check --selection .artifacts/validation/impact.json --result .artifacts/validation/naming.json
      - name: Exercise policy regression tests
        if: needs.changes.outputs.naming-mode == 'full'
        run: npx vitest run test/repository-governance/naming-inspection.test.ts test/repository-governance/naming-selection.test.ts --maxWorkers=1 --minWorkers=1
      - name: Bind successful evidence to its head
        id: evidence
        shell: bash
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFile, appendFile } from "node:fs/promises";
          const result = JSON.parse(await readFile(".artifacts/validation/naming.json", "utf8"));
          if (!result.passed) throw new Error("naming validation did not pass");
          console.log(`head_sha=${result.head}`);
          await appendFile(process.env.GITHUB_STEP_SUMMARY, `Naming: **${result.mode}**; inspected **${result.inspectedPaths.length}** files; **${result.internalIdentifiers.length}** violations; **${result.durationMs}ms**. Head: ${result.head}\n`);
          NODE
      - name: Upload naming evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: development-naming-validation
          path: .artifacts/validation/naming.json
          if-no-files-found: warn
          retention-days: 14

  documentation:
    name: Changed-file documentation validation
    needs: changes
    if: needs.changes.outputs.acceptance-only != 'true' && needs.changes.outputs.docs-only != 'true' && needs.changes.outputs.version-only != 'true' && needs.changes.outputs.documentation-required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out selected head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.changes.outputs.head-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: development-validation-impact
          path: .artifacts/validation
      - name: Check modified and new documentation inputs
        run: node scripts/governance/check-code-documentation.mjs --mode changed --selection .artifacts/validation/impact.json --result .artifacts/validation/code-documentation.json
      - name: Report changed-file documentation evidence
        if: always()
        shell: bash
        run: |
          if [ -f .artifacts/validation/code-documentation.json ]; then
            node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFile } from "node:fs/promises";
          const value = JSON.parse(await readFile(".artifacts/validation/code-documentation.json", "utf8"));
          console.log(`Files inspected: **${value.filesInspected}**; context files: **${value.contextFiles}**; full scans: **${value.fullRepositoryScans}**; duration: **${value.durationMs}ms**.`);
          NODE
          fi
      - name: Upload changed-file documentation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: development-code-documentation
          path: .artifacts/validation/code-documentation.json
          if-no-files-found: warn
          retention-days: 14

  modular:
    name: ${{ matrix.label }}
    needs: changes
    if: needs.changes.outputs.acceptance-only != 'true' && needs.changes.outputs.docs-only != 'true' && needs.changes.outputs.version-only != 'true'
    strategy:
      fail-fast: false
      # The trusted selection schedules only active entries; declared entries live in
      # scripts/release/validation-matrix.mjs, and the in-job resolver remains the second check.
      matrix: ${{ fromJSON(needs.changes.outputs.modular-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Start job timing
        shell: bash
        run: echo "VALIDATION_JOB_STARTED_MS=$(node -e 'process.stdout.write(String(Date.now()))')" >> "$GITHUB_ENV"
      - name: Preserve repository bytes during checkout
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - name: Check out validation head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.changes.outputs.head-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Compatibility: Node 22 ships npm 10, whose pack runs the prepare script even under
      # --ignore-scripts; the candidate is packed with the pinned package manager on every lane.
      - name: Use the pinned npm for packing
        shell: bash
        run: |
          pinned=$(node -p "require('./package.json').packageManager.split('@')[1]")
          if [ "$(npm --version)" != "$pinned" ]; then npm install -g "npm@$pinned"; fi
          npm --version
      - name: Download exact impact selection
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: development-validation-impact
          path: .artifacts/validation
      - name: Resolve this target from the trusted selection
        id: job-selection
        run: node scripts/release/resolve-validation-job.mjs --impact .artifacts/validation/impact.json --job ${{ matrix.group }} --platform ${{ matrix.platform }} --architecture ${{ matrix.architecture }} --node ${{ matrix.node }}
      - name: Enable Defender real-time protection for startup acceptance
        if: steps.job-selection.outputs.active == 'true' && matrix.defender
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-MpPreference -DisableRealtimeMonitoring $false
          $deadline = (Get-Date).AddSeconds(30)
          do {
            $enabled = (Get-MpComputerStatus).RealTimeProtectionEnabled
            if ($enabled) { break }
            Start-Sleep -Seconds 1
          } while ((Get-Date) -lt $deadline)
          if (-not $enabled) { throw "Windows Defender real-time protection could not be enabled" }
      - name: Cache process guardian build
        if: steps.job-selection.outputs.active == 'true' && matrix.build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native/process-guardian
      - name: Install exact dependencies and build
        if: steps.job-selection.outputs.active == 'true' && matrix.build
        run: npm ci
      - name: Record verified install-time build
        if: steps.job-selection.outputs.active == 'true' && matrix.build
        run: node scripts/release/record-validation-prerequisite.mjs build
      - name: Test and build process guardian fixture artifact
        if: steps.job-selection.outputs.active == 'true' && matrix.guardian
        shell: bash
        run: |
          cargo test --locked --manifest-path native/process-guardian/Cargo.toml
          cargo build --locked --manifest-path native/process-guardian/Cargo.toml
          echo "A1_PROCESS_GUARDIAN_PATH=${{ github.workspace }}/native/process-guardian/target/debug/${{ matrix.binary }}" >> "$GITHUB_ENV"
      - name: Run exact selected scopes
        if: steps.job-selection.outputs.active == 'true'
        shell: bash
        env:
          VALIDATION_SELECTION_JSON: ${{ steps.job-selection.outputs.scopes_json }}
          VALIDATION_TESTS_JSON: ${{ steps.job-selection.outputs.tests_json }}
          VALIDATION_BUILD_READY: ${{ matrix.build && '1' || '0' }}
          VALIDATION_BUILD_RECEIPT: ${{ github.workspace }}/.artifacts/validation/receipts/build.json
          VALIDATION_HEAD: ${{ steps.job-selection.outputs.head }}
          VALIDATION_SELECTION_ID: ${{ steps.job-selection.outputs.selection_id }}
          VALIDATION_RUN_ID: ${{ github.run_id }}
          VALIDATION_RUN_ATTEMPT: ${{ github.run_attempt }}
          VALIDATION_JOB_ID: ${{ matrix.group }}
          VALIDATION_TARGET_PLATFORM: ${{ matrix.platform }}
          VALIDATION_TARGET_ARCHITECTURE: ${{ matrix.architecture }}
          VALIDATION_TARGET_NODE: ${{ matrix.node }}
          VALIDATION_OWNERS_JSON: ${{ steps.job-selection.outputs.owners_json }}
          VALIDATION_CACHE_STATE: setup-node-download-cache
          A1_CONFIG_DIR: ${{ runner.temp }}/a1-${{ matrix.group }}-config
          A1_DATA_DIR: ${{ runner.temp }}/a1-${{ matrix.group }}-data
          A1_RUNTIME_DIR: ${{ runner.temp }}/a1-${{ matrix.group }}-runtime
          RUN_PROCESS_CONTAINMENT_INTEGRATION: "1"
          # Shared runners measure startup reliably but time it unreliably; this owner records
          # an overrun, and nightly publication and Full regression still fail on it.
          STARTUP_BUDGET_ENFORCEMENT: record
          STARTUP_PERFORMANCE_RESULT: .artifacts/validation/startup-node${{ matrix.node }}-performance.json
        run: node scripts/release/run-validation-tier.mjs --result .artifacts/validation/outcome-${{ matrix.group }}-${{ matrix.platform }}-node${{ matrix.node }}-attempt-${{ github.run_attempt }}.json
      - name: Add modular timing summary
        if: always() && steps.job-selection.outputs.active == 'true'
        shell: bash
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFile } from "node:fs/promises";
          const result = JSON.parse(await readFile(`.artifacts/validation/outcome-${process.env.GROUP}-${process.env.PLATFORM}-node${process.env.NODE_VERSION}-attempt-${process.env.GITHUB_RUN_ATTEMPT}.json`, "utf8"));
          const setup = Math.max(0, result.startedAt - Number(process.env.VALIDATION_JOB_STARTED_MS));
          console.log(`Setup: **${(setup / 1000).toFixed(2)}s**; gates: **${((result.completedAt - result.startedAt) / 1000).toFixed(2)}s**; invocations: **${result.outcomes.length}**.`);
          for (const outcome of result.outcomes) console.log(`- ${outcome.scopes.join(", ")}: **${(outcome.durationMs / 1000).toFixed(2)}s** (${outcome.id})`);
          NODE
        env:
          GROUP: ${{ matrix.group }}
          PLATFORM: ${{ matrix.platform }}
          NODE_VERSION: ${{ matrix.node }}
      - name: Complete content-free job envelope
        if: always()
        shell: bash
        env:
          GROUP: ${{ matrix.group }}
          PLATFORM: ${{ matrix.platform }}
          ARCHITECTURE: ${{ matrix.architecture }}
          NODE_VERSION: ${{ matrix.node }}
          SELECTED_HEAD: ${{ needs.changes.outputs.head-sha }}
          JOB_STATUS: ${{ job.status }}
          ACTIVE: ${{ steps.job-selection.outputs.active || 'unknown' }}
          SELECTION_ID: ${{ steps.job-selection.outputs.selection_id }}
        run: node -e 'const fs=require("fs"),p=`.artifacts/validation/job-envelope-${process.env.GROUP}-${process.env.PLATFORM}-node${process.env.NODE_VERSION}-attempt-${process.env.GITHUB_RUN_ATTEMPT}.json`,x={schema:"a1-validation-job-envelope-v2",head:process.env.SELECTED_HEAD,runId:process.env.GITHUB_RUN_ID,runAttempt:Number(process.env.GITHUB_RUN_ATTEMPT),selectionId:process.env.SELECTION_ID,job:process.env.GROUP,platform:process.env.PLATFORM,architecture:process.env.ARCHITECTURE,node:Number(process.env.NODE_VERSION),startedAt:Number(process.env.VALIDATION_JOB_STARTED_MS),completedAt:Date.now(),status:process.env.JOB_STATUS,active:process.env.ACTIVE};fs.mkdirSync(".artifacts/validation",{recursive:true});fs.writeFileSync(p,JSON.stringify(x,null,2)+"\n")'
      - name: Upload modular outcome and fixture phases
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: development-validation-outcome-${{ matrix.group }}-${{ matrix.platform }}-node${{ matrix.node }}-attempt-${{ github.run_attempt }}
          path: |
            .artifacts/validation/job-envelope-*.json
            .artifacts/validation/outcome-*.json
            .artifacts/validation/startup-node*-performance.json
            .artifacts/validation/package/npm-pack-result.json
            .artifacts/validation/package/*.receipt.json
            .artifacts/validation/receipts/*.json
            .artifacts/validation/phases/*.jsonl
          if-no-files-found: warn
          retention-days: 14

  rendering:
    name: Rendering validation
    needs: changes
    if: needs.changes.outputs.acceptance-only != 'true' && needs.changes.outputs.docs-only != 'true' && needs.changes.outputs.version-only != 'true' && needs.changes.outputs.rendering-tier != 'none'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Start rendering timing
        shell: bash
        run: echo "RENDERING_JOB_STARTED_MS=$(node -e 'process.stdout.write(String(Date.now()))')" >> "$GITHUB_ENV"
      - name: Preserve repository bytes during checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.changes.outputs.head-sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run selected rendering evidence
        shell: bash
        env:
          RENDERING_TIER: ${{ needs.changes.outputs.rendering-tier }}
        run: |
          set -euo pipefail
          if [ "$RENDERING_TIER" = "full" ]; then scope=rendering-stability; else scope=rendering-smoke; fi
          node scripts/release/run-validation-tier.mjs "$scope" --result .artifacts/validation/rendering.json
      - name: Add rendering timing summary
        if: always()
        shell: bash
        run: |
          if [ -f .artifacts/validation/rendering.json ]; then
            node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFile } from "node:fs/promises";
          const result = JSON.parse(await readFile(".artifacts/validation/rendering.json", "utf8"));
          const scope = result.selected.find(value => value.startsWith("rendering-"));
          const structure = result.structuralEvidence?.[scope] ?? {};
          const setup = Math.max(0, result.startedAt - Number(process.env.RENDERING_JOB_STARTED_MS));
          console.log(`Rendering scope: **${scope}**; setup: **${(setup / 1000).toFixed(2)}s**; repository gate time: **${((result.completedAt - result.startedAt) / 1000).toFixed(2)}s**.`);
          console.log(`Workload captures: **${structure.workloadCaptures ?? 0}**; deliberate repeats: **${structure.deliberateRepeatCaptures ?? 0}**; producer launches: **${structure.totalProducerLaunches ?? 0}**.`);
          NODE
          fi
      - name: Upload rendering evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: development-rendering-${{ needs.changes.outputs.rendering-tier }}
          path: .artifacts/validation/rendering.json
          if-no-files-found: warn
          retention-days: 14

  required:
    name: "${{ needs.readiness.outputs.validate == 'true' && 'Development validation required' || 'Development validation deferred' }}"
    if: always() && needs.readiness.result == 'success' && needs.readiness.outputs.validate == 'true'
    needs: [readiness, changes, acceptance, delivery, docs, naming, documentation, modular, rendering, full-selection, full-regression]
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out selected head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.changes.outputs.head-sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out trusted aggregate policy
        if: github.event_name == 'pull_request'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .artifacts/full-regression-policy
          persist-credentials: false
      - name: Download exact PR full-regression selection
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: pr-full-regression-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/validation
      - name: Require current PR full-regression selection and result
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELECTION_MODE: --verify
          FULL_REGRESSION_RESULT: ${{ needs.full-regression.result }}
        run: |
          set -euo pipefail
          policy=.artifacts/full-regression-policy/scripts/release/pr-full-regression.mjs
          if [ -f "$policy" ]; then
            node "$policy" "$SELECTION_MODE"
          else
            echo '::error::Trusted PR Full regression selector is unavailable on the exact base; refusing to infer complete-suite selection.'
            exit 1
          fi
      - name: Require acceptance policy for acceptance candidates
        if: github.event_name == 'pull_request' && needs.changes.outputs.acceptance-only == 'true'
        shell: bash
        env:
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
        run: test "$ACCEPTANCE_RESULT" = 'success'
      - name: Require current impact-selected validation
        env:
          ACCEPTANCE_ONLY: ${{ needs.changes.outputs.acceptance-only }}
          IMPLEMENTATION_BOUND: ${{ needs.changes.outputs.implementation-bound }}
          ACCEPTANCE_CANDIDATE: ${{ needs.acceptance.outputs.acceptance-candidate }}
          DELIVERY_CANDIDATE: ${{ needs.delivery.outputs.delivery-candidate }}
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
          DELIVERY_RESULT: ${{ needs.delivery.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          NAMING_RESULT: ${{ needs.naming.result }}
          NAMING_REQUIRED: ${{ needs.changes.outputs.naming-required }}
          NAMING_HEAD: ${{ needs.naming.outputs.head-sha }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
          MODULAR_RESULT: ${{ needs.modular.result }}
          RENDERING_RESULT: ${{ needs.rendering.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs-only }}
          VERSION_ONLY: ${{ needs.changes.outputs.version-only }}
          OPENSPEC_TOUCHED: ${{ needs.changes.outputs.openspec-touched }}
          DOCUMENTATION_REQUIRED: ${{ needs.changes.outputs.documentation-required }}
          RENDERING_TIER: ${{ needs.changes.outputs.rendering-tier }}
          SELECTED_HEAD: ${{ needs.changes.outputs.head-sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/release/require-development-validation.mjs
      - name: Require finalized delivery policy for implementation candidates
        if: needs.changes.outputs.implementation-bound == 'true'
        shell: bash
        env:
          DELIVERY_RESULT: ${{ needs.delivery.result }}
        run: test "$DELIVERY_RESULT" = 'success'
      - name: Download exact impact selection
        if: needs.changes.outputs.acceptance-only != 'true' && needs.changes.outputs.docs-only != 'true' && needs.changes.outputs.version-only != 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: development-validation-impact
          path: .artifacts/validation
      - name: Download all modular outcomes
        if: needs.changes.outputs.acceptance-only != 'true' && needs.changes.outputs.docs-only != 'true' && needs.changes.outputs.version-only != 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: development-validation-outcome-*
          path: .artifacts/validation/outcomes
          merge-multiple: true
      - name: Require exact selected owner outcomes
        if: needs.changes.outputs.acceptance-only != 'true' && needs.changes.outputs.docs-only != 'true' && needs.changes.outputs.version-only != 'true'
        env:
          VALIDATION_HEAD: ${{ needs.changes.outputs.head-sha }}
          VALIDATION_MODULAR_RESULT: ${{ needs.modular.result }}
          VALIDATION_IMPACT: .artifacts/validation/impact.json
          VALIDATION_OUTCOMES_DIR: .artifacts/validation/outcomes
        run: node scripts/release/require-modular-validation.mjs
      - name: Report aggregate timing and cadence
        if: needs.changes.outputs.acceptance-only != 'true' && needs.changes.outputs.docs-only != 'true' && needs.changes.outputs.version-only != 'true'
        shell: bash
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFile } from "node:fs/promises";
          const report = JSON.parse(await readFile(".artifacts/validation/aggregate.json", "utf8"));
          console.log(`Selected PR owners: **${report.selectedOwners.join(", ")}**.`);
          console.log(`Deferred exhaustive owners: **${report.deferredOwners.join(", ") || "none"}**.`);
          console.log(`Runner critical path: **${(report.criticalPathMs / 1000).toFixed(2)}s**; maximum scope: **${(report.maxScopeMs / 1000).toFixed(2)}s**; aggregate processing: **${(report.aggregateProcessingMs / 1000).toFixed(2)}s**.`);
          console.log(`Targets: critical path **${report.targets.criticalPathMet ? "met" : "unmet"}** (≤8m); scope **${report.targets.scopeMet ? "met" : "unmet"}** (≤5m).`);
          NODE
      - name: Upload aggregate evidence
        if: always() && needs.changes.outputs.acceptance-only != 'true' && needs.changes.outputs.docs-only != 'true' && needs.changes.outputs.version-only != 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: development-validation-aggregate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/validation/aggregate.json
          if-no-files-found: error
          retention-days: 14
