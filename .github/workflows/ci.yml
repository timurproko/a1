name: Development validation

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect change surface
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - name: Check out head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: diff
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse "$EVENT_HEAD_SHA")"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$(git merge-base "$EVENT_BASE_SHA" "$head_sha")"
          elif [[ "$EVENT_BASE_SHA" =~ ^[a-f0-9]{40}$ ]] && [ "$EVENT_BASE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$EVENT_BASE_SHA^{commit}" 2>/dev/null; then
            base_sha="$EVENT_BASE_SHA"
          else
            base_sha="$(git rev-parse "$head_sha^")"
          fi
          docs_only=true
          while IFS= read -r path; do
            case "$path" in
              docs/*|openspec/*|*.md|LICENSE|.gitignore) ;;
              *) docs_only=false; break ;;
            esac
          done < <(git diff --name-only "$base_sha" "$head_sha")
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "Docs-only change: $docs_only" >> "$GITHUB_STEP_SUMMARY"

  docs:
    name: OpenSpec validation
    needs: changes
    if: needs.changes.outputs.docs-only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate OpenSpec artifacts strictly
        run: npx --yes @fission-ai/openspec@1.8.0 validate --all --strict --no-interactive

  validate:
    name: Fast validation
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Preserve repository bytes during checkout
        shell: bash
        run: git config --global core.autocrlf false

      - name: Check out validation head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run fast tier and architecture checks
        shell: bash
        env:
          A1_CONFIG_DIR: ${{ runner.temp }}\a1-ci-config
          A1_DATA_DIR: ${{ runner.temp }}\a1-ci-data
          A1_RUNTIME_DIR: ${{ runner.temp }}\a1-ci-runtime
        run: node scripts/run-validation-tier.mjs typecheck architecture fast --result artifacts/validation/outcomes.json

      - name: Add timing summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/validation/outcomes.json ]; then
            node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFile } from "node:fs/promises";
          const result = JSON.parse(await readFile("artifacts/validation/outcomes.json", "utf8"));
          console.log("## Validation timing\n");
          console.log(`Total: **${((result.completedAt - result.startedAt) / 1000).toFixed(2)}s**\n`);
          console.log("| Gate | Seconds | Result |\n| --- | ---: | --- |");
          for (const outcome of result.outcomes) console.log(`| ${outcome.id} | ${(outcome.durationMs / 1000).toFixed(2)} | ${outcome.exitCode === 0 ? outcome.skipped ?? "passed" : "failed"} |`);
          NODE
          fi

  required:
    name: Development validation required
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: [changes, docs, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the validation matching the change surface
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs-only }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = "success"
          if [ "$DOCS_ONLY" = "true" ]; then
            echo "Docs-only change: OpenSpec validation only."
            test "$DOCS_RESULT" = "success"
          else
            test "$VALIDATE_RESULT" = "success"
          fi
