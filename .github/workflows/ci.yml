name: Development validation

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect change surface
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      docs-only: ${{ steps.selection.outputs.docs_only }}
      version-only: ${{ steps.selection.outputs.version_only }}
      openspec-touched: ${{ steps.selection.outputs.openspec_touched }}
      rendering-tier: ${{ steps.selection.outputs.rendering_tier }}
      documentation-required: ${{ steps.selection.outputs.documentation_required }}
      head-sha: ${{ steps.selection.outputs.head_sha }}
    steps:
      - name: Check out head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install exact analysis dependencies
        run: npm ci --ignore-scripts

      - name: Select validation from the complete impact
        id: selection
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base_args=()
          if [ -n "$EVENT_BASE_SHA" ]; then base_args=(--base "$EVENT_BASE_SHA"); fi
          node scripts/release/select-validation-impact.mjs \
            "${base_args[@]}" \
            --head "$EVENT_HEAD_SHA" \
            --output .artifacts/validation/impact.json \
            > "$RUNNER_TEMP/impact.json"
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFile } from "node:fs/promises";
          const value = JSON.parse(await readFile(".artifacts/validation/impact.json", "utf8"));
          console.log(`docs_only=${value.docsOnly}`);
          console.log(`version_only=${value.versionOnly}`);
          console.log(`openspec_touched=${value.openspecTouched}`);
          console.log(`rendering_tier=${value.rendering.tier}`);
          console.log(`documentation_required=${value.documentation.required}`);
          console.log(`head_sha=${value.head}`);
          NODE
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFile } from "node:fs/promises";
          const value = JSON.parse(await readFile(".artifacts/validation/impact.json", "utf8"));
          console.log("## Development validation impact\n");
          console.log(`Head: \`${value.head}\``);
          console.log(`Rendering: **${value.rendering.tier}**`);
          console.log(`Documentation files: **${value.documentation.paths.length}**`);
          console.log(`Classifier: **${value.timing.classifierMs}ms**\n`);
          for (const reason of [...value.rendering.reasons, ...value.rendering.fallbacks].slice(0, 20)) console.log(`- ${reason}`);
          NODE

      - name: Upload exact impact selection
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: development-validation-impact
          path: .artifacts/validation/impact.json
          if-no-files-found: error
          retention-days: 14

  docs:
    name: Documentation governance validation
    needs: changes
    if: needs.changes.outputs.docs-only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.changes.outputs.head-sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Verify docs-sensitive generated governance
        run: node scripts/governance/check-docs-governance.mjs
      - name: Validate OpenSpec artifacts strictly
        if: needs.changes.outputs.openspec-touched == 'true'
        run: npx --yes @fission-ai/openspec@1.8.0 validate --all --strict --no-interactive

  documentation:
    name: Changed-file documentation validation
    needs: changes
    if: needs.changes.outputs.docs-only != 'true' && needs.changes.outputs.version-only != 'true' && needs.changes.outputs.documentation-required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out selected head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.changes.outputs.head-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: development-validation-impact
          path: .artifacts/validation
      - name: Check modified and new documentation inputs
        run: node scripts/governance/check-code-documentation.mjs --mode changed --selection .artifacts/validation/impact.json --result .artifacts/validation/code-documentation.json
      - name: Report changed-file documentation evidence
        if: always()
        shell: bash
        run: |
          if [ -f .artifacts/validation/code-documentation.json ]; then
            node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFile } from "node:fs/promises";
          const value = JSON.parse(await readFile(".artifacts/validation/code-documentation.json", "utf8"));
          console.log(`Files inspected: **${value.filesInspected}**; context files: **${value.contextFiles}**; full scans: **${value.fullRepositoryScans}**; duration: **${value.durationMs}ms**.`);
          NODE
          fi
      - name: Upload changed-file documentation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: development-code-documentation
          path: .artifacts/validation/code-documentation.json
          if-no-files-found: warn
          retention-days: 14

  validate:
    name: Fast validation
    needs: changes
    if: needs.changes.outputs.docs-only != 'true' && needs.changes.outputs.version-only != 'true'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Start ordinary timing
        shell: bash
        run: echo "A1_JOB_STARTED_MS=$(node -e 'process.stdout.write(String(Date.now()))')" >> "$GITHUB_ENV"
      - name: Preserve repository bytes during checkout
        shell: bash
        run: git config --global core.autocrlf false
      - name: Check out validation head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.changes.outputs.head-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: Cache process guardian build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native/process-guardian
      - name: Install exact dependencies
        run: npm ci
      - name: Build process guardian fixture artifact
        shell: bash
        run: cargo build --locked --manifest-path native/process-guardian/Cargo.toml
      - name: Run ordinary validation
        shell: bash
        env:
          VALIDATION_SELECTION_JSON: '["typecheck","architecture","fast","dist-integration"]'
          A1_CONFIG_DIR: ${{ runner.temp }}\a1-ci-config
          A1_DATA_DIR: ${{ runner.temp }}\a1-ci-data
          A1_RUNTIME_DIR: ${{ runner.temp }}\a1-ci-runtime
          A1_PROCESS_GUARDIAN_PATH: ${{ github.workspace }}\native\process-guardian\target\debug\process-guardian.exe
          A1_RUN_PROCESS_CONTAINMENT_INTEGRATION: "1"
        run: node scripts/release/run-validation-tier.mjs --result .artifacts/validation/outcomes.json
      - name: Verify Pi restoration and exact-package resume separately from fast tests
        shell: bash
        env:
          VALIDATION_BUILD_READY: "1"
        run: node scripts/release/run-validation-tier.mjs pi-engine-conformance package-smoke --result .artifacts/validation/resume-integration.json
      - name: Upload resume integration evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: development-resume-integration
          path: .artifacts/validation/resume-integration.json
          if-no-files-found: warn
          retention-days: 14
      - name: Add ordinary timing summary
        if: always()
        shell: bash
        run: |
          if [ -f .artifacts/validation/outcomes.json ]; then
            node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFile } from "node:fs/promises";
          const result = JSON.parse(await readFile(".artifacts/validation/outcomes.json", "utf8"));
          const setup = Math.max(0, result.startedAt - Number(process.env.A1_JOB_STARTED_MS));
          console.log(`Setup: **${(setup / 1000).toFixed(2)}s**; repository gates: **${((result.completedAt - result.startedAt) / 1000).toFixed(2)}s**\n`);
          console.log("| Gate | Seconds | Result |\n| --- | ---: | --- |");
          for (const outcome of result.outcomes) console.log(`| ${outcome.id} | ${(outcome.durationMs / 1000).toFixed(2)} | ${outcome.exitCode === 0 ? outcome.skipped ?? "passed" : "failed"} |`);
          NODE
          fi

  startup:
    name: Startup budget (windows-node${{ matrix.node }})
    needs: changes
    if: needs.changes.outputs.docs-only != 'true' && needs.changes.outputs.version-only != 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        node: [22, 24]
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Preserve repository bytes during checkout
        shell: bash
        run: git config --global core.autocrlf false
      - name: Check out validation head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.changes.outputs.head-sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Enable Defender real-time protection for startup acceptance
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-MpPreference -DisableRealtimeMonitoring $false
          $deadline = (Get-Date).AddSeconds(30)
          do {
            $enabled = (Get-MpComputerStatus).RealTimeProtectionEnabled
            if ($enabled) { break }
            Start-Sleep -Seconds 1
          } while ((Get-Date) -lt $deadline)
          if (-not $enabled) { throw "Windows Defender real-time protection could not be enabled" }
      - name: Install exact dependencies and build
        run: npm ci
      - name: Validate first-attempt exact-package startup budget
        shell: bash
        env:
          VALIDATION_BUILD_READY: "1"
          A1_CONFIG_DIR: ${{ runner.temp }}\a1-startup-config
          A1_DATA_DIR: ${{ runner.temp }}\a1-startup-data
          A1_RUNTIME_DIR: ${{ runner.temp }}\a1-startup-runtime
          STARTUP_PERFORMANCE_RESULT: .artifacts/validation/startup-node${{ matrix.node }}-performance.json
        run: node scripts/release/run-validation-tier.mjs package-install --result .artifacts/validation/startup-node${{ matrix.node }}.json
      - name: Upload startup budget evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: development-startup-node${{ matrix.node }}
          path: .artifacts/validation/startup-node${{ matrix.node }}*.json
          if-no-files-found: warn
          retention-days: 14

  rendering:
    name: Rendering validation
    needs: changes
    if: needs.changes.outputs.docs-only != 'true' && needs.changes.outputs.version-only != 'true' && needs.changes.outputs.rendering-tier != 'none'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Start rendering timing
        shell: bash
        run: echo "A1_RENDERING_JOB_STARTED_MS=$(node -e 'process.stdout.write(String(Date.now()))')" >> "$GITHUB_ENV"
      - name: Preserve repository bytes during checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.changes.outputs.head-sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run selected rendering evidence
        shell: bash
        env:
          RENDERING_TIER: ${{ needs.changes.outputs.rendering-tier }}
        run: |
          set -euo pipefail
          if [ "$RENDERING_TIER" = "full" ]; then scope=rendering-stability; else scope=rendering-smoke; fi
          node scripts/release/run-validation-tier.mjs "$scope" --result .artifacts/validation/rendering.json
      - name: Add rendering timing summary
        if: always()
        shell: bash
        run: |
          if [ -f .artifacts/validation/rendering.json ]; then
            node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFile } from "node:fs/promises";
          const result = JSON.parse(await readFile(".artifacts/validation/rendering.json", "utf8"));
          const scope = result.selected.find(value => value.startsWith("rendering-"));
          const structure = result.structuralEvidence?.[scope] ?? {};
          const setup = Math.max(0, result.startedAt - Number(process.env.A1_RENDERING_JOB_STARTED_MS));
          console.log(`Rendering scope: **${scope}**; setup: **${(setup / 1000).toFixed(2)}s**; repository gate time: **${((result.completedAt - result.startedAt) / 1000).toFixed(2)}s**.`);
          console.log(`Workload captures: **${structure.workloadCaptures ?? 0}**; deliberate repeats: **${structure.deliberateRepeatCaptures ?? 0}**; producer launches: **${structure.totalProducerLaunches ?? 0}**.`);
          NODE
          fi
      - name: Upload rendering evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: development-rendering-${{ needs.changes.outputs.rendering-tier }}
          path: .artifacts/validation/rendering.json
          if-no-files-found: warn
          retention-days: 14

  containment:
    name: Process containment (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.docs-only != 'true' && needs.changes.outputs.version-only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            binary: process-guardian
          - os: macos-15
            binary: process-guardian
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out validation head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.changes.outputs.head-sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: Cache process guardian build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native/process-guardian
      - run: npm ci
      - shell: bash
        run: cargo build --locked --manifest-path native/process-guardian/Cargo.toml
      - shell: bash
        env:
          A1_PROCESS_GUARDIAN_PATH: ${{ github.workspace }}/native/process-guardian/target/debug/${{ matrix.binary }}
          A1_RUN_PROCESS_CONTAINMENT_INTEGRATION: "1"
        run: npx vitest run test/foundation/process-containment --testTimeout=30000
      - name: Validate packaged macOS supervision and containment
        if: matrix.os == 'macos-15'
        shell: bash
        env:
          A1_CONFIG_DIR: ${{ runner.temp }}/a1-development-config
          A1_DATA_DIR: ${{ runner.temp }}/a1-development-data
          A1_RUNTIME_DIR: ${{ runner.temp }}/a1-development-runtime
        run: node scripts/release/run-validation-tier.mjs package-smoke

  required:
    name: Development validation required
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: [changes, docs, documentation, validate, startup, rendering, containment]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out selected head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.changes.outputs.head-sha }}
          persist-credentials: false
      - name: Require current impact-selected validation
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          RENDERING_RESULT: ${{ needs.rendering.result }}
          CONTAINMENT_RESULT: ${{ needs.containment.result }}
          STARTUP_RESULT: ${{ needs.startup.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs-only }}
          VERSION_ONLY: ${{ needs.changes.outputs.version-only }}
          OPENSPEC_TOUCHED: ${{ needs.changes.outputs.openspec-touched }}
          DOCUMENTATION_REQUIRED: ${{ needs.changes.outputs.documentation-required }}
          RENDERING_TIER: ${{ needs.changes.outputs.rendering-tier }}
          SELECTED_HEAD: ${{ needs.changes.outputs.head-sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/release/require-development-validation.mjs
