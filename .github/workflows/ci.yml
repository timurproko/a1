name: Development validation

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect change surface
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.diff.outputs.docs_only }}
      version-only: ${{ steps.diff.outputs.version_only }}
    steps:
      - name: Check out head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: diff
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse "$EVENT_HEAD_SHA")"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$(git merge-base "$EVENT_BASE_SHA" "$head_sha")"
          elif [[ "$EVENT_BASE_SHA" =~ ^[a-f0-9]{40}$ ]] && [ "$EVENT_BASE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$EVENT_BASE_SHA^{commit}" 2>/dev/null; then
            base_sha="$EVENT_BASE_SHA"
          else
            base_sha="$(git rev-parse "$head_sha^")"
          fi
          docs_only=true
          while IFS= read -r path; do
            case "$path" in
              docs/*|openspec/*|*.md|LICENSE|.gitignore) ;;
              *) docs_only=false; break ;;
            esac
          done < <(git diff --name-only "$base_sha" "$head_sha")
          version_only=false
          if [ "$docs_only" != "true" ]; then
            changed="$(git diff --name-only "$base_sha" "$head_sha")"
            if [ -n "$changed" ] && ! grep -qvE '^(package\.json|package-lock\.json)$' <<< "$changed"; then
              if ! git diff --unified=0 "$base_sha" "$head_sha" -- package.json package-lock.json \
                | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' \
                | grep -qvE '^[+-][[:space:]]*"version": "[^"]+",?$'; then
                version_only=true
              fi
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "version_only=$version_only" >> "$GITHUB_OUTPUT"
          echo "Docs-only change: $docs_only" >> "$GITHUB_STEP_SUMMARY"
          echo "Version-only change: $version_only" >> "$GITHUB_STEP_SUMMARY"

  docs:
    name: OpenSpec validation
    needs: changes
    if: needs.changes.outputs.docs-only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Validate OpenSpec artifacts strictly
        run: npx --yes @fission-ai/openspec@1.8.0 validate --all --strict --no-interactive

  validate:
    name: Fast validation
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Preserve repository bytes during checkout
        shell: bash
        run: git config --global core.autocrlf false

      - name: Check out validation head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Cache process guardian build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native/process-guardian

      - name: Install exact dependencies
        run: npm ci

      - name: Build process guardian fixture artifact
        shell: bash
        run: cargo build --locked --manifest-path native/process-guardian/Cargo.toml

      - name: Select validation matching the change surface
        id: selection
        shell: bash
        env:
          VERSION_ONLY: ${{ needs.changes.outputs.version-only }}
        run: |
          set -euo pipefail
          if [ "$VERSION_ONLY" = "true" ]; then
            echo 'selected=["package-smoke","package-install"]' >> "$GITHUB_OUTPUT"
          else
            echo 'selected=["typecheck","architecture","fast","dist-integration"]' >> "$GITHUB_OUTPUT"
          fi

      - name: Run selected validation
        shell: bash
        env:
          VALIDATION_SELECTION_JSON: ${{ steps.selection.outputs.selected }}
          A1_CONFIG_DIR: ${{ runner.temp }}\a1-ci-config
          A1_DATA_DIR: ${{ runner.temp }}\a1-ci-data
          A1_RUNTIME_DIR: ${{ runner.temp }}\a1-ci-runtime
          A1_PROCESS_GUARDIAN_PATH: ${{ github.workspace }}\native\process-guardian\target\debug\a1-process-guardian.exe
          A1_RUN_PROCESS_CONTAINMENT_INTEGRATION: "1"
        run: node scripts/run-validation-tier.mjs --result artifacts/validation/outcomes.json

      - name: Add timing summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/validation/outcomes.json ]; then
            node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFile } from "node:fs/promises";
          const result = JSON.parse(await readFile("artifacts/validation/outcomes.json", "utf8"));
          console.log("## Validation timing\n");
          console.log(`Total: **${((result.completedAt - result.startedAt) / 1000).toFixed(2)}s**\n`);
          console.log("| Gate | Seconds | Result |\n| --- | ---: | --- |");
          for (const outcome of result.outcomes) console.log(`| ${outcome.id} | ${(outcome.durationMs / 1000).toFixed(2)} | ${outcome.exitCode === 0 ? outcome.skipped ?? "passed" : "failed"} |`);
          NODE
          fi

  containment:
    name: Process containment (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.docs-only != 'true' && needs.changes.outputs.version-only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            binary: a1-process-guardian
          - os: macos-15
            binary: a1-process-guardian
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out validation head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Cache process guardian build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native/process-guardian

      - name: Install exact dependencies
        run: npm ci

      - name: Build exact process guardian
        shell: bash
        run: cargo build --locked --manifest-path native/process-guardian/Cargo.toml

      - name: Verify process containment contracts
        shell: bash
        env:
          A1_PROCESS_GUARDIAN_PATH: ${{ github.workspace }}/native/process-guardian/target/debug/${{ matrix.binary }}
          A1_RUN_PROCESS_CONTAINMENT_INTEGRATION: "1"
        run: npx vitest run test/foundation/process-containment --testTimeout=30000

  parity:
    name: Rendering parity
    needs: changes
    if: needs.changes.outputs.docs-only != 'true' && needs.changes.outputs.version-only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out validation head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Compare A1's rendering with pinned Pi
        env:
          A1_CONFIG_DIR: ${{ runner.temp }}/a1-parity-config
          A1_DATA_DIR: ${{ runner.temp }}/a1-parity-data
          A1_RUNTIME_DIR: ${{ runner.temp }}/a1-parity-runtime
        run: npm run test:pi-terminal-parity

      - name: Keep what the comparison saw
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pi-terminal-parity
          path: artifacts/pi-terminal-parity/latest
          retention-days: 14
          if-no-files-found: warn

  required:
    name: Development validation required
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: [changes, docs, validate, containment]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the validation matching the change surface
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          CONTAINMENT_RESULT: ${{ needs.containment.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs-only }}
          VERSION_ONLY: ${{ needs.changes.outputs.version-only }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = "success"
          if [ "$DOCS_ONLY" = "true" ]; then
            echo "Docs-only change: OpenSpec validation only."
            test "$DOCS_RESULT" = "success"
          elif [ "$VERSION_ONLY" = "true" ]; then
            echo "Version-only change: exact package gates only."
            test "$VALIDATE_RESULT" = "success"
          else
            test "$VALIDATE_RESULT" = "success"
            test "$CONTAINMENT_RESULT" = "success"
          fi
