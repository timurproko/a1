name: Publish
run-name: ${{ github.event_name == 'schedule' && 'Nightly development publication' || format('{0} publication {1}', inputs.channel, inputs.request_id || inputs.version) }}

on:
  schedule:
    # Publish shortly after UTC midnight while retaining a non-zero minute offset for scheduler load.
    - cron: "17 0 * * *"
  workflow_call:
    inputs:
      channel:
        description: Trusted caller-selected publication channel
        required: true
        type: string
      source_sha:
        description: Exact current origin/develop commit for development publication or stable candidate validation
        required: false
        type: string
      request_id:
        description: Caller correlation identifier; never publication authority
        required: false
        type: string
      version:
        description: Stable version named by the prepared or published Release tag
        required: false
        type: string
      release_id:
        description: Published Release selector from the release event
        required: false
        type: string
    outputs:
      source:
        description: Published source commit
        value: ${{ jobs.plan.outputs.source }}
      version:
        description: Published version
        value: ${{ jobs.plan.outputs.version }}
      release_notes_sha256:
        description: Digest of the packaged and published release note
        value: ${{ jobs.plan.outputs.release_notes_sha256 }}

permissions:
  actions: read
  contents: read

# The complete workflow is serialized. Consequently the final registry check and
# publish form one global critical section: overlapping nightly/manual requests
# produce one publication, then one successful existing-version no-op.
concurrency:
  group: a1-registry-publication
  cancel-in-progress: false

jobs:
  source:
    name: Select trusted publication source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      mode: ${{ steps.source.outputs.mode }}
      requested_version: ${{ steps.source.outputs.requested_version }}
    steps:
      - name: Resolve the trusted source
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_CHANNEL: ${{ inputs.channel }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_RELEASE_ID: ${{ inputs.release_id }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          authoritative="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/develop" --jq .object.sha)"
          stable_version='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          requested_version=""
          if [ "$EVENT_NAME" = "schedule" ]; then
            mode=nightly
            source="$authoritative"
          else
            mode="$REQUESTED_CHANNEL"
            if [ "$mode" = "stable" ]; then
              # Only native publication of the prepared draft reaches here: GitHub runs the
              # publication wrapper from the tag it just created at the draft's bound source.
              requested_version="$REQUESTED_VERSION"
              if [[ ! "$requested_version" =~ $stable_version ]] || [[ ! "$REQUESTED_RELEASE_ID" =~ ^[1-9][0-9]*$ ]] || [ -n "$REQUESTED_SHA" ]; then
                echo "::error::stable publication requires the published Release's version and identity only" >&2
                exit 1
              fi
              expected_ref="refs/tags/v$requested_version"
              expected_workflow="$GITHUB_REPOSITORY/.github/workflows/release.yml@$expected_ref"
              if [ "$EVENT_NAME" != "release" ] || [ "$GITHUB_REF" != "$expected_ref" ] || [ "$GITHUB_WORKFLOW_REF" != "$expected_workflow" ]; then
                echo "::error::stable publication must originate from native publication of the prepared draft Release" >&2
                exit 1
              fi
              tag="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$requested_version" --jq '[.object.type, .object.sha] | join(" ")')"
              source="${tag#commit }"
              if [ "$tag" != "commit $source" ] || [ "$source" != "$GITHUB_SHA" ]; then
                echo "::error::v$requested_version is not a lightweight tag at the published commit" >&2
                exit 1
              fi
              relation="$(gh api "repos/$GITHUB_REPOSITORY/compare/$source...$authoritative" --jq .status)"
              if [ "$relation" != "identical" ] && [ "$relation" != "ahead" ]; then
                echo "::error::published source $source is not part of develop history" >&2
                exit 1
              fi
            elif [ "$mode" = "candidate" ]; then
              # A called workflow reports its caller's event, so the dispatch wrapper's identity is the authority.
              expected_workflow="$GITHUB_REPOSITORY/.github/workflows/release-candidate.yml@refs/heads/develop"
              if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$GITHUB_REF" != "refs/heads/develop" ] || [ "$GITHUB_WORKFLOW_REF" != "$expected_workflow" ]; then
                echo "::error::stable candidate validation must originate from its trusted default-branch wrapper" >&2
                exit 1
              fi
              source="$REQUESTED_SHA"
              requested_version="$REQUESTED_VERSION"
              if [ "$source" != "$authoritative" ] || [[ ! "$requested_version" =~ $stable_version ]] || [ -z "$REQUEST_ID" ] || [ -n "$REQUESTED_RELEASE_ID" ]; then
                echo "::error::stable candidate validation requires its exact current source, stable version, and request identity only" >&2
                exit 1
              fi
            elif [ "$mode" = "develop" ]; then
              expected_workflow="$GITHUB_REPOSITORY/.github/workflows/develop.yml@refs/heads/develop"
              if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$GITHUB_REF" != "refs/heads/develop" ] || [ "$GITHUB_WORKFLOW_REF" != "$expected_workflow" ]; then
                echo "::error::development publication must originate from its trusted default-branch wrapper" >&2
                exit 1
              fi
              source="$REQUESTED_SHA"
              if [ "$source" != "$authoritative" ] || [ -z "$REQUEST_ID" ] || [ -n "$REQUESTED_VERSION" ] || [ -n "$REQUESTED_RELEASE_ID" ]; then
                echo "::error::development publication requires its exact current source and request identity only" >&2
                exit 1
              fi
            else
              echo "::error::untrusted publication channel '$mode'" >&2
              exit 1
            fi
          fi
          if [[ ! "$source" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source is not a full commit: $source" >&2
            exit 1
          fi
          printf 'sha=%s\nmode=%s\nrequested_version=%s\n' "$source" "$mode" "$requested_version" >> "$GITHUB_OUTPUT"

  approval:
    name: Snapshot the stable Release note
    needs: source
    if: needs.source.outputs.mode == 'stable' || needs.source.outputs.mode == 'candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Draft Releases are visible only to tokens with push access.
    permissions:
      actions: read
      contents: write
    outputs:
      release_id: ${{ steps.approval.outputs.release_id }}
      release_notes_sha256: ${{ steps.approval.outputs.release_notes_sha256 }}
      validation_run_id: ${{ steps.approval.outputs.validation_run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Read and validate the Release note
        id: approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          MODE: ${{ needs.source.outputs.mode }}
          RELEASE_VERSION: ${{ needs.source.outputs.requested_version }}
          EXPECTED_RELEASE_ID: ${{ inputs.release_id }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin develop
          git merge-base --is-ancestor "$SOURCE_SHA" origin/develop
          mkdir -p .artifacts/release-note
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { execFileSync } from "node:child_process";
          import { writeFile } from "node:fs/promises";
          import { assertAuthorizedApprovalActor, requireStableValidation, validateStableApproval } from "./scripts/release/release-approval.mjs";
          const token = process.env.GH_TOKEN;
          const repository = process.env.GITHUB_REPOSITORY;
          const actorName = process.env.ACTOR;
          const version = process.env.RELEASE_VERSION;
          const source = process.env.SOURCE_SHA;
          const published = process.env.MODE === "stable";
          const headers = { accept: "application/vnd.github+json", authorization: `Bearer ${token}`, "x-github-api-version": "2022-11-28" };
          const api = async (path, allowMissing = false) => {
            const response = await fetch(`https://api.github.com/${path}`, { headers });
            if (allowMissing && response.status === 404) return null;
            if (!response.ok) throw new Error(`GitHub API ${path} returned HTTP ${response.status}`);
            return await response.json();
          };
          const npm = async (name, specifier, allowMissing = false) => {
            const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${specifier}`, { headers: { accept: "application/json", "cache-control": "no-cache" } });
            if (allowMissing && response.status === 404) return null;
            if (!response.ok) throw new Error(`npm registry ${name}@${specifier} returned HTTP ${response.status}`);
            return await response.json();
          };
          // Candidate validation reads the prepared draft by version; stable publication reads
          // exactly the Release whose publication started this run, and the tag GitHub created.
          const [actor, permission, releases, tag] = await Promise.all([
            api(`users/${actorName}`),
            api(`repos/${repository}/collaborators/${actorName}/permission`),
            published ? api(`repos/${repository}/releases/${process.env.EXPECTED_RELEASE_ID}`).then(release => [release])
              : api(`repos/${repository}/releases?per_page=100`),
            api(`repos/${repository}/git/ref/tags/v${version}`, true),
          ]);
          assertAuthorizedApprovalActor(actor, permission, actorName);
          const readAt = (commit, path) => JSON.parse(execFileSync("git", ["show", `${commit}:${path}`], { encoding: "utf8" }));
          const application = readAt(source, "package.json");
          const lock = readAt(source, "package-lock.json");
          const installer = readAt(source, "packages/a1-install/package.json");
          const [existingApplication, existingInstaller] = await Promise.all([
            npm(application.name, version, true), npm(installer.name, version, true),
          ]);
          const { release, note, sha256 } = validateStableApproval({
            version, source, releases, expectedReleaseId: published ? Number(process.env.EXPECTED_RELEASE_ID) : undefined,
            application, lock, installer, existingApplication, existingInstaller, published, tag,
          });
          let validationRunId = null;
          if (published) {
            const runs = await api(`repos/${repository}/actions/workflows/release-candidate.yml/runs?event=workflow_dispatch&head_sha=${source}&status=success&per_page=100`);
            validationRunId = requireStableValidation(runs.workflow_runs, source, version).id;
          }
          await writeFile(".artifacts/release-note/release.json", `${JSON.stringify(release, null, 2)}\n`, "utf8");
          await writeFile(".artifacts/release-note/approved-note.md", note.markdown, "utf8");
          await writeFile(".artifacts/release-note/approval.json", `${JSON.stringify({
            schema: "a1-approved-release-note-v3", mode: process.env.MODE, releaseId: release.id, version, source, sha256,
            actor: actor.login, releaseUpdatedAt: release.updated_at, validationRunId,
          }, null, 2)}\n`, "utf8");
          console.log(`release_id=${release.id}`);
          console.log(`release_notes_sha256=${sha256}`);
          console.log(`validation_run_id=${validationRunId ?? ""}`);
          NODE
      - name: Preserve the immutable approved snapshot
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: approved-release-note-${{ github.run_id }}
          path: .artifacts/release-note
          if-no-files-found: error
          retention-days: 30

  plan:
    name: Resolve numbered publication
    needs: [source, approval]
    if: always() && needs.source.result == 'success' && (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source: ${{ needs.source.outputs.sha }}
      mode: ${{ needs.source.outputs.mode }}
      channel: ${{ steps.plan.outputs.channel }}
      version: ${{ steps.plan.outputs.version }}
      pull_request: ${{ steps.plan.outputs.pull_request }}
      exists: ${{ steps.plan.outputs.exists }}
      installer_exists: ${{ steps.plan.outputs.installer_exists }}
      work: ${{ steps.plan.outputs.work }}
      build: ${{ steps.plan.outputs.build }}
      installer_build: ${{ steps.plan.outputs.installer_build }}
      registry_integrity: ${{ steps.plan.outputs.registry_integrity }}
      registry_shasum: ${{ steps.plan.outputs.registry_shasum }}
      registry_tarball: ${{ steps.plan.outputs.registry_tarball }}
      installer_registry_integrity: ${{ steps.plan.outputs.installer_registry_integrity }}
      installer_registry_shasum: ${{ steps.plan.outputs.installer_registry_shasum }}
      installer_registry_tarball: ${{ steps.plan.outputs.installer_registry_tarball }}
      release_id: ${{ needs.approval.outputs.release_id }}
      release_notes_sha256: ${{ needs.approval.outputs.release_notes_sha256 }}
      validation_run_id: ${{ needs.approval.outputs.validation_run_id }}
      validate_matrix: ${{ steps.lanes.outputs.validate_matrix }}
      sequential_validate_matrix: ${{ steps.lanes.outputs.sequential_validate_matrix }}
      windows_shard_matrix: ${{ steps.lanes.outputs.windows_shard_matrix }}
    steps:
      - name: Check out the selected source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the merged pull request through GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          gh api -H "Accept: application/vnd.github+json" "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/pulls" > "$RUNNER_TEMP/pulls.json"

      - name: Bind source, number, version, and registry state
        id: plan
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          MODE: ${{ needs.source.outputs.mode }}
          REQUESTED_VERSION: ${{ needs.source.outputs.requested_version }}
          PULLS_PATH: ${{ runner.temp }}/pulls.json
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFile } from "node:fs/promises";
          const manifest = JSON.parse(await readFile("package.json", "utf8"));
          const installerManifest = JSON.parse(await readFile("packages/a1-install/package.json", "utf8"));
          const declared = manifest.version;
          if (typeof installerManifest.name !== "string" || !installerManifest.name.endsWith("/a1-install") || installerManifest.version !== declared) {
            throw new Error("installer package identity or open development version is out of sync");
          }
          const base = /^(\d+\.\d+\.\d+)-dev$/.exec(declared)?.[1];
          if (!base) throw new Error(`develop must declare one open development version such as 0.1.8-dev, not ${declared}`);
          const core = value => value.split(".").map(Number);
          const notBelow = (left, right) => { for (let i = 0; i < 3; i++) { if (left[i] !== right[i]) return left[i] > right[i]; } return true; };

          let version;
          let pullRequest = "";
          let channel;
          const pulls = JSON.parse(await readFile(process.env.PULLS_PATH, "utf8"));
          const matches = pulls.filter(pull => pull?.merged_at && pull?.base?.ref === "develop" && pull?.merge_commit_sha === process.env.SOURCE_SHA);
          const stable = process.env.MODE === "stable" || process.env.MODE === "candidate";
          if (stable) {
            // Rationale: the stable version is stamped on the open development source at pack
            // time rather than committed, so the request names it and it must not go backwards.
            version = process.env.REQUESTED_VERSION;
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error(`stable publication requires an explicit final version, not ${version}`);
            if (!notBelow(core(version), core(base))) throw new Error(`stable version ${version} is below the open development version ${declared}`);
            // Stable note authority is the independently validated approval artifact,
            // not a pull request association or mutable source-tree document.
            channel = "latest";
          } else {
            if (matches.length !== 1 || !Number.isInteger(matches[0]?.number) || matches[0].number < 1) {
              throw new Error(`selected develop commit has ${matches.length} unique merged pull request associations; expected exactly one`);
            }
            pullRequest = String(matches[0].number);
            version = `${base}-dev.${pullRequest}`;
            channel = "next";
          }

          const lookup = async name => {
            const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${version}?verify=${Date.now()}`, {
              headers: { accept: "application/json", "cache-control": "no-cache" },
            });
            if (response.status === 404) return null;
            if (!response.ok) throw new Error(`${name} registry lookup returned HTTP ${response.status}`);
            const existing = await response.json();
            if (existing.version !== version) throw new Error(`registry returned ${existing.version} for ${name}@${version}`);
            return existing;
          };
          const [existing, installerExisting] = await Promise.all([lookup(manifest.name), lookup(installerManifest.name)]);
          if (stable && (existing || installerExisting)) throw new Error(`${version} already exists for one or both packages; stable versions are never republished`);

          const exists = existing !== null;
          const installerExists = installerExisting !== null;
          // Manual development requests stop before package work only when both immutable
          // artifacts already exist. Nightly verifies both registry packages completely.
          const work = process.env.MODE === "nightly" || !exists || !installerExists;
          console.log(`channel=${channel}`);
          console.log(`version=${version}`);
          console.log(`pull_request=${pullRequest}`);
          console.log(`exists=${exists}`);
          console.log(`installer_exists=${installerExists}`);
          console.log(`work=${work}`);
          console.log(`build=${!exists}`);
          console.log(`installer_build=${!installerExists}`);
          console.log(`registry_integrity=${existing?.dist?.integrity ?? ""}`);
          console.log(`registry_shasum=${existing?.dist?.shasum ?? ""}`);
          console.log(`registry_tarball=${existing?.dist?.tarball ?? ""}`);
          console.log(`installer_registry_integrity=${installerExisting?.dist?.integrity ?? ""}`);
          console.log(`installer_registry_shasum=${installerExisting?.dist?.shasum ?? ""}`);
          console.log(`installer_registry_tarball=${installerExisting?.dist?.tarball ?? ""}`);
          NODE

      - name: Select validation lanes
        id: lanes
        shell: bash
        env:
          MODE: ${{ needs.source.outputs.mode }}
        run: |
          echo "validate_matrix=$(node scripts/release/publication-validation-matrix.mjs --mode "$MODE" --kind complete)" >> "$GITHUB_OUTPUT"
          echo "sequential_validate_matrix=$(node scripts/release/publication-validation-matrix.mjs --mode "$MODE" --kind sequential)" >> "$GITHUB_OUTPUT"
          echo "windows_shard_matrix=$(node scripts/release/publication-validation-matrix.mjs --mode "$MODE" --kind windows-shards)" >> "$GITHUB_OUTPUT"

      - name: Report the plan
        shell: bash
        env:
          MODE: ${{ needs.source.outputs.mode }}
          VERSION: ${{ steps.plan.outputs.version }}
          EXISTS: ${{ steps.plan.outputs.exists }}
          INSTALLER_EXISTS: ${{ steps.plan.outputs.installer_exists }}
        run: |
          if [ "$EXISTS" = "true" ] && [ "$INSTALLER_EXISTS" = "true" ] && [ "$MODE" = "develop" ]; then
            echo "Development preview $VERSION already exists for both packages; this request is a successful no-op." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$EXISTS" = "true" ] && [ "$INSTALLER_EXISTS" = "true" ]; then
            echo "Nightly will completely verify both registry packages at $VERSION; publication is a no-op." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$MODE will obtain and verify both exact $VERSION artifacts before publishing either missing package." >> "$GITHUB_STEP_SUMMARY"
          fi

  documentation:
    name: Full documentation review
    needs: plan
    # Invariant: plan still runs after approval is skipped, but GitHub's implicit success() skips
    # every job that inherits that skip, so each job below plan restates always().
    if: always() && needs.plan.result == 'success' && (needs.plan.outputs.mode == 'nightly' || needs.plan.outputs.mode == 'candidate')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Review every tracked documentation-policy source once
        run: node scripts/governance/check-code-documentation.mjs --mode full --result .artifacts/validation/code-documentation-full.json
      - name: Report full documentation evidence
        if: always()
        shell: bash
        run: |
          if [ -f .artifacts/validation/code-documentation-full.json ]; then
            node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFile } from "node:fs/promises";
          const value = JSON.parse(await readFile(".artifacts/validation/code-documentation-full.json", "utf8"));
          console.log(`Files inspected: **${value.filesInspected}**; full scans: **${value.fullRepositoryScans}**; duration: **${value.durationMs}ms**.`);
          NODE
          fi

  guardians:
    name: Build process guardian (${{ matrix.os }})
    needs: plan
    # Rationale: stable publication adopts the candidate-validated package, so nothing is rebuilt.
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.build == 'true' && needs.plan.outputs.mode != 'stable'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Preserve repository bytes during checkout
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: Prepare Rust toolchain
        shell: bash
        run: bash scripts/development/prepare-ci-rust.sh
      - name: Cache process guardian build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native/process-guardian
      - run: npm ci --ignore-scripts
      - run: npm run build:process-guardian
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-process-guardian-${{ runner.os }}-${{ runner.arch }}
          path: dist/native
          if-no-files-found: error
          retention-days: 1

  package:
    name: Obtain exact package ${{ needs.plan.outputs.version }}
    needs: [plan, guardians, documentation]
    # Invariant: a skip is accepted only where the job is not required, so a build never packs without every guardian.
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.work == 'true' && (needs.guardians.result == 'success' || (needs.guardians.result == 'skipped' && (needs.plan.outputs.build != 'true' || needs.plan.outputs.mode == 'stable'))) && (needs.documentation.result == 'success' || (needs.documentation.result == 'skipped' && needs.plan.outputs.mode != 'nightly' && needs.plan.outputs.mode != 'candidate'))
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      integrity: ${{ steps.identity.outputs.integrity }}
      shasum: ${{ steps.identity.outputs.shasum }}
      installer_integrity: ${{ steps.identity.outputs.installer_integrity }}
      installer_shasum: ${{ steps.identity.outputs.installer_shasum }}
    steps:
      - name: Preserve repository bytes during checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.plan.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Download the approved release-note snapshot
        if: needs.plan.outputs.channel == 'latest'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: approved-release-note-${{ github.run_id }}
          path: .artifacts/release-note
      - name: Assemble the approved note with committed history
        if: needs.plan.outputs.channel == 'latest'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_NOTES_SHA256: ${{ needs.plan.outputs.release_notes_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p docs/releases
          cp .artifacts/release-note/approved-note.md "docs/releases/${RELEASE_VERSION}.md"
          actual="$(node --input-type=module -e 'import { createHash } from "node:crypto"; import { readFileSync } from "node:fs"; process.stdout.write(createHash("sha256").update(readFileSync(process.argv[1])).digest("hex"))' "docs/releases/${RELEASE_VERSION}.md")"
          test "$actual" = "$RELEASE_NOTES_SHA256"

      - name: Install adoption tooling without building the application
        if: needs.plan.outputs.mode == 'stable'
        run: npm ci --ignore-scripts

      - name: Download the candidate-validated package pair
        id: candidate
        if: needs.plan.outputs.mode == 'stable'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-package-${{ needs.plan.outputs.version }}
          path: .artifacts/candidate
          run-id: ${{ needs.plan.outputs.validation_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Explain an unavailable candidate package
        if: failure() && steps.candidate.outcome == 'failure'
        shell: bash
        env:
          VALIDATION_RUN_ID: ${{ needs.plan.outputs.validation_run_id }}
        run: |
          echo "::error::candidate validation run $VALIDATION_RUN_ID no longer provides its validated package (missing or expired); rerun candidate validation of this source and version, then publish the draft again" >&2
          exit 1

      - name: Adopt the candidate-validated package pair
        if: needs.plan.outputs.mode == 'stable'
        env:
          CANDIDATE_DIRECTORY: .artifacts/candidate
          OUTPUT_DIRECTORY: .artifacts/validation/package
          APPROVED_NOTE_PATH: .artifacts/release-note/approved-note.md
          SOURCE_SHA: ${{ needs.plan.outputs.source }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/release/adopt-validated-candidate.mjs

      - name: Prepare Rust toolchain
        if: needs.plan.outputs.build == 'true' && needs.plan.outputs.mode != 'stable'
        shell: bash
        run: bash scripts/development/prepare-ci-rust.sh

      - name: Install dependencies and build source once
        if: needs.plan.outputs.build == 'true' && needs.plan.outputs.mode != 'stable'
        run: npm ci

      - name: Install package tooling without building the application
        if: needs.plan.outputs.build != 'true' && needs.plan.outputs.installer_build == 'true' && needs.plan.outputs.mode != 'stable'
        run: npm ci --ignore-scripts

      - name: Assemble all platform process guardians
        if: needs.plan.outputs.build == 'true' && needs.plan.outputs.mode != 'stable'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-process-guardian-*
          path: dist/native
          merge-multiple: true

      - name: Stamp the published version on the open development source
        if: needs.plan.outputs.build == 'true' && needs.plan.outputs.mode != 'stable'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version

      - name: Record verified candidate build
        if: needs.plan.outputs.build == 'true' && needs.plan.outputs.mode != 'stable'
        run: node scripts/release/record-validation-prerequisite.mjs build

      - name: Pack the candidate exactly once
        if: needs.plan.outputs.build == 'true' && needs.plan.outputs.mode != 'stable'
        env:
          VALIDATION_BUILD_RECEIPT: ${{ github.workspace }}/.artifacts/validation/receipts/build.json
        run: node scripts/release/prepare-validation-package.mjs

      - name: Download the immutable registry package
        if: needs.plan.outputs.build != 'true'
        shell: bash
        env:
          REGISTRY_TARBALL: ${{ needs.plan.outputs.registry_tarball }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts/validation/package
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          const response = await fetch(process.env.REGISTRY_TARBALL, { headers: { "cache-control": "no-cache" } });
          if (!response.ok) throw new Error(`registry tarball returned HTTP ${response.status}`);
          await writeFile(".artifacts/validation/package/candidate.tgz", Buffer.from(await response.arrayBuffer()));
          NODE

      - name: Pack the installer candidate exactly once
        if: needs.plan.outputs.installer_build == 'true' && needs.plan.outputs.mode != 'stable'
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/release/prepare-installer-package.mjs

      - name: Download the immutable registry installer package
        if: needs.plan.outputs.installer_build != 'true'
        shell: bash
        env:
          REGISTRY_TARBALL: ${{ needs.plan.outputs.installer_registry_tarball }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts/validation/package
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          const response = await fetch(process.env.REGISTRY_TARBALL, { headers: { "cache-control": "no-cache" } });
          if (!response.ok) throw new Error(`installer registry tarball returned HTTP ${response.status}`);
          await writeFile(".artifacts/validation/package/installer.tgz", Buffer.from(await response.arrayBuffer()));
          NODE

      - name: Bind packed source and identity
        id: identity
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_NOTES_SHA256: ${{ needs.plan.outputs.release_notes_sha256 }}
          SOURCE_SHA: ${{ needs.plan.outputs.source }}
          PULL_REQUEST: ${{ needs.plan.outputs.pull_request }}
          EXPECTED_REGISTRY_INTEGRITY: ${{ needs.plan.outputs.registry_integrity }}
          EXPECTED_REGISTRY_SHASUM: ${{ needs.plan.outputs.registry_shasum }}
          EXPECTED_INSTALLER_REGISTRY_INTEGRITY: ${{ needs.plan.outputs.installer_registry_integrity }}
          EXPECTED_INSTALLER_REGISTRY_SHASUM: ${{ needs.plan.outputs.installer_registry_shasum }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { createHash } from "node:crypto";
          import { readFile, writeFile } from "node:fs/promises";
          import { execFileSync } from "node:child_process";
          import { readPackedManifest } from "./scripts/governance/candidate-evidence.mjs";
          const path = ".artifacts/validation/package/candidate.tgz";
          const bytes = await readFile(path);
          const manifest = readPackedManifest(bytes);
          const identity = JSON.parse(await readFile("src/product-identity.json", "utf8"));
          if (manifest.name !== identity.packageName) throw new Error(`packed name ${manifest.name} differs from product identity`);
          if (JSON.stringify(manifest.bin) !== JSON.stringify({ [identity.commandName]: identity.artifacts.cliEntry })) throw new Error("packed command differs from product identity");
          const integrity = `sha512-${createHash("sha512").update(bytes).digest("base64")}`;
          const shasum = createHash("sha1").update(bytes).digest("hex");
          if (manifest.version !== process.env.RELEASE_VERSION) throw new Error(`packed version ${manifest.version} is not ${process.env.RELEASE_VERSION}`);
          if (process.env.EXPECTED_REGISTRY_INTEGRITY && integrity !== process.env.EXPECTED_REGISTRY_INTEGRITY) throw new Error("registry tarball integrity differs from registry metadata");
          if (process.env.EXPECTED_REGISTRY_SHASUM && shasum !== process.env.EXPECTED_REGISTRY_SHASUM) throw new Error("registry tarball shasum differs from registry metadata");
          const tree = execFileSync("git", ["rev-parse", `${process.env.SOURCE_SHA}^{tree}`], { encoding: "utf8" }).trim();
          await writeFile(".artifacts/validation/package/candidate-identity.json", `${JSON.stringify({
            schema: "a1-packed-candidate-v1",
            source: {
              commit: process.env.SOURCE_SHA,
              tree,
              pullRequest: process.env.PULL_REQUEST ? Number(process.env.PULL_REQUEST) : null,
              releaseNoteSha256: process.env.RELEASE_NOTES_SHA256 || null,
            },
            package: { name: manifest.name, version: manifest.version, integrity, shasum },
          }, null, 2)}\n`);
          const installerPath = ".artifacts/validation/package/installer.tgz";
          const installerBytes = await readFile(installerPath);
          const installerManifest = readPackedManifest(installerBytes);
          const installerSource = JSON.parse(await readFile("packages/a1-install/package.json", "utf8"));
          if (installerManifest.name !== installerSource.name) throw new Error("packed installer name is invalid");
          if (JSON.stringify(installerManifest.bin) !== JSON.stringify(installerSource.bin)) throw new Error("packed installer command is invalid");
          for (const field of ["dependencies", "optionalDependencies", "peerDependencies", "bundledDependencies", "bundleDependencies", "funding", "scripts"]) {
            if (Object.hasOwn(installerManifest, field)) throw new Error(`packed installer must not declare ${field}`);
          }
          if (installerManifest.version !== process.env.RELEASE_VERSION) throw new Error(`packed installer version ${installerManifest.version} is not ${process.env.RELEASE_VERSION}`);
          const installerIntegrity = `sha512-${createHash("sha512").update(installerBytes).digest("base64")}`;
          const installerShasum = createHash("sha1").update(installerBytes).digest("hex");
          if (process.env.EXPECTED_INSTALLER_REGISTRY_INTEGRITY && installerIntegrity !== process.env.EXPECTED_INSTALLER_REGISTRY_INTEGRITY) throw new Error("installer registry tarball integrity differs from registry metadata");
          if (process.env.EXPECTED_INSTALLER_REGISTRY_SHASUM && installerShasum !== process.env.EXPECTED_INSTALLER_REGISTRY_SHASUM) throw new Error("installer registry tarball shasum differs from registry metadata");
          await writeFile(".artifacts/validation/package/installer-identity.json", `${JSON.stringify({
            schema: "a1-packed-installer-v1",
            source: { commit: process.env.SOURCE_SHA, tree, pullRequest: process.env.PULL_REQUEST ? Number(process.env.PULL_REQUEST) : null },
            package: { name: installerManifest.name, version: installerManifest.version, integrity: installerIntegrity, shasum: installerShasum },
          }, null, 2)}\n`);
          console.log(`integrity=${integrity}\nshasum=${shasum}`);
          console.log(`installer_integrity=${installerIntegrity}\ninstaller_shasum=${installerShasum}`);
          NODE

      - name: Record downloaded registry candidate prerequisite
        if: needs.plan.outputs.build != 'true'
        run: >-
          node scripts/release/record-validation-prerequisite.mjs package
          --candidate .artifacts/validation/package/candidate.tgz
          --source-identity .artifacts/validation/package/candidate-identity.json

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-package-${{ needs.plan.outputs.version }}
          path: |
            .artifacts/validation/package/candidate.tgz
            .artifacts/validation/package/candidate.receipt.json
            .artifacts/validation/package/candidate-identity.json
            .artifacts/validation/package/installer.tgz
            .artifacts/validation/package/installer-identity.json
          if-no-files-found: error
          retention-days: 30

  validate_sequential:
    name: Validate sequential ${{ matrix.platform }}
    needs: [plan, package, documentation]
    # Rationale: the successful candidate run already validated the adopted stable bytes on every lane.
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.mode != 'stable' && needs.package.result == 'success' && (needs.documentation.result == 'success' || needs.documentation.result == 'skipped')
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.sequential_validate_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Preserve repository bytes during checkout
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.plan.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Prepare Rust toolchain
        shell: bash
        run: bash scripts/development/prepare-ci-rust.sh
      - run: npm ci
      - name: Record verified install-time build
        run: node scripts/release/record-validation-prerequisite.mjs build
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-package-${{ needs.plan.outputs.version }}
          path: .artifacts/release
      - name: Validate the exact installer package
        env:
          VALIDATION_INSTALLER_TARBALL: ${{ github.workspace }}/.artifacts/release/installer.tgz
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/release/validate-installer-package.mjs
      - name: Bind downloaded package to this validation job
        run: >-
          node scripts/release/record-validation-prerequisite.mjs package
          --candidate .artifacts/release/candidate.tgz
          --output .artifacts/release/candidate.receipt.json
          --build-receipt .artifacts/validation/receipts/build.json
          --source-identity .artifacts/release/candidate-identity.json

      - name: Select validation scope
        id: selection
        shell: bash
        env:
          MODE: ${{ needs.plan.outputs.mode }}
        run: |
          if [ "$MODE" = "develop" ]; then
            selected='["package-smoke","package-install"]'
          else
            selected='["full-release"]'
          fi
          echo "selected=$selected" >> "$GITHUB_OUTPUT"
      - name: Prepare the exact package
        shell: bash
        env:
          VALIDATION_SELECTION_JSON: ${{ steps.selection.outputs.selected }}
          VALIDATION_BUILD_READY: "1"
          VALIDATION_BUILD_RECEIPT: ${{ github.workspace }}/.artifacts/validation/receipts/build.json
          VALIDATION_CANDIDATE_TARBALL: ${{ github.workspace }}/.artifacts/release/candidate.tgz
          VALIDATION_PACKAGE_RECEIPT: ${{ github.workspace }}/.artifacts/release/candidate.receipt.json
          VALIDATION_PACKAGE_SOURCE_IDENTITY: ${{ github.workspace }}/.artifacts/release/candidate-identity.json
        run: >-
          node scripts/release/run-validation-tier.mjs
          --prepare-exact-package
          --handoff .artifacts/validation/exact-package-handoff.json
      - name: Enable Defender real-time protection for startup acceptance
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-MpPreference -DisableRealtimeMonitoring $false
          $deadline = (Get-Date).AddSeconds(30)
          do {
            $enabled = (Get-MpComputerStatus).RealTimeProtectionEnabled
            if ($enabled) { break }
            Start-Sleep -Seconds 1
          } while ((Get-Date) -lt $deadline)
          if (-not $enabled) { throw "Windows Defender real-time protection could not be enabled" }
      - name: Validate the exact package
        shell: bash
        env:
          VALIDATION_SELECTION_JSON: ${{ steps.selection.outputs.selected }}
          VALIDATION_BUILD_READY: "1"
          VALIDATION_BUILD_RECEIPT: ${{ github.workspace }}/.artifacts/validation/receipts/build.json
          VALIDATION_DOCUMENTATION_FULL_READY: ${{ needs.documentation.result == 'success' && '1' || '0' }}
          VALIDATION_CANDIDATE_TARBALL: ${{ github.workspace }}/.artifacts/release/candidate.tgz
          VALIDATION_PACKAGE_RECEIPT: ${{ github.workspace }}/.artifacts/release/candidate.receipt.json
          VALIDATION_PACKAGE_SOURCE_IDENTITY: ${{ github.workspace }}/.artifacts/release/candidate-identity.json
          RELEASE_RUNNER_LABEL: github-${{ matrix.platform }}-${{ needs.plan.outputs.mode }}
          A1_CONFIG_DIR: ${{ runner.temp }}/a1-release-config
          A1_DATA_DIR: ${{ runner.temp }}/a1-release-data
          A1_RUNTIME_DIR: ${{ runner.temp }}/a1-release-runtime
          # Rationale: stable candidate validation enforces the first attempt; every
          # scheduled or preview channel records, and the nightly triage judges a persistent overrun.
          STARTUP_BUDGET_ENFORCEMENT: ${{ needs.plan.outputs.channel == 'latest' && 'fail' || 'record' }}
          STARTUP_PERFORMANCE_RESULT: .artifacts/validation/startup-${{ matrix.platform }}.json
        run: >-
          node scripts/release/run-validation-tier.mjs
          --exact-package-handoff .artifacts/validation/exact-package-handoff.json
          --result .artifacts/validation/${{ matrix.platform }}.json
      - name: Summarize first-attempt startup measurements
        if: always() && runner.os == 'Windows'
        shell: bash
        env:
          STARTUP_PERFORMANCE_RESULT: .artifacts/validation/startup-${{ matrix.platform }}.json
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [ ! -f "$STARTUP_PERFORMANCE_RESULT" ]; then
            echo "No first-attempt startup evidence was produced for $PLATFORM." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFile } from "node:fs/promises";
          const evidence = JSON.parse(await readFile(process.env.STARTUP_PERFORMANCE_RESULT, "utf8"));
          const violated = new Set(evidence.budgetViolations.map(violation => `${violation.profileId}/${violation.launchKind}`));
          const overrun = evidence.enforcement === "record" ? "recorded overrun" : "failed";
          console.log(`## First-attempt startup (${process.env.PLATFORM}, ${evidence.enforcement} mode)`);
          console.log("");
          console.log("| Profile | Launch kind | Elapsed | Budget | Status |");
          console.log("| --- | --- | ---: | ---: | --- |");
          for (const measurement of evidence.measurements) {
            const status = violated.has(`${measurement.profileId}/${measurement.launchKind}`) ? overrun : "passed";
            console.log(`| ${measurement.profileId} | ${measurement.launchKind} | ${Math.round(measurement.elapsedMs)}ms | ${measurement.budgetMs}ms | ${status} |`);
          }
          NODE
      - name: Upload platform outcomes
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-validation-${{ needs.plan.outputs.version }}-${{ matrix.platform }}
          path: |
            .artifacts/validation/${{ matrix.platform }}.json
            .artifacts/validation/startup-${{ matrix.platform }}.json
          if-no-files-found: warn
          retention-days: 30

  # Concurrency: complete Windows publication lanes use the same canonical four-way ownership
  # partition as standalone full regression. No mutable workspace or package prefix crosses jobs.
  validate_windows_shard:
    name: Validate ${{ matrix.platform }} / ${{ matrix.shard }}
    needs: [plan, package, documentation]
    if: always() && needs.plan.result == 'success' && (needs.plan.outputs.mode == 'nightly' || needs.plan.outputs.mode == 'candidate') && needs.package.result == 'success' && needs.documentation.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.windows_shard_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      FULL_SOURCE: ${{ needs.plan.outputs.source }}
      FULL_BASE: ${{ needs.plan.outputs.source }}
      FULL_PR: "0"
    steps:
      - name: Preserve repository bytes during checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.plan.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Prepare Rust toolchain
        shell: bash
        run: bash scripts/development/prepare-ci-rust.sh
      - run: npm ci
      - name: Record verified install-time build
        run: node scripts/release/record-validation-prerequisite.mjs build
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-package-${{ needs.plan.outputs.version }}
          path: .artifacts/release
      - name: Validate the exact installer package
        env:
          VALIDATION_INSTALLER_TARBALL: ${{ github.workspace }}/.artifacts/release/installer.tgz
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/release/validate-installer-package.mjs
      - name: Bind downloaded package to this validation shard
        run: >-
          node scripts/release/record-validation-prerequisite.mjs package
          --candidate .artifacts/release/candidate.tgz
          --output .artifacts/release/candidate.receipt.json
          --build-receipt .artifacts/validation/receipts/build.json
          --source-identity .artifacts/release/candidate-identity.json
      - name: Prepare the exact package
        if: matrix.shard == 'package'
        shell: bash
        env:
          VALIDATION_SELECTION_JSON: '["full-release"]'
          VALIDATION_BUILD_READY: "1"
          VALIDATION_BUILD_RECEIPT: ${{ github.workspace }}/.artifacts/validation/receipts/build.json
          VALIDATION_CANDIDATE_TARBALL: ${{ github.workspace }}/.artifacts/release/candidate.tgz
          VALIDATION_PACKAGE_RECEIPT: ${{ github.workspace }}/.artifacts/release/candidate.receipt.json
          VALIDATION_PACKAGE_SOURCE_IDENTITY: ${{ github.workspace }}/.artifacts/release/candidate-identity.json
        run: >-
          node scripts/release/run-validation-tier.mjs
          --prepare-exact-package
          --handoff .artifacts/validation/exact-package-handoff.json
      - name: Enable Defender real-time protection for startup acceptance
        if: matrix.shard == 'package'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-MpPreference -DisableRealtimeMonitoring $false
          $deadline = (Get-Date).AddSeconds(30)
          do {
            $enabled = (Get-MpComputerStatus).RealTimeProtectionEnabled
            if ($enabled) { break }
            Start-Sleep -Seconds 1
          } while ((Get-Date) -lt $deadline)
          if (-not $enabled) { throw "Windows Defender real-time protection could not be enabled" }
      - name: Run complete publication validation shard
        shell: bash
        env:
          VALIDATION_SELECTION_JSON: '["full-release"]'
          VALIDATION_BUILD_READY: "1"
          VALIDATION_BUILD_RECEIPT: ${{ github.workspace }}/.artifacts/validation/receipts/build.json
          VALIDATION_DOCUMENTATION_FULL_READY: "1"
          VALIDATION_CANDIDATE_TARBALL: ${{ github.workspace }}/.artifacts/release/candidate.tgz
          VALIDATION_PACKAGE_RECEIPT: ${{ github.workspace }}/.artifacts/release/candidate.receipt.json
          VALIDATION_PACKAGE_SOURCE_IDENTITY: ${{ github.workspace }}/.artifacts/release/candidate-identity.json
          RELEASE_RUNNER_LABEL: github-${{ matrix.platform }}-${{ needs.plan.outputs.mode }}-${{ matrix.shard }}
          A1_CONFIG_DIR: ${{ runner.temp }}/a1-release-config
          A1_DATA_DIR: ${{ runner.temp }}/a1-release-data
          A1_RUNTIME_DIR: ${{ runner.temp }}/a1-release-runtime
          STARTUP_BUDGET_ENFORCEMENT: ${{ needs.plan.outputs.channel == 'latest' && 'fail' || 'record' }}
          STARTUP_PERFORMANCE_RESULT: .artifacts/validation/startup-${{ matrix.platform }}.json
          FULL_SHARD: ${{ matrix.shard }}
        run: |
          args=(--full-shard "$FULL_SHARD" --result .artifacts/validation/full-regression.json)
          if [ "$FULL_SHARD" = package ]; then args+=(--exact-package-handoff .artifacts/validation/exact-package-handoff.json); fi
          node scripts/release/run-validation-tier.mjs "${args[@]}"
      - name: Summarize first-attempt startup measurements
        if: always() && matrix.shard == 'package'
        shell: bash
        env:
          STARTUP_PERFORMANCE_RESULT: .artifacts/validation/startup-${{ matrix.platform }}.json
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [ ! -f "$STARTUP_PERFORMANCE_RESULT" ]; then
            echo "No first-attempt startup evidence was produced for $PLATFORM." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFile } from "node:fs/promises";
          const evidence = JSON.parse(await readFile(process.env.STARTUP_PERFORMANCE_RESULT, "utf8"));
          const violated = new Set(evidence.budgetViolations.map(violation => `${violation.profileId}/${violation.launchKind}`));
          const overrun = evidence.enforcement === "record" ? "recorded overrun" : "failed";
          console.log(`## First-attempt startup (${process.env.PLATFORM}, ${evidence.enforcement} mode)`);
          console.log("");
          console.log("| Profile | Launch kind | Elapsed | Budget | Status |");
          console.log("| --- | --- | ---: | ---: | --- |");
          for (const measurement of evidence.measurements) {
            const status = violated.has(`${measurement.profileId}/${measurement.launchKind}`) ? overrun : "passed";
            console.log(`| ${measurement.profileId} | ${measurement.launchKind} | ${Math.round(measurement.elapsedMs)}ms | ${measurement.budgetMs}ms | ${status} |`);
          }
          NODE
      - name: Bind publication shard evidence
        if: always() && hashFiles('.artifacts/validation/full-regression.json') != ''
        env:
          FULL_LANE: ${{ matrix.os }}-node${{ matrix.node }}
          FULL_SHARD: ${{ matrix.shard }}
        run: node scripts/release/full-regression-evidence.mjs --record-shard
      - name: Upload publication shard outcomes
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-validation-${{ needs.plan.outputs.version }}-${{ matrix.platform }}-shard-${{ matrix.shard }}
          path: |
            .artifacts/validation/full-regression.json
            .artifacts/validation/full-shards/*.json
            .artifacts/validation/startup-${{ matrix.platform }}.json
            .artifacts/validation/receipts/*.json
            .artifacts/validation/phases/*.jsonl
            .artifacts/release-verdicts/*.json
          if-no-files-found: warn
          retention-days: 30

  # Invariant: one familiar platform artifact exists only after all four exact-run shards merge.
  validate_windows_lane:
    name: Reconstruct ${{ matrix.platform }}
    needs: [plan, validate_windows_shard]
    if: always() && needs.plan.result == 'success' && (needs.plan.outputs.mode == 'nightly' || needs.plan.outputs.mode == 'candidate')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win32-node24
            os: windows-2025
            node: 24
          - platform: win32-node22
            os: windows-2025
            node: 22
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FULL_SOURCE: ${{ needs.plan.outputs.source }}
      FULL_BASE: ${{ needs.plan.outputs.source }}
      FULL_PR: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-validation-${{ needs.plan.outputs.version }}-${{ matrix.platform }}-shard-*
          path: .artifacts/release-validation-downloads
      - name: Collect unique shard evidence
        shell: bash
        run: |
          mkdir -p .artifacts/validation/full-shards
          while IFS= read -r -d '' path; do
            target=".artifacts/validation/full-shards/$(basename "$path")"
            test ! -e "$target"
            cp "$path" "$target"
          done < <(find .artifacts/release-validation-downloads -type f -path '*/full-shards/*.json' -print0)
          while IFS= read -r -d '' path; do
            target=".artifacts/validation/$(basename "$path")"
            test ! -e "$target"
            cp "$path" "$target"
          done < <(find .artifacts/release-validation-downloads -type f -name 'startup-*.json' -print0)
      - name: Reconstruct the Windows publication lane
        env:
          FULL_LANE: ${{ matrix.os }}-node${{ matrix.node }}
        run: |
          node scripts/release/full-regression-evidence.mjs --merge-shards
          cp .artifacts/validation/full-regression.json .artifacts/validation/${{ matrix.platform }}.json
      - name: Upload reconstructed platform outcomes
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-validation-${{ needs.plan.outputs.version }}-${{ matrix.platform }}
          path: |
            .artifacts/validation/${{ matrix.platform }}.json
            .artifacts/validation/startup-${{ matrix.platform }}.json
          if-no-files-found: warn
          retention-days: 30

  validate:
    name: Validate publication lanes
    needs: [plan, package, documentation, validate_sequential, validate_windows_shard, validate_windows_lane]
    # Rationale: stable adopts already validated candidate bytes; every other mode is authorized only
    # by this aggregate, never by an individual sequential lane or Windows shard.
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.mode != 'stable' && needs.package.result == 'success' && (needs.documentation.result == 'success' || needs.documentation.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every planned validation lane
        shell: bash
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          SEQUENTIAL: ${{ needs.validate_sequential.result }}
          WINDOWS_SHARDS: ${{ needs.validate_windows_shard.result }}
          WINDOWS_LANES: ${{ needs.validate_windows_lane.result }}
        run: |
          set -euo pipefail
          test "$SEQUENTIAL" = success
          if [ "$MODE" = develop ]; then
            test "$WINDOWS_SHARDS" = skipped
            test "$WINDOWS_LANES" = skipped
          else
            test "$WINDOWS_SHARDS" = success
            test "$WINDOWS_LANES" = success
          fi

  publish:
    name: Publish ${{ needs.plan.outputs.version }} to npm ${{ needs.plan.outputs.channel }}
    needs: [plan, package, documentation, validate]
    if: always() && needs.plan.outputs.mode != 'candidate' && (needs.plan.outputs.build == 'true' || needs.plan.outputs.installer_build == 'true') && needs.package.result == 'success' && (needs.documentation.result == 'success' || needs.documentation.result == 'skipped') && (needs.validate.result == 'success' || (needs.plan.outputs.mode == 'stable' && needs.validate.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-package-${{ needs.plan.outputs.version }}
          path: .artifacts/release

      - name: Require the published Release to remain unchanged
        if: needs.plan.outputs.mode == 'stable'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.plan.outputs.release_id }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_NOTES_SHA256: ${{ needs.plan.outputs.release_notes_sha256 }}
          SOURCE_SHA: ${{ needs.plan.outputs.source }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RUNNER_TEMP/pre-publish-release.json"
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFile } from "node:fs/promises";
          const release = JSON.parse(await readFile(process.env.RUNNER_TEMP + "/pre-publish-release.json", "utf8"));
          const normalized = typeof release.body === "string" ? `${release.body.replaceAll("\r\n", "\n").trimEnd()}\n` : "";
          const digest = createHash("sha256").update(normalized, "utf8").digest("hex");
          // Rationale: the package carries the snapshotted note, so a Release returned to draft or
          // edited after publication stops here, before npm, and rollback reopens the draft.
          if (release.id !== Number(process.env.RELEASE_ID) || release.tag_name !== `v${process.env.RELEASE_VERSION}`
            || release.name !== `v${process.env.RELEASE_VERSION}` || release.target_commitish !== process.env.SOURCE_SHA
            || release.draft !== false || release.prerelease !== false || digest !== process.env.RELEASE_NOTES_SHA256) {
            throw new Error("published GitHub Release was unpublished or changed before npm publication; publish the draft again");
          }
          NODE

      - name: Serialize the final registry check
        id: final
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          EXPECTED_INTEGRITY: ${{ needs.package.outputs.integrity }}
          EXPECTED_SHASUM: ${{ needs.package.outputs.shasum }}
          EXPECTED_INSTALLER_INTEGRITY: ${{ needs.package.outputs.installer_integrity }}
          EXPECTED_INSTALLER_SHASUM: ${{ needs.package.outputs.installer_shasum }}
        run: |
          set -euo pipefail
          tarball="$(find .artifacts/release -type f -name candidate.tgz)"
          installer_tarball="$(find .artifacts/release -type f -name installer.tgz)"
          echo "release_tarball=$tarball" >> "$GITHUB_ENV"
          echo "installer_tarball=$installer_tarball" >> "$GITHUB_ENV"
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFile } from "node:fs/promises";
          const application = JSON.parse(await readFile("package.json", "utf8"));
          const installer = JSON.parse(await readFile("packages/a1-install/package.json", "utf8"));
          const check = async (name, integrity, shasum, output) => {
            const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${process.env.RELEASE_VERSION}?final=${Date.now()}`, { headers: { "cache-control": "no-cache" } });
            if (response.status === 404) return console.log(`${output}=true`);
            if (!response.ok) throw new Error(`${name} final registry check returned HTTP ${response.status}`);
            const manifest = await response.json();
            if (manifest.dist?.integrity !== integrity || manifest.dist?.shasum !== shasum) throw new Error(`existing ${name} registry bytes differ from the validated candidate`);
            console.log(`${output}=false`);
          };
          await check(application.name, process.env.EXPECTED_INTEGRITY, process.env.EXPECTED_SHASUM, "publish");
          await check(installer.name, process.env.EXPECTED_INSTALLER_INTEGRITY, process.env.EXPECTED_INSTALLER_SHASUM, "publish_installer");
          NODE

      # Rationale: npm otherwise refuses an untrusted caller only at an upload, possibly after the
      # other package was published; this proves both before either upload step starts.
      - name: Prove npm trusted publishing for both packages
        if: steps.final.outputs.publish == 'true' || steps.final.outputs.publish_installer == 'true'
        run: node scripts/release/npm-trust-preflight.mjs

      - name: Publish the exact validated installer package
        if: steps.final.outputs.publish_installer == 'true'
        run: npm publish "$installer_tarball" --tag "${{ needs.plan.outputs.channel }}" --access public --ignore-scripts --provenance --registry https://registry.npmjs.org/

      - name: Publish the exact validated application package
        if: steps.final.outputs.publish == 'true'
        run: npm publish "$release_tarball" --tag "${{ needs.plan.outputs.channel }}" --access public --ignore-scripts --provenance --registry https://registry.npmjs.org/

      - name: Verify the registry serves the validated bytes
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ needs.plan.outputs.channel }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          EXPECTED_INTEGRITY: ${{ needs.package.outputs.integrity }}
          EXPECTED_SHASUM: ${{ needs.package.outputs.shasum }}
          EXPECTED_INSTALLER_INTEGRITY: ${{ needs.package.outputs.installer_integrity }}
          EXPECTED_INSTALLER_SHASUM: ${{ needs.package.outputs.installer_shasum }}
        run: node scripts/release/npm-registry-verification.mjs

  post_publish:
    name: Published pair ${{ matrix.platform }} / Node ${{ matrix.node }}
    needs: [plan, package, publish]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.work == 'true' && (needs.plan.outputs.build == 'true' || needs.plan.outputs.installer_build == 'true') && needs.package.result == 'success' && needs.publish.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.validate_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out the validated source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.plan.outputs.source }}
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install smoke harness dependencies
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exercise the exact published pair
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ needs.plan.outputs.channel }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          EXPECTED_APPLICATION_INTEGRITY: ${{ needs.package.outputs.integrity }}
          EXPECTED_INSTALLER_INTEGRITY: ${{ needs.package.outputs.installer_integrity }}
          PUBLISHED_INSTALLER_EVIDENCE: .artifacts/validation/published-installer-${{ matrix.platform }}-node-${{ matrix.node }}.json
        run: node scripts/release/smoke-published-installer.mjs
      - name: Upload published-pair evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-validation-${{ needs.plan.outputs.version }}-published-${{ matrix.platform }}-node-${{ matrix.node }}
          path: .artifacts/validation/published-installer-*.json
          if-no-files-found: error
          retention-days: 30

  complete:
    name: Complete stable release records
    needs: [plan, package, publish, post_publish]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.work == 'true' && (needs.plan.outputs.build == 'true' || needs.plan.outputs.installer_build == 'true') && needs.package.result == 'success' && needs.publish.result == 'success' && needs.post_publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the immutable application artifact
        if: needs.plan.outputs.mode == 'stable'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-package-${{ needs.plan.outputs.version }}
          path: package
      - name: Locate the immutable application artifact
        if: needs.plan.outputs.mode == 'stable'
        shell: bash
        run: echo "release_tarball=$(find package -type f -name '*.tgz' -print -quit)" >> "$GITHUB_ENV"
      - name: Upload the exact asset to the published Release
        if: needs.plan.outputs.mode == 'stable'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: gh release upload "v${RELEASE_VERSION}" "$release_tarball" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Move master to the published release
        if: needs.plan.outputs.mode == 'stable'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.plan.outputs.source }}
        run: |
          if ! response="$(gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/master" -f "sha=$SOURCE_SHA" -F force=false 2>&1)"; then
            echo "::error::could not fast-forward master to ${SOURCE_SHA}: ${response}" >&2; exit 1
          fi

  result:
    name: Publication result
    if: always()
    needs: [plan, guardians, package, validate, publish, post_publish, complete]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download validation evidence for the failure summary
        if: always() && needs.plan.outputs.work == 'true' && (needs.package.result != 'success' || (needs.validate.result != 'success' && !(needs.plan.outputs.mode == 'stable' && needs.validate.result == 'skipped')) || (needs.plan.outputs.mode != 'candidate' && (needs.plan.outputs.build == 'true' || needs.plan.outputs.installer_build == 'true') && (needs.publish.result != 'success' || needs.post_publish.result != 'success' || needs.complete.result != 'success')))
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-validation-${{ needs.plan.outputs.version }}-*
          path: .artifacts/lanes
      - name: Summarize the failed outcome
        if: always() && needs.plan.outputs.work == 'true' && (needs.package.result != 'success' || (needs.validate.result != 'success' && !(needs.plan.outputs.mode == 'stable' && needs.validate.result == 'skipped')) || (needs.plan.outputs.mode != 'candidate' && (needs.plan.outputs.build == 'true' || needs.plan.outputs.installer_build == 'true') && (needs.publish.result != 'success' || needs.post_publish.result != 'success' || needs.complete.result != 'success')))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { execFileSync } from "node:child_process";
          import { readdirSync, readFileSync, statSync } from "node:fs";
          import { basename, join } from "node:path";
          const jobs = JSON.parse(execFileSync("gh", ["api", `repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}/jobs?per_page=100`, "--jq", "[.jobs[] | select(.conclusion == \"failure\") | .name]"], { encoding: "utf8" }));
          console.log(`## ${process.env.VERSION} did not complete publication`);
          console.log("");
          console.log(jobs.length > 0 ? `Failed jobs: ${jobs.map(name => `**${name}**`).join(", ")}` : "No job reported failure; inspect the run for a cancelled or skipped dependency.");
          const files = [];
          const walk = directory => { for (const entry of readdirSync(directory)) { const path = join(directory, entry); if (statSync(path).isDirectory()) walk(path); else if (entry.endsWith(".json")) files.push(path); } };
          try { walk(".artifacts/lanes"); } catch {}
          for (const path of files.sort()) {
            const evidence = JSON.parse(readFileSync(path, "utf8"));
            if (evidence.schema === "a1-validation-outcomes-v1") {
              for (const outcome of evidence.outcomes.filter(item => item.exitCode !== 0)) {
                console.log(`- ${basename(path, ".json")}: \`${outcome.id}\` exited ${outcome.exitCode} after ${(outcome.durationMs / 1000).toFixed(1)}s (\`${outcome.command}\`)${outcome.preparation ? ` [${outcome.preparation}]` : ""}`);
              }
            } else if (evidence.schema === "a1-startup-performance-evidence-v1") {
              for (const violation of evidence.budgetViolations ?? []) console.log(`- ${basename(path, ".json")} (${evidence.enforcement}): ${violation.message}`);
            }
          }
          NODE
      - name: Require the selected outcome
        shell: bash
        env:
          PLAN: ${{ needs.plan.result }}
          WORK: ${{ needs.plan.outputs.work }}
          BUILD: ${{ needs.plan.outputs.build }}
          INSTALLER_BUILD: ${{ needs.plan.outputs.installer_build }}
          PACKAGE: ${{ needs.package.result }}
          VALIDATE: ${{ needs.validate.result }}
          PUBLISH: ${{ needs.publish.result }}
          POST_PUBLISH: ${{ needs.post_publish.result }}
          COMPLETE: ${{ needs.complete.result }}
          MODE: ${{ needs.plan.outputs.mode }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          test "$PLAN" = success
          if [ "$WORK" != true ]; then
            echo "$VERSION already exists; successful no-op." >> "$GITHUB_STEP_SUMMARY"
          else
            test "$PACKAGE" = success
            # Invariant: only stable publication skips validation, because it adopts candidate-validated bytes.
            if [ "$MODE" = stable ]; then test "$VALIDATE" = skipped; else test "$VALIDATE" = success; fi
            if [ "$MODE" != candidate ] && { [ "$BUILD" = true ] || [ "$INSTALLER_BUILD" = true ]; }; then
              test "$PUBLISH" = success
              test "$POST_PUBLISH" = success
              test "$COMPLETE" = success
            fi
            if [ "$MODE" = candidate ]; then
              echo "$VERSION candidate validation passed; publishing its draft Release now publishes npm." >> "$GITHUB_STEP_SUMMARY"
            elif [ "$MODE" = stable ]; then
              echo "$VERSION is published to npm latest; the Release asset and master are complete." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$VERSION completed its required verification and publication outcome." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
