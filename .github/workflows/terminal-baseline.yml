name: Terminal baseline parity

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  unix-parity:
    name: ${{ matrix.runner }} / Node 24
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-14-xlarge, macos-15-xlarge]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --global @earendil-works/pi-coding-agent@0.84.1
      - name: Run mandatory terminal baseline
        run: npm run test:release
        env:
          ADDONE_RELEASE_RUNNER_LABEL: ${{ matrix.runner }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verdict-${{ matrix.runner }}
          path: artifacts/release-verdicts/*.json
          if-no-files-found: error

  windows-11-parity:
    name: Windows 11 x64 / Node 24
    # Physical automation is allowed only on an externally provisioned,
    # single-job disposable worker with an exclusive interactive desktop.
    # Never add a generic self-hosted/developer-workstation fallback here.
    runs-on: [self-hosted, Windows, X64, addone-windows11, addone-physical-isolated, ephemeral, exclusive-desktop]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --global @earendil-works/pi-coding-agent@0.84.1
      - name: Verify isolated physical worker allocation
        shell: pwsh
        run: |
          if (-not $env:ADDONE_PHYSICAL_ISOLATION_ATTESTATION) { throw "isolated-worker provisioner did not supply an attestation" }
          if (-not $env:ADDONE_PHYSICAL_WORKER_ALLOCATION_ID) { throw "isolated-worker provisioner did not supply an allocation identity" }
          . ./test/physical-host/windows/physical-worker-isolation.ps1
          Assert-AddOnePhysicalWorkerIsolation -AttestationPath $env:ADDONE_PHYSICAL_ISOLATION_ATTESTATION -RepositoryRoot . | ConvertTo-Json -Depth 8
      - name: Run isolated Windows physical smoke
        shell: pwsh
        run: npm run test:physical:windows:smoke
      - name: Run mandatory Windows Terminal/ConPTY baseline
        shell: pwsh
        run: npm run test:release
        env:
          ADDONE_RELEASE_RUNNER_LABEL: windows-11-x64-windows-terminal-conpty-isolated
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physical-smoke-windows-11-x64
          path: artifacts/windows-native-ui-smoke/**
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verdict-windows-11-x64
          path: artifacts/release-verdicts/*.json
          if-no-files-found: error
