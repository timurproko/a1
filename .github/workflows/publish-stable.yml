name: Publish npm stable

on:
  workflow_dispatch:
    inputs:
      certification_run_id:
        description: Successful Certify stable candidate workflow run id
        required: true
        type: string
      confirm_stable:
        description: Type "publish-certified-stable-latest"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: npm-stable-publication
  cancel-in-progress: false

jobs:
  publish-stable:
    name: Publish exact certified stable artifact
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm-develop
    steps:
      - name: Set up trusted Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Validate trusted certification and tagged master
        shell: bash
        env:
          CERTIFICATION_RUN_ID: ${{ inputs.certification_run_id }}
          CONFIRM_STABLE: ${{ inputs.confirm_stable }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$CONFIRM_STABLE" = "publish-certified-stable-latest"
          [[ "$CERTIFICATION_RUN_ID" =~ ^[0-9]+$ ]]
          node --input-type=module <<'NODE'
          import { appendFile } from "node:fs/promises";
          const headers = { accept: "application/vnd.github+json", authorization: `Bearer ${process.env.GITHUB_TOKEN}`, "x-github-api-version": "2022-11-28" };
          const load = async path => {
            const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/${path}`, { headers });
            if (!response.ok) throw new Error(`${path} returned HTTP ${response.status}`);
            return await response.json();
          };
          const run = await load(`actions/runs/${process.env.CERTIFICATION_RUN_ID}`);
          if (run.conclusion !== "success" || run.path !== ".github/workflows/certify-stable.yml") throw new Error("stable certification run is not trusted and successful");
          if (run.head_sha !== process.env.GITHUB_SHA || run.head_repository?.full_name !== process.env.GITHUB_REPOSITORY) throw new Error("stable certification source differs from release tag");
          const master = await load("git/ref/heads/master");
          if (master.object?.sha !== process.env.GITHUB_SHA) throw new Error("release tag is not the current master commit");
          const taggedCommit = await load(`commits/${encodeURIComponent(process.env.GITHUB_REF_NAME)}`);
          if (taggedCommit.sha !== process.env.GITHUB_SHA) throw new Error("release tag does not resolve to the accepted commit");
          const commit = await load(`git/commits/${process.env.GITHUB_SHA}`);
          await appendFile(process.env.GITHUB_ENV, `certified_source_commit=${run.head_sha}\ncertified_source_tree=${commit.tree.sha}\n`);
          NODE

      - name: Download certified stable candidate
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          run-id: ${{ inputs.certification_run_id }}
          pattern: stable-certified-candidate-*
          path: artifacts/stable
          merge-multiple: true
          github-token: ${{ github.token }}

      - name: Locate certified package and evidence
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tarballs < <(find artifacts/stable -type f -name candidate.tgz)
          mapfile -t evidence_files < <(find artifacts/stable -type f -name certified-stable-evidence.json)
          test "${#tarballs[@]}" -eq 1
          test "${#evidence_files[@]}" -eq 1
          echo "stable_tarball=${tarballs[0]}" >> "$GITHUB_ENV"
          echo "stable_evidence=${evidence_files[0]}" >> "$GITHUB_ENV"

      - name: Verify exact stable bytes and certification
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { appendFile, readFile } from "node:fs/promises";
          import { gunzipSync } from "node:zlib";
          const evidence = JSON.parse(await readFile(process.env.stable_evidence, "utf8"));
          const tarball = await readFile(process.env.stable_tarball);
          const integrity = `sha512-${createHash("sha512").update(tarball).digest("base64")}`;
          const shasum = createHash("sha1").update(tarball).digest("hex");
          if (evidence.schema !== "a1-release-certification-v1" || evidence.channel !== "latest") throw new Error("stable evidence schema or channel changed");
          if (evidence.source?.commit !== process.env.certified_source_commit || evidence.source?.tree !== process.env.certified_source_tree) throw new Error("stable evidence source differs from tagged master");
          if (!/^\d+\.\d+\.\d+$/.test(evidence.package?.version ?? "") || process.env.GITHUB_REF_NAME !== `v${evidence.package.version}`) throw new Error("stable version and tag differ");
          if (evidence.package?.integrity !== integrity || evidence.package?.shasum !== shasum) throw new Error("stable package digest differs from certification");
          if (evidence.package?.name !== evidence.identity?.packageName) throw new Error("stable package identity differs from certified product identity");
          if (evidence.certification?.class !== "stable-candidate" || evidence.certification?.stableEligible !== true || evidence.certification?.physical !== "certified" || evidence.certification?.crossPlatform !== "certified") throw new Error("stable certification is incomplete");
          const outcomeIds = new Set(evidence.validation?.outcomes?.filter(outcome => outcome.exitCode === 0).map(outcome => outcome.id));
          for (const platform of ["win32", "linux", "darwin"]) {
            if (!outcomeIds.has(`automated-${platform}`) || !outcomeIds.has(`physical-${platform}`)) throw new Error(`stable certification is missing ${platform}`);
          }
          const archive = gunzipSync(tarball);
          let manifest;
          for (let offset = 0; offset + 512 <= archive.length;) {
            const header = archive.subarray(offset, offset + 512);
            if (header.every(byte => byte === 0)) break;
            const text = buffer => { const end = buffer.indexOf(0); return buffer.subarray(0, end < 0 ? buffer.length : end).toString("utf8"); };
            const name = text(header.subarray(0, 100));
            const prefix = text(header.subarray(345, 500));
            const path = prefix ? `${prefix}/${name}` : name;
            const size = Number.parseInt(text(header.subarray(124, 136)).trim() || "0", 8);
            const start = offset + 512;
            if (path === "package/package.json") manifest = JSON.parse(archive.subarray(start, start + size).toString("utf8"));
            offset = start + Math.ceil(size / 512) * 512;
          }
          if (!manifest || manifest.name !== evidence.identity.packageName || manifest.version !== evidence.package.version) throw new Error("stable packed manifest differs from certification");
          if (JSON.stringify(manifest.bin) !== JSON.stringify({ [evidence.identity.commandName]: evidence.identity.cliEntry })) throw new Error("stable packed command differs from product identity");
          await appendFile(process.env.GITHUB_ENV, `package_name=${evidence.identity.packageName}\nversion=${evidence.package.version}\naccepted_integrity=${integrity}\naccepted_shasum=${shasum}\n`);
          NODE

      - name: Confirm stable version is unpublished
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(process.env.package_name)}/${process.env.version}?preflight=${Date.now()}`, { headers: { "cache-control": "no-cache" } });
          if (response.status !== 404) throw new Error(`${process.env.package_name}@${process.env.version} is not available: HTTP ${response.status}`);
          NODE

      - name: Publish exact certified tarball to npm latest
        run: npm publish "${{ env.stable_tarball }}" --tag latest --access public --ignore-scripts --provenance --registry https://registry.npmjs.org/

      - name: Verify exact npm latest artifact
        run: |
          node --input-type=module <<'NODE'
          let lastError;
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(process.env.package_name)}?verify=${Date.now()}`, { headers: { accept: "application/json", "cache-control": "no-cache" } });
              if (!response.ok) throw new Error(`registry returned HTTP ${response.status}`);
              const metadata = await response.json();
              const manifest = metadata.versions?.[process.env.version];
              if (!manifest) throw new Error(`${process.env.version} has not propagated`);
              if (metadata["dist-tags"]?.latest !== process.env.version) throw new Error("latest tag differs from certified version");
              if (manifest.dist?.integrity !== process.env.accepted_integrity || manifest.dist?.shasum !== process.env.accepted_shasum) throw new Error("registry bytes differ from certified package");
              process.exit(0);
            } catch (error) {
              lastError = error;
              if (attempt < 12) await new Promise(resolve => setTimeout(resolve, 5000));
            }
          }
          throw lastError;
          NODE

      - name: Upload stable publication evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: npm-stable-publication-${{ inputs.certification_run_id }}
          path: artifacts/stable/**/certified-stable-evidence.json
          if-no-files-found: warn
          retention-days: 90
