name: Build npm next candidate

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact clean develop commit to validate and package
        required: true
        type: string
      full:
        description: Widen candidate validation to the complete non-physical suite
        required: false
        default: false
        type: boolean
      confirm_candidate:
        description: Type "build-uncertified-next-candidate"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-next-candidate-${{ inputs.source_commit }}
  cancel-in-progress: false

jobs:
  guardians:
    name: Build process guardian (${{ matrix.os }})
    if: github.ref == 'refs/heads/develop'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Preserve repository bytes during checkout
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false

      - name: Check out exact candidate source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install build dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build integrity-bound process guardian
        run: npm run build:process-guardian

      - name: Upload platform guardian
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: process-guardian-${{ runner.os }}-${{ runner.arch }}
          path: dist/native
          if-no-files-found: error
          retention-days: 1

  candidate:
    name: Certified next candidate
    needs: guardians
    if: github.ref == 'refs/heads/develop'
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      version: ${{ steps.evidence.outputs.version }}
      integrity: ${{ steps.evidence.outputs.integrity }}
      shasum: ${{ steps.evidence.outputs.shasum }}
      source-commit: ${{ inputs.source_commit }}
    steps:
      - name: Preserve repository bytes during checkout
        shell: bash
        run: git config --global core.autocrlf false

      - name: Check out exact candidate source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate trusted develop range
        shell: bash
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          CONFIRM_CANDIDATE: ${{ inputs.confirm_candidate }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/develop"
          test "$CONFIRM_CANDIDATE" = "build-uncertified-next-candidate"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git fetch origin develop:refs/remotes/origin/develop
          test "$(git rev-parse origin/develop)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain)"

      - name: Select preview candidate validation
        id: impact
        shell: bash
        env:
          REQUEST_FULL: ${{ inputs.full }}
        run: |
          set -euo pipefail
          if [ "$REQUEST_FULL" = "true" ]; then
            selected='["full-release"]'
          else
            selected='["typecheck","architecture","fast","dist-integration","package-smoke","package-install","dependency-policy"]'
          fi
          mkdir -p artifacts/validation
          printf '{"schema":"a1-validation-impact-plan-v1","selected":%s,"reason":"lean preview policy: fast tier plus exact-package gates; full suite reserved for stable"}\n' "$selected" > artifacts/validation/impact.json
          echo "selected=$selected" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies and build once
        run: npm ci

      - name: Assemble all platform process guardians
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: process-guardian-*
          path: dist/native
          merge-multiple: true

      - name: Pack candidate once
        run: node scripts/prepare-validation-package.mjs

      - name: Execute selected validation against exact package
        shell: bash
        env:
          VALIDATION_SELECTION_JSON: ${{ steps.impact.outputs.selected }}
          VALIDATION_BUILD_READY: "1"
          VALIDATION_CANDIDATE_TARBALL: ${{ github.workspace }}\artifacts\validation\package\candidate.tgz
          A1_RELEASE_RUNNER_LABEL: github-windows-2025-uncertified-next-candidate
          A1_CONFIG_DIR: ${{ runner.temp }}\a1-candidate-config
          A1_DATA_DIR: ${{ runner.temp }}\a1-candidate-data
          A1_RUNTIME_DIR: ${{ runner.temp }}\a1-candidate-runtime
        run: node scripts/run-validation-tier.mjs --result artifacts/validation/outcomes.json

      - name: Bind candidate evidence
        id: evidence
        shell: bash
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          tree="$(git rev-parse "$SOURCE_COMMIT^{tree}")"
          node scripts/create-candidate-evidence.mjs \
            --tarball artifacts/validation/package/candidate.tgz \
            --impact artifacts/validation/impact.json \
            --outcomes artifacts/validation/outcomes.json \
            --commit "$SOURCE_COMMIT" \
            --tree "$tree" \
            --channel next \
            --output artifacts/validation/candidate-evidence.json
          node --input-type=module <<'NODE'
          import { appendFile, readFile } from "node:fs/promises";
          const evidence = JSON.parse(await readFile("artifacts/validation/candidate-evidence.json", "utf8"));
          await appendFile(process.env.GITHUB_OUTPUT, `version=${evidence.package.version}\nintegrity=${evidence.package.integrity}\nshasum=${evidence.package.shasum}\n`);
          NODE

      - name: Upload immutable candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: npm-next-candidate-${{ steps.evidence.outputs.version }}-${{ inputs.source_commit }}
          path: |
            artifacts/validation/package/candidate.tgz
            artifacts/validation/package/npm-pack-result.json
            artifacts/validation/impact.json
            artifacts/validation/outcomes.json
            artifacts/validation/candidate-evidence.json
          if-no-files-found: error
          retention-days: 14
