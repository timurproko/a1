name: Ready pull-request refresh

on:
  pull_request_target:
    branches: [develop]
    types: [closed]
  workflow_run:
    workflows: [Documentation auto-merge]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ready-pull-request-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh stale ready pull requests
    if: github.event_name == 'workflow_run' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out trusted default-branch policy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Mint the event-producing App identity for branch updates
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.OPENSPEC_ARCHIVE_APP_ID }}
          private-key: ${{ secrets.OPENSPEC_ARCHIVE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Refresh every stale ready pull request against current develop
        env:
          BRANCH_REFRESH_TOKEN: ${{ steps.app.outputs.token }}
        run: node scripts/governance/refresh-ready-pull-requests.mjs
