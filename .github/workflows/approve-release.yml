name: Stage stable release
run-name: Stage stable release ${{ github.event.client_payload.request_id }}

on:
  repository_dispatch:
    types: [a1-stable-release-reviewed]

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  authorize:
    name: Authorize freshly saved draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      release_id: ${{ steps.candidate.outputs.release_id }}
      request_id: ${{ steps.candidate.outputs.request_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Derive and authorize the reviewed candidate
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
          SELECTED_RELEASE_ID: ${{ github.event.client_payload.release_id }}
          SELECTED_SOURCE: ${{ github.event.client_payload.source }}
          REVIEWED_UPDATED_AT: ${{ github.event.client_payload.reviewed_updated_at }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { execFileSync } from "node:child_process";
          import { readFile } from "node:fs/promises";
          import { assertAuthorizedApprovalActor, validateStableApproval } from "./scripts/release/release-approval.mjs";
          const requestId = process.env.REQUEST_ID;
          const releaseId = Number(process.env.SELECTED_RELEASE_ID);
          const selectedSource = process.env.SELECTED_SOURCE;
          const reviewedUpdatedAt = process.env.REVIEWED_UPDATED_AT;
          if (!/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/u.test(requestId ?? "")
            || !Number.isSafeInteger(releaseId) || releaseId < 1 || !/^[a-f0-9]{40}$/u.test(selectedSource ?? "")
            || Number.isNaN(Date.parse(reviewedUpdatedAt ?? ""))) throw new Error("stable staging selectors are malformed");
          const token = process.env.GH_TOKEN;
          const repository = process.env.GITHUB_REPOSITORY;
          const actorName = process.env.ACTOR;
          const headers = { accept: "application/vnd.github+json", authorization: `Bearer ${token}`, "x-github-api-version": "2022-11-28" };
          const api = async path => {
            const response = await fetch(`https://api.github.com/${path}`, { headers });
            if (!response.ok) throw new Error(`GitHub API ${path} returned HTTP ${response.status}`);
            return await response.json();
          };
          const npm = async (name, version) => {
            const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${version}`, { headers: { accept: "application/json", "cache-control": "no-cache" } });
            if (response.status === 404) return null;
            if (!response.ok) throw new Error(`npm registry ${name}@${version} returned HTTP ${response.status}`);
            return await response.json();
          };
          const [actor, permission, authoritative, release] = await Promise.all([
            api(`users/${actorName}`), api(`repos/${repository}/collaborators/${actorName}/permission`),
            api(`repos/${repository}/git/ref/heads/develop`), api(`repos/${repository}/releases/${releaseId}`),
          ]);
          assertAuthorizedApprovalActor(actor, permission, actorName);
          const source = authoritative?.object?.sha;
          if (source !== selectedSource || execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim() !== source) {
            throw new Error("stable staging source is no longer authoritative develop");
          }
          if (release.id !== releaseId || release.target_commitish !== source || release.updated_at !== reviewedUpdatedAt) {
            throw new Error("selected draft changed after the observed Save draft handoff");
          }
          const version = /^v(\d+\.\d+\.\d+)$/u.exec(release.tag_name ?? "")?.[1];
          if (!version) throw new Error("selected draft does not name an exact stable version");
          const application = JSON.parse(await readFile("package.json", "utf8"));
          const lock = JSON.parse(await readFile("package-lock.json", "utf8"));
          const installer = JSON.parse(await readFile("packages/a1-install/package.json", "utf8"));
          const [existingApplication, existingInstaller] = await Promise.all([
            npm(application.name, version), npm(installer.name, version),
          ]);
          validateStableApproval({ version, source, releases: [release], expectedReleaseId: releaseId,
            application, lock, installer, existingApplication, existingInstaller });
          console.log(`version=${version}`);
          console.log(`release_id=${releaseId}`);
          console.log(`request_id=${requestId}`);
          NODE

  stage:
    name: Stage exact stable release
    needs: authorize
    uses: timurproko/a1/.github/workflows/publish.yml@develop
    with:
      channel: stable
      version: ${{ needs.authorize.outputs.version }}
      release_id: ${{ needs.authorize.outputs.release_id }}
      request_id: ${{ needs.authorize.outputs.request_id }}
    secrets: inherit
