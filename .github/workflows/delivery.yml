name: Delivery

# The change-delivery automation lives in timurproko/MyWorkflows and is shared by every repository:
# draft promotion, OpenSpec finalization, the delivery check, ready pull-request refresh and merged-branch
# deletion. This file only forwards events and the delivery bot's credentials to it.
on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, converted_to_draft, reopened, edited, closed]
  # Rationale: a release reopening merge made with GITHUB_TOKEN emits no pull-request event, so its
  # successful run is forwarded to refresh the remaining ready pull requests.
  workflow_run:
    workflows: [Release reopening auto-merge]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Implementation PR number to reconcile
        type: string
        required: true
      dry_run:
        description: Report the candidate classification without pushing
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: read

jobs:
  delivery:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: timurproko/MyWorkflows/.github/workflows/delivery.yml@main
    with:
      pr: ${{ inputs.pr }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      app_id: ${{ secrets.OPENSPEC_ARCHIVE_APP_ID }}
      app_private_key: ${{ secrets.OPENSPEC_ARCHIVE_APP_PRIVATE_KEY }}
