name: Publish npm next preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact manually accepted development preview version
        required: true
        type: string
      source_commit:
        description: Exact manually accepted develop commit
        required: true
        type: string
      integrity:
        description: Exact accepted npm pack sha512 integrity
        required: true
        type: string
      shasum:
        description: Exact accepted npm pack sha1 shasum
        required: true
        type: string
      confirm_uncertified:
        description: Type "publish-uncertified-next" to confirm deferred certification
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-next-publication
  cancel-in-progress: false

jobs:
  publish-next:
    name: Publish exact accepted preview
    if: github.ref == 'refs/heads/develop'
    runs-on: windows-2025
    timeout-minutes: 30
    environment: npm-next
    steps:
      - name: Preserve repository bytes during checkout
        shell: bash
        run: git config --global core.autocrlf false

      - name: Check out accepted source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Validate exact acceptance
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          ACCEPTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
          ACCEPTED_INTEGRITY: ${{ inputs.integrity }}
          ACCEPTED_SHASUM: ${{ inputs.shasum }}
          CONFIRM_UNCERTIFIED: ${{ inputs.confirm_uncertified }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/develop"
          test "$(git rev-parse HEAD)" = "$ACCEPTED_SOURCE_COMMIT"
          test "$CONFIRM_UNCERTIFIED" = "publish-uncertified-next"
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const identity = JSON.parse(await readFile("src/product-identity.json", "utf8"));
          const manifest = JSON.parse(await readFile("package.json", "utf8"));
          if (manifest.name !== identity.packageName || manifest.version !== process.env.REQUESTED_VERSION) throw new Error("preview package identity changed");
          NODE
          [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$ ]]
          [[ "$ACCEPTED_INTEGRITY" =~ ^sha512- ]]
          [[ "$ACCEPTED_SHASUM" =~ ^[a-f0-9]{40}$ ]]
          echo "version=$REQUESTED_VERSION" >> "$GITHUB_ENV"
          echo "accepted_integrity=$ACCEPTED_INTEGRITY" >> "$GITHUB_ENV"
          echo "accepted_shasum=$ACCEPTED_SHASUM" >> "$GITHUB_ENV"
          echo "source_commit=$ACCEPTED_SOURCE_COMMIT" >> "$GITHUB_ENV"

      - name: Install and run non-desktop gates
        run: npm ci && npm run check
        env:
          ADDONE_RELEASE_RUNNER_LABEL: github-windows-2025-uncertified-next

      - name: Pack and verify accepted bytes
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          mkdir -p artifacts
          npm pack --ignore-scripts --json > artifacts/npm-pack-result.json
          node --input-type=module <<'NODE'
          import { appendFile, readFile } from "node:fs/promises";
          const [result] = JSON.parse(await readFile("artifacts/npm-pack-result.json", "utf8"));
          const manifest = JSON.parse(await readFile("package.json", "utf8"));
          const identity = JSON.parse(await readFile("src/product-identity.json", "utf8"));
          if (!result?.filename || !result?.integrity || !result?.shasum) throw new Error("npm pack returned incomplete metadata");
          if (manifest.name !== identity.packageName || manifest.version !== process.env.version) throw new Error("packed manifest identity changed");
          if (JSON.stringify(manifest.bin) !== JSON.stringify({ [identity.commandName]: identity.artifacts.cliEntry })) throw new Error("package must expose only the authoritative command");
          if (result.integrity !== process.env.accepted_integrity) throw new Error("packed integrity differs from accepted bytes");
          if (result.shasum !== process.env.accepted_shasum) throw new Error("packed shasum differs from accepted bytes");
          await appendFile(process.env.GITHUB_OUTPUT, `tarball=${result.filename}\n`);
          NODE

      - name: Publish exact tarball to npm next
        shell: bash
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "$TARBALL" --tag next --access public --ignore-scripts --provenance --registry https://registry.npmjs.org/

      - name: Verify exact registry artifact
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const identity = JSON.parse(await readFile("src/product-identity.json", "utf8"));
          const packageUrl = `https://registry.npmjs.org/${encodeURIComponent(identity.packageName)}`;
          let lastError;
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              const response = await fetch(`${packageUrl}?verify=${Date.now()}`, { headers: { accept: "application/json", "cache-control": "no-cache" } });
              if (!response.ok) throw new Error(`registry returned HTTP ${response.status}`);
              const metadata = await response.json();
              const manifest = metadata.versions?.[process.env.version];
              if (!manifest) throw new Error(`${process.env.version} has not propagated`);
              if (manifest.dist?.integrity !== process.env.accepted_integrity) throw new Error("registry integrity differs from accepted bytes");
              if (manifest.dist?.shasum !== process.env.accepted_shasum) throw new Error("registry shasum differs from accepted bytes");
              if (metadata["dist-tags"]?.next !== process.env.version) throw new Error("next tag differs from accepted version");
              if (JSON.stringify(manifest.bin) !== JSON.stringify({ [identity.commandName]: identity.artifacts.cliEntry })) throw new Error("registry package exposes unexpected bins");
              process.exit(0);
            } catch (error) {
              lastError = error;
              if (attempt < 12) await new Promise(resolve => setTimeout(resolve, 5000));
            }
          }
          throw lastError;
          NODE

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: npm-next-${{ inputs.version }}-${{ inputs.source_commit }}
          path: |
            artifacts/npm-pack-result.json
            artifacts/release-verdicts/*.json
          if-no-files-found: warn
