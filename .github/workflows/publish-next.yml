name: Publish npm next preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact manually accepted development preview version
        required: true
        default: 0.1.5-dev.10
        type: string
      confirm_uncertified:
        description: Type "publish-uncertified-next" to confirm physical certification is deferred
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-next-publication
  cancel-in-progress: false

jobs:
  publish-next:
    name: Publish exact uncertified preview
    if: github.ref == 'refs/heads/develop'
    # This is a GitHub-hosted non-interactive runner. It does not execute the
    # isolated physical-terminal workflow or inject desktop input.
    runs-on: windows-2025
    timeout-minutes: 30
    environment: npm-next
    env:
      ACCEPTED_SOURCE_COMMIT: 3904de4c879f71a5a02a9bb02a74a1f009d5ec0f
      ACCEPTED_TARBALL_INTEGRITY: sha512-XjwhIsCbZjJbAwFQjWLnSsSS6Lb21Uls1MhkQUXOAiJh5Fg7IfQI4Ol4gMUGuzxSzOf38Cor+F+zB8nHLh79Dg==
      ACCEPTED_TARBALL_SHASUM: 4af9a7697ad79209214889a8c56f3bb19228fb65
    steps:
      - name: Preserve repository bytes during checkout
        shell: bash
        run: git config --global core.autocrlf false

      - name: Check out exact manually accepted source
        uses: actions/checkout@v5
        with:
          ref: 3904de4c879f71a5a02a9bb02a74a1f009d5ec0f
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Validate manual publication request
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          CONFIRM_UNCERTIFIED: ${{ inputs.confirm_uncertified }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/develop"
          git merge-base --is-ancestor "$ACCEPTED_SOURCE_COMMIT" "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$ACCEPTED_SOURCE_COMMIT"
          test "$CONFIRM_UNCERTIFIED" = "publish-uncertified-next"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$PACKAGE_VERSION" = "$REQUESTED_VERSION"
          [[ "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$ ]]
          test "$PACKAGE_VERSION" = "0.1.5-dev.10"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "source_commit=$ACCEPTED_SOURCE_COMMIT" >> "$GITHUB_ENV"

      - name: Reproduce accepted candidate line endings
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          for (const path of ["package.json", "src/foundation/storage/control-store.ts"]) {
            const source = await readFile(path, "utf8");
            if (source.includes("\r")) throw new Error(`${path} checkout was not normalized to LF`);
            await writeFile(path, source.replaceAll("\n", "\r\n"));
          }
          NODE
          git diff --ignore-space-at-eol --exit-code

      - name: Install exact locked dependencies
        run: npm ci

      - name: Run non-desktop release gates
        run: npm run check
        env:
          ADDONE_RELEASE_RUNNER_LABEL: github-windows-2025-uncertified-next

      - name: Pack exact candidate once
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm pack --ignore-scripts --json > artifacts/npm-pack-result.json
          node --input-type=module <<'NODE'
          import { appendFile, readFile } from "node:fs/promises";
          const pack = JSON.parse(await readFile("artifacts/npm-pack-result.json", "utf8"));
          const result = pack[0];
          if (!result?.filename || !result?.integrity || !result?.shasum) throw new Error("npm pack returned incomplete metadata");
          if (result.integrity !== process.env.ACCEPTED_TARBALL_INTEGRITY) throw new Error(`packed integrity ${result.integrity} does not match manually accepted bytes`);
          if (result.shasum !== process.env.ACCEPTED_TARBALL_SHASUM) throw new Error(`packed shasum ${result.shasum} does not match manually accepted bytes`);
          await appendFile(process.env.GITHUB_OUTPUT, `tarball=${result.filename}\nintegrity=${result.integrity}\nshasum=${result.shasum}\n`);
          NODE

      - name: Record uncertified preview evidence
        shell: bash
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          INTEGRITY: ${{ steps.pack.outputs.integrity }}
          SHASUM: ${{ steps.pack.outputs.shasum }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, writeFile } from "node:fs/promises";
          import { createUncertifiedDevelopmentPreviewEvidence } from "./dist/src/foundation/release/index.js";
          const evidence = createUncertifiedDevelopmentPreviewEvidence({
            packageName: "@timurproko/addone",
            version: process.env.version,
            commit: process.env.source_commit,
            tarball: process.env.TARBALL,
            integrity: process.env.INTEGRITY,
            shasum: process.env.SHASUM,
            platform: process.platform,
            architecture: process.arch,
            recordedAt: new Date().toISOString(),
          });
          await mkdir("artifacts", { recursive: true });
          await writeFile("artifacts/development-preview-candidate.json", JSON.stringify(evidence, null, 2));
          NODE

      - name: Check for an existing exact registry version
        id: registry
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFile } from "node:fs/promises";
          const response = await fetch(`https://registry.npmjs.org/@timurproko%2faddone/${process.env.version}`, {
            headers: { accept: "application/json", "cache-control": "no-cache" },
          });
          if (response.status === 404) {
            await appendFile(process.env.GITHUB_OUTPUT, "exists=false\n");
          } else {
            if (!response.ok) throw new Error(`registry lookup failed with HTTP ${response.status}`);
            const manifest = await response.json();
            if (manifest.dist?.integrity !== process.env.ACCEPTED_TARBALL_INTEGRITY) throw new Error("existing registry integrity differs from accepted bytes");
            if (manifest.dist?.shasum !== process.env.ACCEPTED_TARBALL_SHASUM) throw new Error("existing registry shasum differs from accepted bytes");
            await appendFile(process.env.GITHUB_OUTPUT, "exists=true\n");
          }
          NODE

      - name: Publish exact tarball to npm next
        if: steps.registry.outputs.exists != 'true'
        shell: bash
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "$TARBALL" --tag next --access public --ignore-scripts --provenance=false --registry https://registry.npmjs.org/

      - name: Verify exact registry artifact and preserve latest
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const packageUrl = "https://registry.npmjs.org/@timurproko%2faddone";
          let lastError;
          let verified = false;
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              const response = await fetch(`${packageUrl}?verify=${Date.now()}`, {
                headers: { accept: "application/json", "cache-control": "no-cache" },
              });
              if (!response.ok) throw new Error(`registry returned HTTP ${response.status}`);
              const metadata = await response.json();
              const manifest = metadata.versions?.[process.env.version];
              if (!manifest) throw new Error(`${process.env.version} has not propagated`);
              if (manifest.dist?.integrity !== process.env.ACCEPTED_TARBALL_INTEGRITY) throw new Error("registry integrity differs from accepted bytes");
              if (manifest.dist?.shasum !== process.env.ACCEPTED_TARBALL_SHASUM) throw new Error("registry shasum differs from accepted bytes");
              if (metadata["dist-tags"]?.next !== process.env.version) throw new Error("next tag has not propagated");
              if (metadata["dist-tags"]?.latest !== "0.1.4") throw new Error("latest tag changed unexpectedly");
              console.log(`Verified: ${process.env.version}\nnext: ${metadata["dist-tags"].next}\nlatest: ${metadata["dist-tags"].latest}`);
              verified = true;
              break;
            } catch (error) {
              lastError = error;
              if (attempt < 12) await new Promise(resolve => setTimeout(resolve, 5000));
            }
          }
          if (!verified) throw lastError;
          NODE

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: npm-next-${{ inputs.version }}-${{ github.sha }}
          path: |
            artifacts/development-preview-candidate.json
            artifacts/npm-pack-result.json
            artifacts/release-verdicts/*.json
          if-no-files-found: warn
