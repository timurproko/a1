name: Publish npm next preview

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Build npm next candidate workflow run id
        required: true
        type: string
      confirm_uncertified:
        description: Type "publish-uncertified-next"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: npm-next-publication
  cancel-in-progress: false

jobs:
  publish-next:
    name: Publish exact certified preview artifact
    if: github.ref == 'refs/heads/develop'
    runs-on: windows-2025
    timeout-minutes: 15
    environment: npm-next
    steps:
      - name: Set up trusted Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate trusted candidate run
        shell: bash
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CONFIRM_UNCERTIFIED: ${{ inputs.confirm_uncertified }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/develop"
          test "$CONFIRM_UNCERTIFIED" = "publish-uncertified-next"
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]
          node --input-type=module <<'NODE'
          import { appendFile } from "node:fs/promises";
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.CANDIDATE_RUN_ID}`, {
            headers: { accept: "application/vnd.github+json", authorization: `Bearer ${process.env.GITHUB_TOKEN}`, "x-github-api-version": "2022-11-28" },
          });
          if (!response.ok) throw new Error(`candidate run lookup returned HTTP ${response.status}`);
          const run = await response.json();
          if (run.conclusion !== "success") throw new Error(`candidate run is not successful: ${run.conclusion}`);
          if (run.event !== "workflow_dispatch" || run.path !== ".github/workflows/preview-candidate.yml") throw new Error("candidate run used an unexpected workflow");
          if (run.head_branch !== "develop" || run.head_sha !== process.env.GITHUB_SHA) throw new Error("candidate run is not the current develop commit");
          if (run.head_repository?.full_name !== process.env.GITHUB_REPOSITORY) throw new Error("candidate run came from another repository");
          await appendFile(process.env.GITHUB_ENV, `candidate_source_commit=${run.head_sha}\n`);
          NODE

      - name: Download immutable candidate
        uses: actions/download-artifact@v6
        with:
          run-id: ${{ inputs.candidate_run_id }}
          pattern: npm-next-candidate-*
          path: artifacts/candidate
          merge-multiple: true
          github-token: ${{ github.token }}

      - name: Locate exact candidate files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tarballs < <(find artifacts/candidate -type f -name candidate.tgz)
          mapfile -t evidence_files < <(find artifacts/candidate -type f -name candidate-evidence.json)
          test "${#tarballs[@]}" -eq 1
          test "${#evidence_files[@]}" -eq 1
          echo "candidate_tarball=${tarballs[0]}" >> "$GITHUB_ENV"
          echo "candidate_evidence=${evidence_files[0]}" >> "$GITHUB_ENV"

      - name: Verify exact certified bytes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { appendFile, readFile } from "node:fs/promises";
          import { gunzipSync } from "node:zlib";
          const evidence = JSON.parse(await readFile(process.env.candidate_evidence, "utf8"));
          const tarball = await readFile(process.env.candidate_tarball);
          const integrity = `sha512-${createHash("sha512").update(tarball).digest("base64")}`;
          const shasum = createHash("sha1").update(tarball).digest("hex");
          if (evidence.schema !== "a1-release-certification-v1") throw new Error("candidate evidence schema changed");
          if (evidence.source?.commit !== process.env.candidate_source_commit) throw new Error("candidate source commit differs from trusted run");
          if (evidence.channel !== "next" || !/^\d+\.\d+\.\d+-dev\.\d+$/.test(evidence.package?.version ?? "")) throw new Error("candidate is not a development preview");
          if (evidence.package?.integrity !== integrity || evidence.package?.shasum !== shasum) throw new Error("candidate digest differs from evidence");
          if (evidence.package?.name !== evidence.identity?.packageName) throw new Error("candidate package differs from product identity evidence");
          if (evidence.certification?.class !== "uncertified-development-preview" || evidence.certification?.stableEligible !== false) throw new Error("candidate certification class changed");
          if (!Array.isArray(evidence.validation?.selected) || evidence.validation.selected.length === 0 || !Array.isArray(evidence.validation?.outcomes) || evidence.validation.outcomes.length === 0 || evidence.validation.outcomes.some(outcome => outcome.exitCode !== 0)) throw new Error("candidate validation evidence is incomplete or failed");
          if (Date.now() - Date.parse(evidence.createdAt) > 14 * 24 * 60 * 60 * 1000 || Date.parse(evidence.createdAt) > Date.now() + 5 * 60 * 1000) throw new Error("candidate evidence is expired or future-dated");
          const archive = gunzipSync(tarball);
          let manifest;
          for (let offset = 0; offset + 512 <= archive.length;) {
            const header = archive.subarray(offset, offset + 512);
            if (header.every(byte => byte === 0)) break;
            const text = buffer => { const end = buffer.indexOf(0); return buffer.subarray(0, end < 0 ? buffer.length : end).toString("utf8"); };
            const name = text(header.subarray(0, 100));
            const prefix = text(header.subarray(345, 500));
            const path = prefix ? `${prefix}/${name}` : name;
            const size = Number.parseInt(text(header.subarray(124, 136)).trim() || "0", 8);
            const start = offset + 512;
            if (path === "package/package.json") manifest = JSON.parse(archive.subarray(start, start + size).toString("utf8"));
            offset = start + Math.ceil(size / 512) * 512;
          }
          if (!manifest || manifest.name !== evidence.package.name || manifest.version !== evidence.package.version) throw new Error("packed manifest differs from evidence");
          if (JSON.stringify(manifest.bin) !== JSON.stringify({ [evidence.identity.commandName]: evidence.identity.cliEntry }) || JSON.stringify(manifest.bin) !== JSON.stringify(evidence.package.bin)) throw new Error("packed command surface differs from product identity evidence");
          await appendFile(process.env.GITHUB_ENV, `package_name=${evidence.identity.packageName}\nversion=${evidence.package.version}\naccepted_integrity=${integrity}\naccepted_shasum=${shasum}\n`);
          NODE

      - name: Check for exact existing registry artifact
        id: registry
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFile } from "node:fs/promises";
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(process.env.package_name)}/${process.env.version}`, { headers: { accept: "application/json", "cache-control": "no-cache" } });
          if (response.status === 404) await appendFile(process.env.GITHUB_OUTPUT, "exists=false\n");
          else {
            if (!response.ok) throw new Error(`registry returned HTTP ${response.status}`);
            const manifest = await response.json();
            if (manifest.dist?.integrity !== process.env.accepted_integrity || manifest.dist?.shasum !== process.env.accepted_shasum) throw new Error("existing registry bytes differ from candidate");
            await appendFile(process.env.GITHUB_OUTPUT, "exists=true\n");
          }
          NODE

      - name: Publish exact candidate tarball to npm next
        if: steps.registry.outputs.exists != 'true'
        run: npm publish "${{ env.candidate_tarball }}" --tag next --access public --ignore-scripts --provenance --registry https://registry.npmjs.org/

      - name: Verify exact registry artifact
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          let lastError;
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(process.env.package_name)}?verify=${Date.now()}`, { headers: { accept: "application/json", "cache-control": "no-cache" } });
              if (!response.ok) throw new Error(`registry returned HTTP ${response.status}`);
              const metadata = await response.json();
              const manifest = metadata.versions?.[process.env.version];
              if (!manifest) throw new Error(`${process.env.version} has not propagated`);
              if (manifest.dist?.integrity !== process.env.accepted_integrity || manifest.dist?.shasum !== process.env.accepted_shasum) throw new Error("registry bytes differ from candidate");
              if (metadata["dist-tags"]?.next !== process.env.version) throw new Error("next tag differs from candidate");
              process.exit(0);
            } catch (error) {
              lastError = error;
              if (attempt < 12) await new Promise(resolve => setTimeout(resolve, 5000));
            }
          }
          throw lastError;
          NODE

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: npm-next-publication-${{ inputs.candidate_run_id }}
          path: |
            artifacts/candidate/**/candidate-evidence.json
            artifacts/candidate/**/npm-pack-result.json
          if-no-files-found: warn
          retention-days: 30
