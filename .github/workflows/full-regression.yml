name: Full regression

on:
  schedule:
    # Keep complete regression ahead of publication without scheduling on the busiest top-of-hour boundary.
    - cron: '47 23 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: full-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  complete:
    name: Full regression
    uses: ./.github/workflows/full-regression-shared.yml
    with:
      source: ${{ github.sha }}
