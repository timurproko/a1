name: Full regression

on:
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  complete:
    name: Full regression
    uses: ./.github/workflows/full-regression-shared.yml
    with:
      source: ${{ github.sha }}
