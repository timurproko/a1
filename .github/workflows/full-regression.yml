name: Full regression

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  documentation:
    name: Full documentation review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/governance/check-code-documentation.mjs --mode full --result .artifacts/validation/code-documentation-full.json

  full-regression:
    needs: documentation
    name: Complete non-physical regression (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            node: 24
          - os: ubuntu-24.04
            node: 24
          - os: macos-15
            node: 24
          - os: windows-2025
            node: 22
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Preserve repository bytes during checkout
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false

      - name: Check out exact regression source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Enable Defender real-time protection for startup acceptance
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-MpPreference -DisableRealtimeMonitoring $false
          $deadline = (Get-Date).AddSeconds(30)
          do {
            $enabled = (Get-MpComputerStatus).RealTimeProtectionEnabled
            if ($enabled) { break }
            Start-Sleep -Seconds 1
          } while ((Get-Date) -lt $deadline)
          if (-not $enabled) { throw "Windows Defender real-time protection could not be enabled" }

      - name: Install dependencies and build once
        run: npm ci

      - name: Pack exact regression candidate once
        run: node scripts/release/prepare-validation-package.mjs

      - name: Run complete non-physical validation
        shell: bash
        env:
          VALIDATION_SELECTION_JSON: '["full-release"]'
          VALIDATION_BUILD_READY: "1"
          VALIDATION_DOCUMENTATION_FULL_READY: "1"
          VALIDATION_CANDIDATE_TARBALL: ${{ github.workspace }}/.artifacts/validation/package/candidate.tgz
          A1_RELEASE_RUNNER_LABEL: github-${{ matrix.os }}-node${{ matrix.node }}-full-regression
          A1_CONFIG_DIR: ${{ runner.temp }}/a1-full-config
          A1_DATA_DIR: ${{ runner.temp }}/a1-full-data
          A1_RUNTIME_DIR: ${{ runner.temp }}/a1-full-runtime
        run: node scripts/release/run-validation-tier.mjs --result .artifacts/validation/full-regression.json

      - name: Report gate ownership and timing
        if: always()
        shell: bash
        run: |
          if [ -f .artifacts/validation/full-regression.json ]; then
            node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFile } from "node:fs/promises";
          const result = JSON.parse(await readFile(".artifacts/validation/full-regression.json", "utf8"));
          console.log("## Complete regression outcomes\n");
          console.log(`Selected owners: ${result.selected.map(value => `\`${value}\``).join(", ")}\n`);
          console.log(`Total: **${((result.completedAt - result.startedAt) / 1000).toFixed(2)}s**\n`);
          console.log("| Owned gate | Seconds | Result |\n| --- | ---: | --- |");
          for (const outcome of result.outcomes) console.log(`| ${outcome.id} | ${(outcome.durationMs / 1000).toFixed(2)} | ${outcome.exitCode === 0 ? outcome.skipped ?? "passed" : "failed"} |`);
          NODE
          else
            echo "## Complete regression outcomes" >> "$GITHUB_STEP_SUMMARY"
            echo "Validation orchestration failed before producing owned outcomes." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload complete regression evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: full-regression-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            .artifacts/validation/full-regression.json
            .artifacts/validation/package/npm-pack-result.json
            .artifacts/release-verdicts/*.json
          if-no-files-found: warn
          retention-days: 30
