name: Documentation auto-merge

on:
  pull_request_target:
    branches: [develop]
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft, auto_merge_enabled, labeled, unlabeled]
  workflow_run:
    workflows: [Development validation]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: documentation-auto-merge-${{ github.event.pull_request.number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  enforce:
    name: Enforce documentation auto-merge policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      native-arm-binding: ${{ steps.reconcile.outputs.native-arm-binding }}
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Reconcile documentation auto-merge policy
        id: reconcile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/governance/manage-documentation-auto-merge.mjs

  native-arm-binding:
    needs: enforce
    if: ${{ needs.enforce.outputs.native-arm-binding != '' }}
    name: Verified native arm ${{ needs.enforce.outputs.native-arm-binding }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions:
      contents: read
    steps:
      - name: Retain the verified exact binding in trusted run metadata
        run: echo "Native-arm evidence recorded; no integration permission was granted to automation."
