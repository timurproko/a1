name: Documentation auto-merge

on:
  pull_request_target:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, auto_merge_enabled]
  workflow_run:
    workflows: [Development validation]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: documentation-auto-merge-${{ github.event.pull_request.number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  enforce:
    name: Enforce documentation auto-merge policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Reconcile documentation auto-merge policy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/governance/manage-documentation-auto-merge.mjs
